function lineRow(l,i){
  const used=new Set(((UI.modal&&UI.modal.draft&&UI.modal.draft.lines)||[]).map((x,j)=>j!==i?x.accountId:"").filter(Boolean));
  return `<div class="line" data-i="${i}">
    <select data-line="acct" data-i="${i}">${acctOptions(l.accountId,used)}</select>
    <input type="number" step="0.01" data-line="debit" data-i="${i}" value="${l.debit||""}" placeholder="0.00">
    <input type="number" step="0.01" data-line="credit" data-i="${i}" value="${l.credit||""}" placeholder="0.00">
    <button class="iconbtn" data-action="rm-line" data-i="${i}">${I.x}</button>
  </div>`;
}
function syncLines(){
  const d=UI.modal.draft;
  d.date=document.getElementById("tx-date").value;
  d.description=document.getElementById("tx-desc").value;
  const cm=document.getElementById("tx-comment"); if(cm) d.comment=cm.value;
  document.querySelectorAll("#lines .line").forEach(row=>{
    const i=+row.dataset.i;
    d.lines[i].accountId=row.querySelector("[data-line=acct]").value;
    d.lines[i].debit=parseFloat(row.querySelector("[data-line=debit]").value)||0;
    d.lines[i].credit=parseFloat(row.querySelector("[data-line=credit]").value)||0;
  });
  updateBal();
}
function updateBal(){
  const d=UI.modal.draft;
  let dr=0,cr=0;
  d.lines.forEach(l=>{const a=acctById(l.accountId);const c=a?accCur(a):base();dr+=toBase(l.debit||0,c);cr+=toBase(l.credit||0,c);});
  dr=round2(dr);cr=round2(cr);
  const diff=round2(dr-cr);
  const tol=Math.max(0.01,0.005*Math.max(dr,cr)); // absorb cross-currency rate rounding
  const ok=Math.abs(diff)<=tol && dr>0;
  const row=document.getElementById("balrow");
  row.className="balrow "+(ok?"ok":(dr||cr?"bad":""));
  row.innerHTML=`<span>Debits <strong class="num">${fmtBal(dr)}</strong> · Credits <strong class="num">${fmtBal(cr)}</strong> <span style="color:var(--faint)">(${base()})</span></span><span>${ok?"✓ Balanced":(dr||cr?"Off by "+fmtBal(Math.abs(diff)):"Enter amounts")}</span>`;
  const btn=document.getElementById("save-tx"); if(btn) btn.disabled=!ok;
}

/* ---- actions ---- */
/* ---- hash routing: the URL reflects the current view; an account register gets a shareable
   canonical URL (#/account/<id>). Hash (not real paths) so it works on any static host —
   local server, the Claude artifact, and GitHub Pages — with no server-side rewrites. ---- */
function applyHash(){
  const parts=(location.hash||"").replace(/^#\/?/,"").split("/");
  if(parts[0]==="ledger"){ UI.view="ledger"; }
  else if(parts[0]==="account"&&parts[1]){ const id=decodeURIComponent(parts[1]); if(acctById(id)){ UI.view="account"; UI.accountId=id; } else { UI.view="accounts"; } }
  else { UI.view="accounts"; }
}
function goHash(h){ if(location.hash===h){ render(); } else { location.hash=h; } } // set URL → hashchange re-renders; force a render if it's already there
window.addEventListener("hashchange",()=>{ applyHash(); render(); });
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  const a=el.dataset.action, id=el.dataset.id;
  switch(a){
    case "tab": goHash(el.dataset.view==="ledger"?"#/ledger":"#/accounts"); break;
    case "set-theme": S.settings.theme=el.dataset.theme; applyTheme(); save(); render(); break;
    case "toggle-type": {
      const on=!UI.collapsed[id]; UI.collapsed[id]=on; saveUIPrefs();
      const head=el.closest(".typehead");
      if(head){ head.classList.toggle("collapsed",on); const c=head.querySelector(".chev"); if(c){ c.title=on?"Expand":"Collapse"; c.setAttribute("aria-expanded",String(!on)); } }
      else render();
      break; }
    case "new-acct": acctModal(null); break;
    case "add-acct-in": acctModal(null, id); break;
    case "new-type": UI.modal={kind:"type",id:null,draft:{name:"",cls:(el.dataset.class||"asset"),comment:""}}; renderModal(); break;
    case "edit-type": { const t=typeById(id); if(t){ UI.modal={kind:"type",id,draft:{name:t.name,cls:t.class,comment:t.comment||""}}; renderModal(); } break; }
    case "del-type": { const tid=id; if(accountsInType(tid).length){ toast("This type has accounts — move or delete them first."); } else askConfirm("Delete this type?", ()=>{ S.types=S.types.filter(t=>t.id!==tid); save(); render(); }); break; }
    case "save-type": saveType(); break;
    case "edit-acct": acctModal(acctById(id)); break;
    case "del-acct": delAccount(id); break;
    case "new-tx": txModal(null); break;
    case "or-connect": orConnect(); break;
    case "or-disconnect": orDisconnect(); break;
    case "ai-draft": aiDraft(); break;
    case "open-account": goHash("#/account/"+encodeURIComponent(id)); break;
    case "reg-expand": { const set=UI.regExpanded||(UI.regExpanded=new Set()); if(set.has(id)) set.delete(id); else set.add(id); render(); break; }
    case "ledger-clear": UI.ledgerQuery=""; UI.ledgerAccount=""; render(); break;
    case "open-rates": UI.rateStatus=""; UI.modal={kind:"rates"}; renderModal(); break;
    case "fetch-rates": fetchRates(); break;
    case "open-data": UI.modal={kind:"data"}; renderModal(); break;
    case "save-location": saveLocation(); break;
    case "loc-preset": { const inp=document.getElementById("stg-ledger"); if(inp&&LOC&&LOC.defaults&&LOC.defaults[el.dataset.kind]){ inp.value=LOC.defaults[el.dataset.kind]; inp.dispatchEvent(new Event("input")); } break; }
    case "pick-path": { const inp=document.getElementById(el.dataset.target); if(!inp) break; const was=el.textContent; el.textContent="Opening…";
      fetch("/api/pick?kind="+encodeURIComponent(el.dataset.kind||"folder"),{cache:"no-store"}).then(r=>r.json()).then(o=>{ el.textContent=was; if(o.path){ inp.value=o.path; inp.dispatchEvent(new Event("input")); } }).catch(()=>{ el.textContent=was; toast("Couldn't open the file picker."); }); break; }
    case "export-json": doExportJSON(); break;
    case "export-csv": doExportCSV(); break;
    case "import-paste": doImport(document.getElementById("import-text").value); break;
    case "download-build": downloadLocalBuild(); break;
    case "edit-tx": txModal(S.transactions.find(t=>t.id===id)); break;
    case "del-tx": { const did=id; askConfirm("Delete this transaction?", ()=>{ S.transactions=S.transactions.filter(t=>t.id!==did); save(); render(); }); break; }
    case "close": dismissModal(); break;
    case "overlay": if(e.target===el){ dismissModal(); } break;
    case "confirm-yes": { const fn=pendingConfirm; dismissModal(fn); break; }
    case "conflict-reload": location.reload(); break;
    case "conflict-overwrite": if(STORE&&S) STORE.save(S,"force"); dismissModal(); break;
    case "save-acct": saveAcct(); break;
    case "add-line": syncLines(); UI.modal.draft.lines.push({accountId:"",debit:0,credit:0}); renderModal(); break;
    case "rm-line": syncLines(); UI.modal.draft.lines.splice(+el.dataset.i,1); if(UI.modal.draft.lines.length<2)UI.modal.draft.lines.push({accountId:"",debit:0,credit:0}); renderModal(); break;
    case "save-tx": saveTx(); break;
    case "del-tx-modal": { const did=UI.modal.id; askConfirm("Delete this transaction?", ()=>{ S.transactions=S.transactions.filter(t=>t.id!==did); save(); render(); }); break; }
  }
});

const TD_SERVER="Twelve Data";
function parseRate(res){
  // currency_conversion returns text like: "symbol;rate;timestamp\nEUR/USD;1.14787;169...\n"
  let text = (res&&typeof res.payload==="string") ? res.payload
           : (res&&res.content&&res.content[0]&&res.content[0].text) ? res.content[0].text
           : (res&&res.payload&&typeof res.payload==="object") ? "" : "";
  for(const ln of String(text).trim().split("\n")){
    const p=ln.split(";"); if(p.length>=2 && p[0].indexOf("/")>-1){ const v=parseFloat(p[1]); if(!isNaN(v)&&v>0) return v; }
  }
  if(res&&res.payload&&typeof res.payload==="object"&&res.payload.rate){ const v=parseFloat(res.payload.rate); if(!isNaN(v)) return v; }
  return 0;
}
function rateErrMsg(code){
  switch(code){
    case "needs_reauth": return "Twelve Data needs reconnecting — claude.ai Settings → Connectors, then retry.";
    case "server_not_connected": return "Add the Twelve Data connector in claude.ai Settings → Connectors.";
    case "selection_required": return "Pick the Twelve Data connector when prompted, then retry.";
    case "server_unavailable": return "Twelve Data is briefly unavailable — try again shortly.";
    default: return "Couldn't update rates ("+(code||"error")+"). Edit rates below.";
  }
}
async function fetchRates(){
  UI.rateStatus="Fetching…"; renderModal();
  const targets=Object.keys(S.settings.rates).filter(c=>c!=="USD");
  const c=window.claude; let mcp=null;
  try{ mcp = (c&&c.use) ? await c.use("mcp") : null; }catch(e){ mcp=null; }
  if(mcp){
    let ok=0, fail=0, stop="";
    for(const cur of targets){
      try{
        const res=await mcp.callTool(TD_SERVER,"currency_conversion",{symbol:cur+"/USD"});
        const rate=parseRate(res);
        if(rate>0){ S.settings.rates[cur]=round4(rate); ok++; } else fail++;
      }catch(err){
        fail++; const code=err&&err.code;
        if(code==="needs_reauth"||code==="server_not_connected"||code==="selection_required"){ stop=code; break; }
      }
    }
    S.settings.rates.USD=1;
    if(ok) S.settings.ratesUpdated=nowLocal();
    UI.rateStatus = stop ? rateErrMsg(stop)
      : ok ? `Updated ${ok} rate${ok>1?"s":""} from Twelve Data ✓${fail?` — ${fail} not found`:""}`
      : "No rates returned. Check the currency codes, or edit rates below.";
    save(); renderModal(); render(); return;
  }
  // Desktop build: pull rates through the local server, which proxies Twelve Data with your
  // API key (fiat + crypto + metals) and falls back to a free no-key fiat source when no key is set.
  if(STORE===FILE_STORE){
    let ok=0, fail=0;
    for(const cur of targets){
      try{
        const r=await fetch("/api/rates?symbol="+encodeURIComponent(cur+"/USD"),{cache:"no-store"});
        const j=await r.json(); const v=parseFloat(j&&j.rate);
        if(v>0){ S.settings.rates[cur]=round4(v); ok++; } else fail++;
      }catch(e){ fail++; }
    }
    S.settings.rates.USD=1;
    if(ok) S.settings.ratesUpdated=nowLocal();
    UI.rateStatus = ok ? `Updated ${ok} rate${ok>1?"s":""} ✓${fail?` — ${fail} not found (crypto/metals need TWELVEDATA_API_KEY on the server)`:""}`
                       : "No rates — check the app is online. Crypto/metals need TWELVEDATA_API_KEY on the server.";
    save(); renderModal(); render(); return;
  }
  // Plain browser without a connector: try the free, no-key fiat source directly.
  try{
    const res=await fetch("https://open.er-api.com/v6/latest/USD",{cache:"no-store"});
    if(!res.ok) throw 0; const j=await res.json(); if(!j||!j.rates) throw 0;
    let ok=0; targets.forEach(cur=>{ if(j.rates[cur]){ S.settings.rates[cur]=round4(1/j.rates[cur]); ok++; } });
    S.settings.rates.USD=1; S.settings.ratesUpdated=nowLocal();
    UI.rateStatus = ok?`Updated ${ok} fiat rate${ok>1?"s":""} ✓`:"No rates returned. Edit rates below.";
  }catch(err){ UI.rateStatus="No rate source in this view. Edit rates below."; }
  save(); renderModal(); render();
}

function saveAcct(){
  const name=document.getElementById("ac-name").value.trim();
  if(!name){ const el=document.getElementById("ac-name"); if(el){el.classList.add("invalid");el.focus();} toast("Give the account a name."); return; }
  const cls=document.getElementById("ac-class").value;
  let typeId=document.getElementById("ac-type").value;
  const currency=document.getElementById("ac-cur").value;
  const comment=(document.getElementById("ac-comment").value||"").trim();
  if(typeId==="__new"){
    const tn=document.getElementById("ac-newtype").value.trim();
    if(!tn){ toast("Name the new type."); return; }
    const t={id:uid(),name:tn,class:cls}; S.types.push(t); typeId=t.id;
  }
  if(!typeId){ toast("Choose a type for the account."); return; }
  const dup=S.accounts.some(a=>a.typeId===typeId && a.id!==UI.modal.id && (a.name||"").trim().toLowerCase()===name.toLowerCase());
  if(dup){ toast(`“${name}” already exists in this type — pick a different name.`); return; }
  if(S.settings.rates[currency]==null) S.settings.rates[currency]=1;
  if(UI.modal.id){ const acc=acctById(UI.modal.id); acc.name=name; acc.typeId=typeId; acc.currency=currency; acc.comment=comment; }
  else S.accounts.push({id:uid(),name,typeId,currency,comment});
  save();render();dismissModal();
}
function delAccount(id){
  if(S.transactions.some(t=>t.lines.some(l=>l.accountId===id))){ toast("This account is used in the ledger — remove those entries first."); return; }
  askConfirm("Delete this account?", ()=>{ S.accounts=S.accounts.filter(a=>a.id!==id); save(); render(); });
}
function saveType(){
  const name=document.getElementById("ty-name").value.trim();
  if(!name){ const el=document.getElementById("ty-name"); if(el){el.classList.add("invalid");el.focus();} toast("Name the type."); return; }

function saveTx(){
  syncLines();
  const d=UI.modal.draft;
  document.querySelectorAll("#lines .invalid").forEach(el=>el.classList.remove("invalid"));
  // required: any line that has an amount must have an account — flag the empties in red
  let firstBad=null;
  document.querySelectorAll("#lines .line").forEach(row=>{
    const l=d.lines[+row.dataset.i]; if(!l) return;
    if(((l.debit||0)||(l.credit||0)) && !l.accountId){ const sel=row.querySelector("[data-line=acct]"); sel.classList.add("invalid"); if(!firstBad) firstBad=sel; }
  });
  if(firstBad){ firstBad.focus(); toast("Choose an account for every line that has an amount."); return; }
  const lines=d.lines.filter(l=>l.accountId&&((l.debit||0)||(l.credit||0)));
  if(lines.length<2){ toast("A transaction needs at least two lines with an account and an amount."); return; }
  const seen=new Set();
  if(lines.some(l=>seen.has(l.accountId)||(seen.add(l.accountId),false))){ toast("The same account can't be on two lines of one entry."); return; }
  const prev=UI.modal.id?S.transactions.find(t=>t.id===UI.modal.id):null;
  const tx={id:UI.modal.id||uid(),date:d.date,description:(d.description||"").trim()||"(no description)",
    createdAt:(prev&&prev.createdAt)||new Date().toISOString(),   // immutable booking instant: preserved on edit, set once on create
    lines:lines.map(l=>({accountId:l.accountId,debit:round2(l.debit||0),credit:round2(l.credit||0)}))};
  if((d.comment||"").trim()) tx.comment=d.comment.trim();
  if(UI.modal.id){const idx=S.transactions.findIndex(t=>t.id===UI.modal.id);S.transactions[idx]=tx;}
  else S.transactions.push(tx);
  save();render();dismissModal();
}

function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escAttr(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// Flush on the way out, but SILENTLY: if this tab's copy is stale, the server rejects it (409)
// and we do nothing — a background tab must never clobber a fresher file just because it closed.
window.addEventListener("beforeunload",()=>{ try{ if(STORE&&S) STORE.save(S,"silent"); }catch(e){} });
function renderSchemaBlock(fileVer){
  document.getElementById("app").innerHTML=`<div style="max-width:560px;margin:12vh auto;padding:0 20px">
    <div class="warnbanner" role="alert" style="margin:0">
      <div class="wbrow crit"><b>⛔ This ledger was saved by a newer version.</b> The file is schema <b>v${esc(String(fileVer))}</b>, but this app understands up to schema <b>v${SCHEMA}</b>. To avoid corrupting your data, it will not be opened or overwritten here.</div>
      <div class="wbrow"><b>What to do:</b> open this ledger with the newer version of Ledgerbook, or update this copy of the app (git pull / re-download). Your file has not been touched.</div>
    </div>
    <div style="margin-top:14px;font-family:var(--fs-mono);font-size:12px;color:var(--faint)">${VERSION} · git ${esc(COMMIT)} · app schema v${SCHEMA} · file schema v${esc(String(fileVer))}</div>
  </div>`;
}
/* ============ OpenRouter AI — draft the legs of an entry (frontend-only, PKCE) ============
   You bring your OWN key: a browser-only OAuth flow (no backend, no copy-paste) mints a
   per-user key that lives in this browser's localStorage and nowhere else.

   NUMBERS ARE NEVER SENT. There is no toggle. Three hard gates guarantee it:
     (A) Whitelist — the request is assembled field-by-field from account NAMES/types only;
         amounts, balances and rates are never read into it. Accounts are referenced by
         letter tokens (A, B, C…), never their ids, so even the plumbing carries no digit.
     (B) Choke-point — every model-facing byte passes through orChat(), which stringifies the
         messages + schema and REFUSES to send if a single 0-9 survived redaction.
     (C) Preview — the exact bytes that were sent are shown to you after each draft.
   Free text is digit-scrubbed by scrubDigits() before it can reach the wire. (The `model`
   id, e.g. "openai/gpt-4o-mini", is routing metadata — not content the model reads — so it
   is deliberately outside the digit gate; nothing derived from your ledger ever is.) ======= */
const OR_KEY="ledgerbook.openrouter.key", OR_VERIFIER="ledgerbook.openrouter.verifier", OR_MODEL="ledgerbook.openrouter.model";
const OR_DEFAULT_MODEL="openai/gpt-4o-mini";
const orGetKey=()=>{ try{ return localStorage.getItem(OR_KEY)||""; }catch(_){ return ""; } };
const orModel=()=>{ try{ return localStorage.getItem(OR_MODEL)||OR_DEFAULT_MODEL; }catch(_){ return OR_DEFAULT_MODEL; } };
const orConnected=()=>!!orGetKey();

// Gate A / redaction: replace any digit-bearing run (5, 5.00, 1,200.50, A7…) with a token that
// contains NO ascii digit. Whitespace/structure is preserved so account catalogs stay readable.
function scrubDigits(s){ return String(s==null?"":s).replace(/[\d.,]*\d[\d.,]*/g,"‹num›"); }
// letters-only reference so account ids (uuids, full of digits) never leave: 0->A … 25->Z,26->AA
function orLetters(n){ let s="",m=n+1; while(m>0){ m--; s=String.fromCharCode(65+(m%26))+s; m=Math.floor(m/26); } return s; }

function b64url(bytes){ let s=btoa(String.fromCharCode.apply(null,new Uint8Array(bytes))); return s.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function sha256b64url(str){ const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)); return b64url(h); }
function randVerifier(){ const a=new Uint8Array(48); crypto.getRandomValues(a); return b64url(a); }

async function orConnect(){
  const verifier=randVerifier();
  try{ localStorage.setItem(OR_VERIFIER,verifier); }catch(_){}
  const challenge=await sha256b64url(verifier);
  const cb=location.origin+location.pathname;   // OpenRouter returns to this exact page with ?code=…
  location.href="https://openrouter.ai/auth?callback_url="+encodeURIComponent(cb)+"&code_challenge="+encodeURIComponent(challenge)+"&code_challenge_method=S256";
}
// Runs at boot: if we came back from OpenRouter with ?code=…, exchange it (with the stored PKCE
// verifier) for a user key, store it, and scrub the code out of the address bar.
async function orHandleCallback(){
  const q=new URLSearchParams(location.search); const code=q.get("code");
  if(!code) return false;
  let verifier=""; try{ verifier=localStorage.getItem(OR_VERIFIER)||""; }catch(_){}
  try{
    const r=await fetch("https://openrouter.ai/api/v1/auth/keys",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({code, code_verifier:verifier, code_challenge_method:"S256"})});
    const j=await r.json();
    if(j&&j.key){ try{ localStorage.setItem(OR_KEY,j.key); localStorage.removeItem(OR_VERIFIER); }catch(_){}; toast("OpenRouter connected."); }
    else toast("OpenRouter sign-in didn't return a key.");
  }catch(e){ toast("OpenRouter sign-in failed."); }
  try{ history.replaceState(null,"",location.origin+location.pathname+location.hash); }catch(_){}
  return true;
}
function orDisconnect(){ askConfirm("Disconnect OpenRouter? The key is removed from this browser.", ()=>{ try{ localStorage.removeItem(OR_KEY); }catch(_){}; toast("OpenRouter disconnected."); render(); }); }

// Gate A: build the outbound account catalog from a strict whitelist — ref, name, group, kind,
// currency. No balance, amount or rate is ever read here. Returns the ref→realId map too.
function orBuildAccounts(){
  const list=[], map={}; let i=0;
  for(const t of S.types){ for(const a of accountsInType(t.id)){
    const ref=orLetters(i++); map[ref]=a.id;
    list.push({ref, name:scrubDigits(a.name), group:scrubDigits(t.name), kind:t.class, currency:scrubDigits(accCur(a))});
  }}
  return {list, map};
}

// Gate B: the single choke-point. Nothing reaches OpenRouter except through here.
async function orChat(messages, schema){
  const key=orGetKey(); if(!key) throw new Error("Connect OpenRouter first.");
  const modelFacing=JSON.stringify({messages, response_format:schema});
  if(/[0-9]/.test(modelFacing)) throw new Error("Redaction gate: a digit reached the outbound payload — request blocked, nothing was sent.");
  const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",
    headers:{"authorization":"Bearer "+key,"content-type":"application/json","HTTP-Referer":location.origin,"X-Title":"Ledgerbook"},
    body:JSON.stringify({model:orModel(), messages, response_format:schema, temperature:0})});
  if(r.status===401) throw new Error("OpenRouter rejected the key — reconnect.");
  if(!r.ok) throw new Error("OpenRouter error "+r.status+".");
  const j=await r.json();
  const txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(!txt) throw new Error("The model returned nothing.");
  return txt;
}

// Ask the model ONLY which account to debit and which to credit (legs), by letter ref.
async function orDraftTx(userText){
  const {list,map}=orBuildAccounts();
  if(list.length<2) throw new Error("Add at least two accounts first.");
  const refs=list.map(a=>a.ref);
  const schema={type:"json_schema",json_schema:{name:"posting",strict:true,schema:{type:"object",additionalProperties:false,
    properties:{
      debit:{type:"string",enum:refs,description:"ref of the account to debit"},
      credit:{type:"string",enum:refs,description:"ref of the account to credit"},
      description:{type:"string",description:"a short entry description, words only, no numbers"}
    }, required:["debit","credit","description"]}}};
  const catalog=list.map(a=>a.ref+" — "+a.name+" ("+a.group+", "+a.kind+", "+a.currency+")").join("\n");
  const messages=[
    {role:"system",content:scrubDigits("You are a double-entry bookkeeping assistant. Pick which account to debit and which to credit for the described transaction, using only the account refs below. Never output any number or amount.\nAccounts:\n"+catalog)},
    {role:"user",content:scrubDigits(userText)}
  ];
  const raw=await orChat(messages, schema);
  let obj; try{ obj=JSON.parse(raw); }catch(_){ throw new Error("The model didn't return valid JSON."); }
  return {debitId:map[obj.debit], creditId:map[obj.credit], description:obj.description||"", sent:messages};
}

async function aiDraft(){
  const input=document.getElementById("ai-desc"); const txt=input?input.value.trim():"";
  if(!txt){ toast("Describe the transaction first."); if(input) input.focus(); return; }
  const btn=document.getElementById("ai-draft"); const was=btn?btn.innerHTML:"";
  if(btn){ btn.disabled=true; btn.textContent="Thinking…"; }
  try{
    syncLines();                                    // keep any amounts the user already typed
    const res=await orDraftTx(txt);
    const d=UI.modal.draft;
    if(!d.lines[0]) d.lines[0]={accountId:"",debit:0,credit:0};
    if(!d.lines[1]) d.lines[1]={accountId:"",debit:0,credit:0};
    if(res.debitId) d.lines[0].accountId=res.debitId;
    if(res.creditId) d.lines[1].accountId=res.creditId;
    if(!(d.description||"").trim() && res.description) d.description=scrubDigits(res.description);
    UI.modal.aiText=txt; UI.modal.aiSent=res.sent;  // Gate C: remember exactly what left the machine
    renderModal();
    toast("Legs drafted — enter the amount and review before saving.");
  }catch(e){ toast(String((e&&e.message)||e)); }
  finally{ if(btn){ btn.disabled=false; btn.innerHTML=was; } }
}

(async function boot(){
  try{ await orHandleCallback(); }catch(_){}          // finish an OpenRouter sign-in redirect, if any
  STORE = await pickStore();                       // composition root: choose the adapter once
  let loaded=null; try{ loaded=await STORE.load(); }catch(e){}
  if(loaded && Number(loaded.schemaVersion)>SCHEMA){ renderSchemaBlock(Number(loaded.schemaVersion)); return; } // refuse: file newer than app
  S = loaded ? migrate(loaded) : seed();
  normalizeState();
  loadUIPrefs();
  applyTheme();
  if(STORE===FILE_STORE){
    try{ GITINFO=await (await fetch("/api/version",{cache:"no-store"})).json(); }catch(e){ GITINFO=null; }
    if(!GITINFO || GITINFO.appVersion!==VERSION){ UI.modal={kind:"restart", serverVer:(GITINFO&&GITINFO.appVersion)||null}; }  // frontend/backend mismatch → prompt restart
  }
  STORE.save(S,"silent");   // persist any migration, but never clobber a file that moved under us at boot
  applyHash();              // honor a shared/bookmarked URL (e.g. #/account/<id>) on first load
  render();
  renderModal();
})();
</script>
