const SERVER_MJS="// Ledgerbook local server (Node, zero dependencies).\n// Serves index.html and owns the data files. The internet is touched only to\n// proxy exchange-rate lookups when you ask for them.\n//\n// Many ledgers: config.json holds a registry { ledgersRoot, current, ledgers:[{id,name,path,snapshotDir,color}] }.\n// The server always reads/writes the CURRENT ledger; /api/ledgers lists, creates, switches, renames, recolours\n// and removes them. A v1 single-ledger config (or a fresh start) is migrated into the registry WITHOUT moving\n// any file. New ledgers are created under ledgersRoot (iCloud Drive when present, else ~/PersonalWealthTracker).\n//   ledger override : $LEDGER_PATH   (applies to the current ledger)\n//   snapshot override: $SNAPSHOT_DIR  (applies to the current ledger)\n// A snapshot is written on every save (deduped; newest SNAP_KEEP retained).\nimport { createServer } from \"http\";\nimport { readFile, writeFile, mkdir, readdir, unlink } from \"fs/promises\";\nimport { existsSync, readFileSync } from \"fs\";\nimport { homedir } from \"os\";\nimport { dirname, join, basename } from \"path\";\nimport { execSync, execFileSync } from \"child_process\";\nimport { createHash } from \"crypto\";\n\nconst PROJECT = \"personal-wealth-tracker\";\n// Single source of truth: the version lives ONLY in index.html's VERSION. Read it once at startup\n// (frozen for this process) so the frontend can detect a stale, not-yet-restarted server.\nconst APP_VERSION = (() => { try { const m = readFileSync(\"index.html\", \"utf8\").match(/const VERSION=\"(v\\d+)\"/); return m ? m[1] : \"unknown\"; } catch { return \"unknown\"; } })();\nconst PORT = process.env.PORT ? Number(process.env.PORT) : 8123;\nconst SNAP_KEEP = 300;\nconst CONFIG_DIR = process.env.PWT_CONFIG_DIR || join(process.cwd(), \".pwt\"); // project-local (git-ignored), not a hidden system folder\nconst CONFIG_FILE = join(CONFIG_DIR, \"config.json\");\nconst ICLOUD_BASE = join(homedir(), \"Library\", \"Mobile Documents\", \"com~apple~CloudDocs\");\nconst ICLOUD_DIR = join(ICLOUD_BASE, \"PersonalWealthTracker\");\nconst HOME_DIR = join(homedir(), \"PersonalWealthTracker\");\n// New ledgers land here. Prefer iCloud Drive (syncs across the user's Macs) when it actually exists,\n// otherwise a plain home folder so it also works off-Mac / without iCloud.\nconst DEFAULT_ROOT = existsSync(ICLOUD_BASE) ? ICLOUD_DIR : HOME_DIR;\n// A fixed set of distinct identity colours; each ledger gets a different one so they're tellable apart.\nconst PALETTE = [\"#2f7d5b\", \"#3563b8\", \"#b0741a\", \"#8a4fbe\", \"#b23a48\", \"#2a8f8f\", \"#6b8f2a\", \"#c25d8a\", \"#4a6fa5\", \"#a0562a\", \"#5a5f8f\", \"#3f8f5a\"];\nconst CONFIG_SCHEMA = 2;\n\nconst uid = () => Math.random().toString(36).slice(2, 10);\nconst slug = (s) => ((s || \"ledger\").toLowerCase().replace(/[^a-z0-9]+/g, \"-\").replace(/^-+|-+$/g, \"\").slice(0, 40) || \"ledger\");\nconst nextColor = (ledgers) => { const used = new Set(ledgers.map((l) => l.color)); return PALETTE.find((c) => !used.has(c)) || PALETTE[ledgers.length % PALETTE.length]; };\n\nasync function loadConfig() { try { return JSON.parse(await readFile(CONFIG_FILE, \"utf8\")); } catch { return {}; } }\nasync function saveConfig(c) { await mkdir(CONFIG_DIR, { recursive: true }); await writeFile(CONFIG_FILE, JSON.stringify(c, null, 2)); }\n\n// Bring any older config shape up to the registry, without moving a single file on disk.\nfunction migrate(c) {\n  if (c && Array.isArray(c.ledgers)) {\n    c.schema = CONFIG_SCHEMA; c.ledgersRoot = c.ledgersRoot || DEFAULT_ROOT;\n    c.ledgers.forEach((l, i) => { if (!l.id) l.id = uid(); if (!l.color) l.color = PALETTE[i % PALETTE.length]; if (!l.snapshotDir) l.snapshotDir = join(dirname(l.path), \"snapshots\"); });\n    if (!c.current && c.ledgers[0]) c.current = c.ledgers[0].id;\n    return c;\n  }\n  // v1 single-ledger config, or a fresh start: capture the currently-resolved ledger as the first entry.\n  const async function downloadLocalBuild(){
  if(typeof JSZip==="undefined"){ toast("Packaging tool not loaded yet — try again in a moment."); return; }
  toast("Packaging desktop build…");
  try{
    const zip=new JSZip();
    const html=buildLocalHTML();
    zip.file("index.html", html);
    zip.file("server.go", SERVER_GO);
    zip.file("server.mjs", SERVER_MJS);
    zip.file("README.md", READMEMD);
    const blob=await zip.generateAsync({type:"blob"});
    const c=window.claude; const dl=(c&&c.use)?await c.use("downloads"):null;
    if(dl){ await dl.save({filename:backupName("desktop.zip"), data:blob}); return; }
    toast("Download isn't available in this view.");
  }catch(err){ if(err&&err.code==="declined") return; toast("Couldn't build the archive."); }
}

/* ---- backup / restore ---- */
async function saveFile(filename,data){
  try{
    const c=window.claude; const dl=(c&&c.use)?await c.use("downloads"):null;
    if(dl){ await dl.save({filename,data}); return; }
  }catch(err){ if(err&&err.code==="declined") return; }
  // fallback (no downloads capability, e.g. run locally): show text to copy
  const box=document.getElementById("io-out");
  if(box){ box.style.display="block"; box.value=data; box.focus(); box.select(); }
  else { toast("Couldn't save the file here."); }
}
/* ---- ledgers (multi-book registry; server-backed, degrades to single-ledger on an old server) ---- */
let LEDGERS=null;
async function loadLedgers(){ try{ const r=await fetch("/api/ledgers",{cache:"no-store"}); LEDGERS = r.ok ? await r.json() : null; }catch(e){ LEDGERS=null; } }
const curLedger=()=> (LEDGERS&&LEDGERS.ledgers) ? (LEDGERS.ledgers.find(l=>l.current)||LEDGERS.ledgers[0]) : null;
// Reload the current ledger's book into S — the load half of boot(), reused when switching.
async function reloadBook(){
  let loaded=null; try{ loaded=await STORE.load(); }catch(e){}
  if(loaded && Number(loaded.schemaVersion)>SCHEMA){ renderSchemaBlock(Number(loaded.schemaVersion)); return false; }
  S = loaded ? migrate(loaded) : seed();
  normalizeState(); loadUIPrefs(); applyTheme(); applyFont(); applyHeadFont();
  STORE.save(S,"silent");
  return true;
}
async function switchLedger(id){
  if(curLedger()&&curLedger().id===id){ dismissModal(); return; }
  try{ const r=await fetch("/api/ledgers",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({op:"switch",id})}); if(!r.ok) throw 0; }
  catch(e){ toast("Couldn't switch ledger."); return; }
  const ok=await reloadBook(); await loadLedgers();
  dismissModal(); if(ok){ render(); toast("Now on “"+((curLedger()||{}).name||"ledger")+"”"); }
}
async function createLedger(name){
  const nm=(name||"").trim(); if(!nm){ toast("Name the new ledger."); return; }
  try{ const r=await fetch("/api/ledgers",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:nm})}); if(!r.ok) throw 0; }
  catch(e){ toast("Couldn't create the ledger."); return; }
  await reloadBook(); await loadLedgers(); render(); renderModal(); toast("Created “"+nm+"”");
}
async function ledgerOp(op,id,extra){
  try{ const r=await fetch("/api/ledgers",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({op,id},extra||{}))});
    if(r.status===409){ toast("That colour is already used by another ledger."); return false; } if(!r.ok) throw 0; }
  catch(e){ toast("Couldn't update the ledger."); return false; }
  await loadLedgers(); return true;
}

async function saveLocation(){
  const ledgerPath=(document.getElementById("stg-ledger").value||"").trim();
  const snapshotDir=(document.getElementById("stg-snap").value||"").trim();
  if(!ledgerPath.startsWith("/")){ toast("Ledger path must be absolute (start with /)."); return; }
  const base=ledgerPath.split("/").pop();
  if(ledgerPath.endsWith("/") || !base || !base.includes(".")){ toast("The ledger must be a file, not a folder — end the path with a filename like ledger.json."); return; }
  if(!/\.json$/i.test(base)){ toast(`The ledger must be a .json file — “${esc(base)}” isn't.`); return; }
  if(snapshotDir && !snapshotDir.startsWith("/")){ toast("Snapshots path must be absolute."); return; }
  const prev = LOC && LOC.ledgerPath;   // to roll back if the chosen file isn't a valid ledger
  const putLoc = (o)=>fetch("/api/location",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(o)}).then(r=>r.json());
  let res; try{ res=await putLoc({ledgerPath,snapshotDir}); }
  catch(e){ toast("Couldn't reach the local server."); return; }
  if(res.error){ toast(res.error); return; }
  if(res.ledgerExists){
    // adopting an existing file — it MUST be a real ledger (valid JSON with an accounts list), or we roll back
    let raw=null; try{ raw=await (await fetch("/api/book",{cache:"no-store"})).text(); }catch(e){}
    let parsed=null; try{ parsed=JSON.parse(raw); }catch(e){}
    if(!parsed || !Array.isArray(parsed.accounts)){
      if(prev){ try{ await putLoc({ledgerPath:prev}); }catch(e){} }
      toast(`“${esc(base)}” isn't a Ledgerbook file (needs JSON with an "accounts" list). Location unchanged.`);
      return;
    }
    if(Number(parsed.schemaVersion)>SCHEMA){
      if(prev){ try{ await putLoc({ledgerPath:prev}); }catch(e){} }
      toast(`“${esc(base)}” was saved by a newer version — not opened.`);
      return;
    }
    S=migrate(parsed); normalizeState(); loadUIPrefs();
    toast(`Opened ${esc(base)} — ${S.accounts.length} account${S.accounts.length===1?"":"s"} loaded.`);
  } else {
    await STORE.save(S);
    toast(`New file ${esc(base)} created here from your current book (${S.accounts.length} account${S.accounts.length===1?"":"s"}).`);
  }
  UI.modal=null; renderModal(); render();
}
async function doExportJSON(){
  await saveFile(backupName("json"), JSON.stringify(S,null,2));
}
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
async function doExportCSV(){
  const rows=[["date","description","account","currency","debit","credit","comment"]];
  [...S.transactions].sort((a,b)=>a.date<b.date?-1:1).forEach(t=>t.lines.forEach(l=>{
    const a=acctById(l.accountId);
    rows.push([t.date,t.description,a?a.name:"?",a?accCur(a):base(),l.debit||0,l.credit||0,t.comment||""]);
  }));
  await saveFile(backupName("ledger.csv"), rows.map(r=>r.map(csvCell).join(",")).join("\n"));
}
function doImport(text){
  let obj; try{ obj=JSON.parse(text); }catch(e){ toast("That doesn't look like valid JSON."); return; }
  if(!obj||!Array.isArray(obj.accounts)||!Array.isArray(obj.transactions)){ toast("Not a Ledgerbook backup (needs accounts and transactions)."); return; }
  askConfirm("Replace ALL current data with the imported file? This can't be undone.", ()=>{
    S = Array.isArray(obj.types)
      ? {types:obj.types,accounts:obj.accounts,transactions:obj.transactions,settings:obj.settings}
      : migrate(obj);   // accept older single-level backups too
    if(!S.settings||!S.settings.currency) S.settings={currency:"USD",rates:{USD:1}};
    if(!S.settings.rates) S.settings.rates={USD:1};
    if(!Array.isArray(S.types)) S.types=[];
    S.accounts.forEach(a=>{ if(!a.currency) a.currency=S.settings.currency; if(a.currency&&S.settings.rates[a.currency]==null) S.settings.rates[a.currency]=1; });
    if(S.settings.rates[S.settings.currency]==null) S.settings.rates[S.settings.currency]=1;
    save(); render(); toast("Book imported.");
  });
}

function acctModal(existing,presetTypeId){
  let draft;
  if(existing){ const t=typeById(existing.typeId); draft={name:existing.name,typeId:existing.typeId,currency:accCur(existing),cls:(t&&t.class)||"asset",comment:existing.comment||"",monetary:existing.monetary!=null?existing.monetary:((t&&t.class)!=="equity")}; }
  else { const pt=presetTypeId?typeById(presetTypeId):null; const c=(pt&&pt.class)||"asset"; draft={name:"",typeId:presetTypeId||"",currency:base(),cls:c,comment:"",monetary:(pt&&pt.monetary!=null)?pt.monetary:(c!=="equity")}; }
  // snapshot of the saved state, to keep Save disabled until something actually changes
  const orig=existing?{name:draft.name,typeId:draft.typeId,currency:draft.currency,comment:draft.comment,monetary:draft.monetary}:null;
  UI.modal={kind:"acct",id:existing?existing.id:null,draft,orig};
  renderModal();
}
/* ---- transaction modal ---- */
let LAST_LEGS=null;   // account ids of the last saved entry's two legs — pre-seeded into the next new entry so recurring postings (rent, salary) need no re-picking
function txModal(existing){
  // for a brand-new entry, seed the two legs with the accounts used last time (skip any that were since deleted)
  const seed=()=>{ const ex=(LAST_LEGS||[]).filter(id=>S.accounts.some(a=>a.id===id&&!a.deleted)); return [{accountId:ex[0]||"",debit:0,credit:0},{accountId:ex[1]||"",debit:0,credit:0}]; };
  const t=existing||{date:todayAccounting(),description:"",lines:seed()};
  UI.acctPickOpen=null; UI.acctPickFilter=""; UI.datePickOpen=false; UI.dateView="";
  UI.modal={kind:"tx",id:existing?existing.id:null,draft:JSON.parse(JSON.stringify(t))};
  renderModal();
  // smart form: land the cursor in Description so typing can start immediately (new entries only)
  if(!UI.modal.id) setTimeout(()=>{ const de=document.getElementById("tx-desc"); if(de) de.focus(); },0);
}
function acctOptions(sel,exclude){
  // only detail accounts are selectable — a class or type can never be posted to.
  // `exclude` (a Set of account ids used on OTHER lines) is omitted so the same
  // account can't be picked twice in one entry (keeps this line's own selection).
  let out=`<option value="">— account —</option>`;
  for(const [ck,cl] of CLASSES){
    typesInClass(ck).slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(t=>{
      const accts=accountsInType(t.id).slice().sort((a,b)=>a.name.localeCompare(b.name))
        .filter(a=>!(exclude&&exclude.has(a.id)&&a.id!==sel));
      if(!accts.length) return;
      out+=`<optgroup label="${esc(cl)} · ${esc(t.name)}">`;
      accts.forEach(a=>{ out+=`<option value="${a.id}" ${sel===a.id?"selected":""}>${esc(a.name)}</option>`; });
      out+=`</optgroup>`;
    });
  }
  return out;
}

function subCreate(){

  if(cEl) s.class=cEl.value; if(tEl) s.typeId=tEl.value; if(ntEl) s.newType=ntEl.value; if(nEl) s.name=nEl.value; if(cuEl) s.currency=cuEl.value;
  const name=(s.name||"").trim(); if(!name){ if(nEl){ nEl.classList.add("invalid"); nEl.focus(); } toast("Give the account a name."); return; }
  let t;
  if(s.typeId==="__new"){ const tn=(s.newType||"").trim(); if(!tn){ if(ntEl){ ntEl.classList.add("invalid"); ntEl.focus(); } toast("Name the new type."); return; }
    t=S.types.find(x=>x.class===s.class && (x.name||"").trim().toLowerCase()===tn.toLowerCase()); if(!t){ t={id:uid(),name:tn,class:s.class}; S.types.push(t); } }

  let acc=S.accounts.find(a=>a.typeId===t.id && (a.name||"").trim().toLowerCase()===name.toLowerCase());
  const existed=!!acc;
  if(!acc){ if(S.settings.rates[cur]==null) S.settings.rates[cur]=1; acc={id:uid(),name,typeId:t.id,currency:cur}; S.accounts.push(acc); }
  const L=UI.modal.draft.lines[UI.sub.legIndex]; if(L){ delete L._propose; L.accountId=acc.id; }
  UI.sub=null; save(); renderModal();
  toast(existed?`Using existing “${acc.name}”.`:`Created “${acc.name}” and set this leg.`);
}

// Multi-currency helper: in a 2-leg entry, fill the OTHER leg's balancing side with the converted amount

function autoConvertLeg(el){

  const i=+el.dataset.i, o=1-i, L=d.lines[i], O=d.lines[o];
  if(!L.accountId||!O.accountId) return;

(function(){

  const place=(host)=>{ const b=el(); const r=host.getBoundingClientRect(); const bw=b.offsetWidth, bh=b.offsetHeight;
    let x=Math.max(8,Math.min(r.left+r.width/2-bw/2, innerWidth-bw-8));

  const hide=()=>{ if(tip) tip.classList.remove("on"); };
  document.addEventListener("mouseover",e=>{ const h=e.target.closest("[data-tip]"); if(h) show(h); });
  document.addEventListener("mouseout",e=>{ const h=e.target.closest("[data-tip]"); if(h && !h.contains(e.relatedTarget)) hide(); });
  document.addEventListener("click",hide,true);

const TD_SERVER="Twelve Data";
function parseRate(res){
  // currency_conversion returns text like: "symbol;rate;timestamp\nEUR/USD;1.14787;169...\n"
  let text = (res&&typeof res.payload==="string") ? res.payload
           : (res&&res.content&&res.content[0]&&res.content[0].text) ? res.content[0].text
           : (res&&res.payload&&typeof res.payload==="object") ? "" : "";
  for(const ln of String(text).trim().split("\n")){
    const p=ln.split(";"); if(p.length>=2 && p[0].indexOf("/")>-1){ const v=parseFloat(p[1]); if(!isNaN(v)&&v>0) return v; }
  }
  if(res&&res.payload&&typeof res.payload==="object"&&res.payload.rate){ const v=parseFloat(res.payload.rate); if(!isNaN(v)) return v; }
  return 0;
}
function rateErrMsg(code){
  switch(code){
    case "needs_reauth": return "Twelve Data needs reconnecting — claude.ai Settings → Connectors, then retry.";
    case "server_not_connected": return "Add the Twelve Data connector in claude.ai Settings → Connectors.";
    case "selection_required": return "Pick the Twelve Data connector when prompted, then retry.";
    case "server_unavailable": return "Twelve Data is briefly unavailable — try again shortly.";
    default: return "Couldn't update rates ("+(code||"error")+"). Edit rates below.";
  }
}
async function fetchRates(){
  UI.rateStatus="Fetching…"; renderModal();
  const targets=Object.keys(S.settings.rates).filter(c=>c!=="USD");
  const c=window.claude; let mcp=null;
  try{ mcp = (c&&c.use) ? await c.use("mcp") : null; }catch(e){ mcp=null; }
  if(mcp){
    let ok=0, fail=0, stop="";
    for(const cur of targets){
      try{
        const res=await mcp.callTool(TD_SERVER,"currency_conversion",{symbol:cur+"/USD"});
        const rate=parseRate(res);
        if(rate>0){ S.settings.rates[cur]=round4(rate); ok++; } else fail++;
      }catch(err){
        fail++; const code=err&&err.code;
        if(code==="needs_reauth"||code==="server_not_connected"||code==="selection_required"){ stop=code; break; }
      }
    }
    S.settings.rates.USD=1;
    if(ok) S.settings.ratesUpdated=nowLocal();
    UI.rateStatus = stop ? rateErrMsg(stop)
      : ok ? `Updated ${ok} rate${ok>1?"s":""} from Twelve Data ✓${fail?` — ${fail} not found`:""}`
      : "No rates returned. Check the currency codes, or edit rates below.";
    save(); renderModal(); render(); return;
  }
  // Desktop build: pull rates through the local server, which proxies Twelve Data with your
  // API key (fiat + crypto + metals) and falls back to a free no-key fiat source when no key is set.
  if(STORE===FILE_STORE){
    let ok=0, fail=0;
    for(const cur of targets){
      try{
        const r=await fetch("/api/rates?symbol="+encodeURIComponent(cur+"/USD"),{cache:"no-store"});
        const j=await r.json(); const v=parseFloat(j&&j.rate);
        if(v>0){ S.settings.rates[cur]=round4(v); ok++; } else fail++;
      }catch(e){ fail++; }
    }
    S.settings.rates.USD=1;
    if(ok) S.settings.ratesUpdated=nowLocal();
    UI.rateStatus = ok ? `Updated ${ok} rate${ok>1?"s":""} ✓${fail?` — ${fail} not found (crypto/metals need TWELVEDATA_API_KEY on the server)`:""}`
                       : "No rates — check the app is online. Crypto/metals need TWELVEDATA_API_KEY on the server.";
    save(); renderModal(); render(); return;
  }
  // Plain browser without a connector: try the free, no-key fiat source directly.
  try{
    const res=await fetch("https://open.er-api.com/v6/latest/USD",{cache:"no-store"});
    if(!res.ok) throw 0; const j=await res.json(); if(!j||!j.rates) throw 0;
    let ok=0; targets.forEach(cur=>{ if(j.rates[cur]){ S.settings.rates[cur]=round4(1/j.rates[cur]); ok++; } });
    S.settings.rates.USD=1; S.settings.ratesUpdated=nowLocal();
    UI.rateStatus = ok?`Updated ${ok} fiat rate${ok>1?"s":""} ✓`:"No rates returned. Edit rates below.";
  }catch(err){ UI.rateStatus="No rate source in this view. Edit rates below."; }
  save(); renderModal(); render();
}

function acctDraftDirty(){
  if(!UI.modal||UI.modal.kind!=="acct") return false;
  if(!UI.modal.id) return true;                      // a new account is always "unsaved"
  const o=UI.modal.orig; if(!o) return true;
  const g=id=>document.getElementById(id);
  const name=(g("ac-name")?.value||"").trim();
  const typeId=g("ac-type")?.value;
  const newtype=(g("ac-newtype")?.value||"").trim();
  const currency=g("ac-cur")?.value;
  const comment=(g("ac-comment")?.value||"").trim();
  const monetary=!!(UI.modal.draft&&UI.modal.draft.monetary);
  return name!==o.name || currency!==o.currency || comment!==(o.comment||"") || monetary!==o.monetary
    || typeId!==o.typeId || (typeId==="__new" && !!newtype);
}

  else S.accounts.push({id:uid(),name,typeId,currency,comment,monetary});
  save();render();dismissModal();
}
function delAccount(id){
  if(S.transactions.some(t=>t.lines.some(l=>l.accountId===id))){ toast("This account is used in the ledger — remove those entries first."); return; }
  askConfirm("Delete this account?", ()=>{ S.accounts=S.accounts.filter(a=>a.id!==id); save(); render(); });
}
/* ---- currency conversion of an existing account -------------------------------------------------
   Changing an account's currency in place would silently restate its history (a 1,000 CAD balance is
   not 1,000 USD). The professional move is to move the balance to a NEW account in the target currency
   with a dated transfer at today's rate, and archive the old one — history stays in its own currency.
   Monetary accounts realize the FX gain/loss (book value vs today's value); non-monetary ones (equity,
   physical assets) carry the frozen value forward with no gain/loss. */
function acctHasEntries(id){ return S.transactions.some(t=>!t.deleted && (t.lines||[]).some(l=>l.accountId===id)); }
function acctNativeBal(id){ let n=0; for(const t of S.transactions){ if(t.deleted) continue; for(const l of (t.lines||[])) if(l.accountId===id) n+=(l.debit||0)-(l.credit||0); } return round2(n); }
function acctFrozenVehicle(id){ let v=0; for(const t of S.transactions){ if(t.deleted) continue; for(const l of (t.lines||[])) if(l.accountId===id) v+=((l.debit||0)-(l.credit||0))*lineRate(l); } return round2(v); }
const fmtRate=x=>{ if(!isFinite(x)||x<=0) return "—"; return (x>=1?(+x.toFixed(4)):(+x.toPrecision(4))).toString(); };
function computeConversion(accId,target,monetary){
  const acc=acctById(accId), src=accCur(acc);
  const N=acctNativeBal(accId), V=acctFrozenVehicle(accId);
  const rS=rateUSD(src), rT=rateUSD(target);
  const ok = !!acc && src!==target && rS>0 && rT>0 && Math.abs(N)>0.005;
  const costBasis = N!==0 ? V/N : rS;                 // weighted-average frozen rate → closing leg zeroes native AND frozen value
  const Vtoday = round2(N*rS);                         // today's value of the native balance, in the vehicle
  const newNative = monetary ? round2(N*rS/rT) : round2(V/rT);
  const fx = monetary ? round2(V - Vtoday) : 0;        // + = realized loss, − = realized gain
  const veh=vehicle();
  const legs=[
    {label:acc?acc.name:"—", cur:src, debit: N<0?round2(-N):0, credit: N>0?round2(N):0, rate:round4(costBasis), kind:"close"},
    {label:(acc?acc.name:"—")+" · "+target, cur:target, debit: N>0?round2(newNative):0, credit: N<0?round2(-newNative):0, rate:round4(rT), kind:"open"},
  ];
  if(monetary && Math.abs(fx)>=0.005)
    legs.push({label:"Foreign exchange "+(fx>0?"loss":"gain"), cur:veh, debit: fx>0?fx:0, credit: fx<0?round2(-fx):0, rate:round4(rateUSD(veh)), kind:"fx"});
  return {ok,src,target,monetary,N,V,rS,rT,costBasis,Vtoday,newNative,fx,veh,legs,crossRate: rT>0? rS/rT : 0};
}
function ensureFxAccount(){
  let a=S.accounts.find(x=>!x.deleted && x.name==="Foreign exchange gain/loss" && classOf(x)==="equity");
  if(a) return a;
  let ty=S.types.find(t=>t.class==="equity");
  if(!ty){ ty={id:uid(),name:"Equity",class:"equity"}; S.types.push(ty); }
  a={id:uid(),name:"Foreign exchange gain/loss",typeId:ty.id,currency:vehicle(),monetary:false,comment:"Auto-created: realized FX gain/loss from currency conversions."};
  S.accounts.push(a); return a;
}
function applyConversion(){
  const acc=acctById(UI.modal.id), d=UI.modal.draft;
  const c=computeConversion(UI.modal.id,d.target,d.monetary);
  if(!c.ok){ toast("Pick a different target currency."); return; }
  if(S.settings.rates[d.target]==null) S.settings.rates[d.target]=1;
  const na={id:uid(),name:acc.name,typeId:acc.typeId,currency:d.target,comment:acc.comment||"",monetary:!!acc.monetary};
  S.accounts.push(na);
  const fxAcc=(d.monetary && Math.abs(c.fx)>=0.005)?ensureFxAccount():null;
  const idFor=l=> l.kind==="close"?acc.id : l.kind==="open"?na.id : fxAcc.id;
  const lines=c.legs.map(l=>({accountId:idFor(l),debit:round2(l.debit||0),credit:round2(l.credit||0),rate:l.rate}));
  const tx={id:uid(),date:todayAccounting(),description:`Convert ${acc.name}: ${c.src} → ${c.target}`,
    createdAt:new Date().toISOString(),vehicle:vehicle(),lines};
  S.transactions.push(tx); logAudit("create",tx.id,{desc:tx.description});
  acc.deleted=true; acc.deletedAt=new Date().toISOString();            // archive the old account; its history stays referenced & visible
  save(); render(); dismissModal();
  toast(`Converted ${acc.name} to ${c.target}.`);
}
function saveType(){
  const name=document.getElementById("ty-name").value.trim();
  if(!name){ const el=document.getElementById("ty-name"); if(el){el.classList.add("invalid");el.focus();} toast("Name the type."); return; }
  const comment=(document.getElementById("ty-comment").value||"").trim();
  if(UI.modal.id){ const t=typeById(UI.modal.id); if(t){ t.name=name; t.comment=comment; } }
  else { const cls=document.getElementById("ty-class").value; const d=UI.modal.draft; const mon=(d&&d.monetary!=null)?d.monetary:(cls!=="equity"); S.types.push({id:uid(),name,class:cls,comment,monetary:mon}); }
  save();render();dismissModal();
}
function saveTx(){
  syncLines();
  const d=UI.modal.draft;
  document.querySelectorAll("#lines .invalid").forEach(el=>el.classList.remove("invalid"));
  // required: any line that has an amount must have an account — flag the empties in red
  let firstBad=null;
  document.querySelectorAll("#lines .line").forEach(row=>{
    const l=d.lines[+row.dataset.i]; if(!l) return;
    if(((l.debit||0)||(l.credit||0)) && !l.accountId){ const sel=row.querySelector("[data-line=acct]"); sel.classList.add("invalid"); if(!firstBad) firstBad=sel; }
  });
  if(firstBad){ firstBad.focus(); toast("Choose an account for every line that has an amount."); return; }
  const lines=d.lines.filter(l=>l.accountId&&((l.debit||0)||(l.credit||0)));
  if(lines.length<2){ toast("A transaction needs at least two lines with an account and an amount."); return; }
  const seen=new Set();
  if(lines.some(l=>seen.has(l.accountId)||(seen.add(l.accountId),false))){ toast("The same account can't be on two lines of one entry."); return; }
  const prev=UI.modal.id?S.transactions.find(t=>t.id===UI.modal.id):null;
  // Freeze each leg's USD rate (historical FX). On edit, keep the rate the same-currency leg was booked at
  // (so amounts can be corrected without rewriting history); snapshot the current rate for a new/changed leg.
  const prevRate=accId=>{ if(!prev) return null; const pl=(prev.lines||[]).find(x=>x.accountId===accId); return pl&&pl.rate!=null?pl.rate:null; };
  const tx={id:UI.modal.id||uid(),date:d.date,description:(d.description||"").trim()||"(no description)",
    createdAt:(prev&&prev.createdAt)||new Date().toISOString(),   // immutable booking instant: preserved on edit, set once on create
    vehicle:(prev&&prev.vehicle)||vehicle(),                      // the pivot the frozen rates are in — kept on edit so a later vehicle change isn't retrospective
    lines:lines.map(l=>{ const kept=prevRate(l.accountId); return {accountId:l.accountId,debit:round2(l.debit||0),credit:round2(l.credit||0),rate:(kept!=null?kept:round4(rateUSD(accCur(acctById(l.accountId)))))}; })};
  if((d.comment||"").trim()) tx.comment=d.comment.trim();
  if(UI.modal.id){const idx=S.transactions.findIndex(t=>t.id===UI.modal.id); if(prev&&prev.deleted){tx.deleted=prev.deleted;tx.deletedAt=prev.deletedAt;} S.transactions[idx]=tx; const ch=txDiff(prev||{},tx); if(ch.length) logAudit("edit",tx.id,{desc:tx.description,changes:ch});}
  else { S.transactions.push(tx); logAudit("create",tx.id,{desc:tx.description}); }
  LAST_LEGS=tx.lines.slice(0,2).map(l=>l.accountId);   // remember these legs for the next new entry
  save();render();dismissModal();
}

function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escAttr(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ==== RIGHT RAIL: quiet "food for thought" widgets that fill the gutter to the right of the
   860px content column on wide screens. Two independent panels, both controlled from Settings:
     • Currency trends — each account currency vs the base over ~6 months (ECB via frankfurter.dev)
     • Debt clock (easter egg, OFF by default) — a projected per-citizen public-debt figure for one
       country, ticking by the second (World Bank open data)
   These are the ONLY network use besides "Fetch live rates", and they send NOTHING about the
   ledger: currency codes for the chart, a 2-letter country code for the debt clock. All state is a
   UI preference (localStorage), never the ledger file — so no schema/version/API change. ==== */
const FX_CCY=new Set(["EUR","GBP","JPY","CAD","AUD","CHF","CNY","INR","BRL","MXN","SGD","HKD","NZD","SEK","NOK","PLN","ZAR","TRY","USD"]); // ECB/frankfurter coverage ∩ app currencies (AED is USD-pegged & not listed)
const CCY_COUNTRY={USD:"US",EUR:"DE",GBP:"GB",JPY:"JP",CAD:"CA",AUD:"AU",CHF:"CH",CNY:"CN",INR:"IN",BRL:"BR",MXN:"MX",SGD:"SG",HKD:"HK",NZD:"NZ",SEK:"SE",NOK:"NO",PLN:"PL",ZAR:"ZA",AED:"AE",TRY:"TR"}; // base currency → default country for the debt clock
const DEBT_COUNTRIES=[["US","United States"],["CA","Canada"],["GB","United Kingdom"],["UA","Ukraine"],["FI","Finland"],["DE","Germany"],["FR","France"],["IT","Italy"],["ES","Spain"],["PL","Poland"],["JP","Japan"],["CN","China"],["IN","India"],["AU","Australia"],["NZ","New Zealand"],["CH","Switzerland"],["SE","Sweden"],["NO","Norway"],["BR","Brazil"],["MX","Mexico"],["ZA","South Africa"],["TR","Türkiye"],["SG","Singapore"],["AE","United Arab Emirates"]];
const countryName=iso=>{ const f=DEBT_COUNTRIES.find(c=>c[0]===iso); return f?f[1]:iso; };
const debtCountry=()=> UI.debtCountry || CCY_COUNTRY[base()] || "US";
const fxRailOn=()=> UI.fxRail===true;        // default OFF — opt in from Settings
const debtClockOn=()=> UI.debtClock===true;  // default OFF — an easter egg you opt into
const railOn=()=> fxRailOn() || debtClockOn();
// compact currency/number helpers for the rail (the ledger's money() rounds to whole units by default)
function money1(v,cur){ try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:cur,minimumFractionDigits:2,maximumFractionDigits:4}).format(v);}catch(_){ return (+v).toFixed(2)+" "+cur; } }
function money0(v,cur){ try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:cur,minimumFractionDigits:0,maximumFractionDigits:0}).format(v);}catch(_){ return Math.round(v).toLocaleString()+" "+cur; } }
function nfmt(v){ try{ return new Intl.NumberFormat(undefined,{notation:"compact",maximumFractionDigits:1}).format(v);}catch(_){ return String(v); } }

let RAIL={sig:"",fx:null,fxErr:"",debt:null,debtErr:""};
let debtTimer=null;
function railSig(){ const curs=[...new Set(S.accounts.map(a=>accCur(a)))].sort().join(","); return [base(),curs,fxRailOn(),debtClockOn(),debtCountry()].join("|"); }

/* ---- Currency trends. Fetch the ECB series once with base=USD, then derive every cur→base cross
   rate = (base per USD) / (cur per USD), so any supported base works without a second request. ---- */
async function loadFx(){
  RAIL.fx=null; RAIL.fxErr="";
  if(!FX_CCY.has(base())){ RAIL.fxErr="Your base ("+base()+") isn't in the ECB series, so trends can't be drawn against it."; paintFx(); return; }
  const want=[...new Set(S.accounts.map(a=>accCur(a)))].filter(c=>c!==base() && FX_CCY.has(c));
  if(!want.length){ RAIL.fxErr="no-foreign"; paintFx(); return; }
  const syms=[...new Set([...want,base()])].filter(c=>c!=="USD");
  const end=new Date(), start=new Date(); start.setMonth(start.getMonth()-6);
  const d=x=>x.toISOString().slice(0,10);
  try{
    const url="https://api.frankfurter.dev/v1/"+d(start)+".."+d(end)+"?base=USD"+(syms.length?"&symbols="+encodeURIComponent(syms.join(",")):"");
    const j=await (await fetch(url,{cache:"no-store"})).json();
    const dates=Object.keys(j.rates||{}).sort();
    const per=(row,c)=> c==="USD"?1:(row&&row[c]);   // units of c per 1 USD on that day
    const series=want.map(c=>{
      const pts=dates.map(dt=>{ const row=j.rates[dt], cu=per(row,c), ba=per(row,base()); return (cu&&ba)? ba/cu : null; }).filter(v=>v!=null);
      if(pts.length<2) return null;
      const first=pts[0], last=pts[pts.length-1];
      return {cur:c,pts,last,pct:(last-first)/first*100};
    }).filter(Boolean);
    RAIL.fx=series;
  }catch(e){ RAIL.fxErr="Couldn't reach the rate history."; }
  paintFx();
}
function sparkPath(pts,w,h){
  const min=Math.min(...pts), max=Math.max(...pts), span=(max-min)||1, pad=2;
  const x=i=>pts.length<2?0:i/(pts.length-1)*w, y=v=>h-pad-((v-min)/span)*(h-2*pad);
  const line=pts.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  return {line,area:line+" L"+w+" "+h+" L0 "+h+" Z"};
}
function paintFx(){
  const n=document.getElementById("rail-fx"); if(!n) return;
  if(RAIL.fx===null && !RAIL.fxErr){ n.innerHTML='<div class="rsub">Loading…</div>'; return; }
  if(RAIL.fxErr==="no-foreign"){ n.innerHTML='<div class="rnote">Add an account in another currency to see how it moves against '+esc(base())+'.</div>'; return; }
  if(RAIL.fxErr){ n.innerHTML='<div class="rnote">'+esc(RAIL.fxErr)+'</div>'; return; }
  if(!RAIL.fx.length){ n.innerHTML='<div class="rnote">No chartable currencies right now.</div>'; return; }
  const W=110,H=34;
  n.innerHTML='<div class="fxlist">'+RAIL.fx.map(s=>{
    const sp=sparkPath(s.pts,W,H), up=s.pct>=0, flat=Math.abs(s.pct)<0.05;
    const hi=Math.max(...s.pts), lo=Math.min(...s.pts);
    return '<div class="fxrow">'
      +'<div class="fxhead"><span class="fxc">1 '+esc(s.cur)+'</span><span class="fxd '+(flat?"":(up?"up":"dn"))+'">'+(up?"+":"−")+Math.abs(s.pct).toFixed(1)+'%</span></div>'
      +'<div class="fxchart"><span class="fxbound hi">'+money1(hi,base())+'</span>'
      +'<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><path class="area" d="'+sp.area+'"/><path d="'+sp.line+'"/></svg>'
      +'<span class="fxbound lo">'+money1(lo,base())+'</span></div>'
      +'<div class="fxnow">now <b>'+money1(s.last,base())+'</b></div>'
      +'</div>';
  }).join("")+'</div>';
}

/* ---- Debt clock (easter egg). Central-government debt (World Bank % of GDP) × GDP gives a total in
   USD; two most-recent common years give an annual growth rate we extrapolate to *now*, second by
   second — the usdebtclock trick: interpolate on the client, don't poll. It's a projection, clearly
   labelled with the source year, not a live quote. ---- */
async function loadDebt(){
  RAIL.debt=null; RAIL.debtErr="";
  const iso=debtCountry();
  const wb=async ind=>{ const j=await (await fetch("https://api.worldbank.org/v2/country/"+iso+"/indicator/"+ind+"?format=json&mrv=12",{cache:"no-store"})).json();
    const map={}; ((Array.isArray(j)&&j[1])||[]).forEach(r=>{ if(r&&r.value!=null) map[r.date]=r.value; }); return map; };
  try{
    const [debtPct,gdp,pop]=await Promise.all([wb("GC.DOD.TOTL.GD.ZS"),wb("NY.GDP.MKTP.CD"),wb("SP.POP.TOTL")]);
    const years=Object.keys(debtPct).filter(y=>gdp[y]!=null&&pop[y]!=null).map(Number).sort((a,b)=>a-b);
    if(!years.length){ RAIL.debtErr="World Bank has no central-government-debt series for "+countryName(iso)+" — try another country."; paintDebt(); return; }
    const totalUsd=y=>debtPct[y]/100*gdp[y];
    const y2=years[years.length-1], y1=years.length>1?years[years.length-2]:null;
    const v2=totalUsd(y2), perYear=(y1!=null && y2>y1)?(v2-totalUsd(y1))/(y2-y1):0;
    RAIL.debt={iso,name:countryName(iso),year:y2,refUsd:v2,perYearUsd:perYear,pop:pop[y2],refInstant:Date.UTC(y2,6,1)};
  }catch(e){ RAIL.debtErr="Couldn't reach World Bank."; }
  paintDebt();
}
function debtNowUsd(){ const d=RAIL.debt; if(!d) return 0; return d.refUsd + d.perYearUsd*((Date.now()-d.refInstant)/1000/31557600); }
function paintDebt(){
  const n=document.getElementById("rail-debt"); if(!n) return;
  if(RAIL.debt===null && !RAIL.debtErr){ n.innerHTML='<div class="rsub">Loading…</div>'; return; }
  if(RAIL.debtErr){ n.innerHTML='<div class="rnote">'+esc(RAIL.debtErr)+'</div>'; stopDebtTick(); return; }
  const d=RAIL.debt;
  n.innerHTML='<div class="debtclock" id="debt-total"></div><div class="debt-pc" id="debt-pc"></div>'
    +'<div class="rsub">Est. central-government debt, projected from World Bank data for '+d.year+'. A thought, not a live quote.</div>';
  stopDebtTick(); tickDebt();
  if(!window.matchMedia("(prefers-reduced-motion:reduce)").matches && d.perYearUsd>0) debtTimer=setInterval(tickDebt,1000);
}
function compactMoney(v,cur){ try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:cur,notation:"compact",maximumFractionDigits:1}).format(v);}catch(_){ return nfmt(v)+" "+cur; } }
function tickDebt(){
  const d=RAIL.debt; if(!d) return;
  // Headline is the PER-CITIZEN figure (the "food for thought" hook). The national total is kept as
  // a compact aside, not a giant number. Four decimals so the tail visibly ticks second to second.
  const head=document.getElementById("debt-total"), sub=document.getElementById("debt-pc");
  if(!head||!sub){ stopDebtTick(); return; }
  const usd=debtNowUsd(), perBase=convert(usd/d.pop,"USD",base()), whole=Math.floor(perBase);
  const f4=String(Math.floor((perBase-whole)*1e4)).padStart(4,"0");
  head.innerHTML=money0(whole,base())+'<span class="dec">.'+f4.slice(0,2)+'<span class="dec2">'+f4.slice(2)+'</span></span>';
  sub.innerHTML='per citizen · '+compactMoney(convert(usd,"USD",base()),base())+' total · '+nfmt(d.pop)+' people';
}
function stopDebtTick(){ if(debtTimer){ clearInterval(debtTimer); debtTimer=null; } }

function viewRail(){
  let cards="";
  if(fxRailOn()) cards+='<div class="railcard"><div class="rt">Currency trends <span class="infodot" data-tip="Each account currency against your base ('+esc(base())+') over ~6 months — European Central Bank data via frankfurter.dev.&#10;Sent: currency codes only. Never sent: balances, amounts or account names.">&#9432;</span></div><div class="rsub">vs '+esc(base())+' · past 6 months</div><div id="rail-fx"></div></div>';
  if(debtClockOn()) cards+='<div class="railcard"><div class="rt">Debt clock <span class="infodot" data-tip="Not a fact to trust — a thought to sit with.&#10;Every number here is fiat: money backed by nothing but a promise. Public debt like this almost never shrinks — it is rolled forward, grown, and fresh money is printed to carry it.&#10;So the ruler you measure your wealth with is itself stretching. You are made to hold the currency — a lemon you cannot hand back — while its purchasing power leaks out as the headline climbs.&#10;Getting richer, or is the yardstick getting shorter?">&#9432;</span></div><div class="rsub">'+esc((RAIL.debt&&RAIL.debt.name)||countryName(debtCountry()))+'</div><div id="rail-debt"></div></div>';
  return cards;
}
// kick off (on input change) or repaint (on any other re-render) the rail; fetches fire only when
// the inputs — base currency, account currencies, toggles, country — actually change.
function ensureRail(){
  if(!railOn()){ stopDebtTick(); RAIL={sig:"",fx:null,fxErr:"",debt:null,debtErr:""}; return; }
  const sig=railSig();
  if(sig!==RAIL.sig){ RAIL.sig=sig; RAIL.fx=null; RAIL.fxErr=""; RAIL.debt=null; RAIL.debtErr=""; stopDebtTick();
    if(fxRailOn()) loadFx(); if(debtClockOn()) loadDebt(); }
  paintFx(); paintDebt();
}

/* ============ OpenRouter AI — draft the legs of an entry (frontend-only, PKCE) ============
   You bring your OWN key: a browser-only OAuth flow (no backend, no copy-paste) mints a
   per-user key that lives in this browser's localStorage and nowhere else.

   NOTHING DERIVED FROM YOUR LEDGER'S NUMBERS IS EVER SENT — no balance, amount, rate or id.
   Two hard gates guarantee it:
     (A) Whitelist — the account catalog is assembled field-by-field from NAMES/types only;
         amounts, balances and rates are never read into it. Accounts are referenced by
         letter tokens (A, B, C…), never their ids, so even the plumbing carries no digit.
     (B) Choke-point — orChat() stringifies the LEDGER-DERIVED content (the system message +
         the response schema) and REFUSES to send if a single 0-9 survived. Account NAMES are
         digit-scrubbed by scrubDigits() before they reach it.
   The one thing exempt from the gate is the USER's own message: numbers you type into the
   request box are yours to send (e.g. "$500 rent" for context) — they are never read from the
   ledger. (The `model` id is routing metadata, also outside the gate.) ======= */
const OR_KEY="ledgerbook.openrouter.key", OR_VERIFIER="ledgerbook.openrouter.verifier", OR_MODEL="ledgerbook.openrouter.model";
const OR_DEFAULT_MODEL="openai/gpt-4o-mini";
// A short curated list of OpenRouter model ids; "Other…" lets you type any id the list doesn't cover.
const OR_MODELS=[
  ["openai/gpt-4o-mini","GPT-4o mini — fast & cheap"],
  ["openai/gpt-4o","GPT-4o — stronger"],
  ["anthropic/claude-3.5-sonnet","Claude 3.5 Sonnet — strong"],
  ["google/gemini-2.0-flash-001","Gemini 2.0 Flash — fast"],
  ["deepseek/deepseek-chat","DeepSeek Chat — cheap, capable"]
];
const orGetKey=()=>{ try{ return localStorage.getItem(OR_KEY)||""; }catch(_){ return ""; } };
const orModel=()=>{ try{ return localStorage.getItem(OR_MODEL)||OR_DEFAULT_MODEL; }catch(_){ return OR_DEFAULT_MODEL; } };
const orConnected=()=>!!orGetKey();

// Gate A / redaction: replace any digit-bearing run (5, 5.00, 1,200.50, A7…) with a token that
// contains NO ascii digit. Whitespace/structure is preserved so account catalogs stay readable.
function scrubDigits(s){ return String(s==null?"":s).replace(/[\d.,]*\d[\d.,]*/g,"‹num›"); }
// letters-only reference so account ids (uuids, full of digits) never leave: 0->A … 25->Z,26->AA
function orLetters(n){ let s="",m=n+1; while(m>0){ m--; s=String.fromCharCode(65+(m%26))+s; m=Math.floor(m/26); } return s; }

function b64url(bytes){ let s=btoa(String.fromCharCode.apply(null,new Uint8Array(bytes))); return s.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function sha256b64url(str){ const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)); return b64url(h); }
function randVerifier(){ const a=new Uint8Array(48); crypto.getRandomValues(a); return b64url(a); }

async function orConnect(){
  const verifier=randVerifier();
  try{ localStorage.setItem(OR_VERIFIER,verifier); }catch(_){}
  const challenge=await sha256b64url(verifier);
  const cb=location.origin+location.pathname;   // OpenRouter returns to this exact page with ?code=…
  location.href="https://openrouter.ai/auth?callback_url="+encodeURIComponent(cb)+"&code_challenge="+encodeURIComponent(challenge)+"&code_challenge_method=S256";
}
// Runs at boot: if we came back from OpenRouter with ?code=…, exchange it (with the stored PKCE
// verifier) for a user key, store it, and scrub the code out of the address bar.
async function orHandleCallback(){
  const q=new URLSearchParams(location.search); const code=q.get("code");
  if(!code) return false;
  let verifier=""; try{ verifier=localStorage.getItem(OR_VERIFIER)||""; }catch(_){}
  try{
    const r=await fetch("https://openrouter.ai/api/v1/auth/keys",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({code, code_verifier:verifier, code_challenge_method:"S256"})});
    const j=await r.json();
    if(j&&j.key){ try{ localStorage.setItem(OR_KEY,j.key); localStorage.removeItem(OR_VERIFIER); }catch(_){}; toast("OpenRouter connected."); }
    else toast("OpenRouter sign-in didn't return a key.");
  }catch(e){ toast("OpenRouter sign-in failed."); }
  try{ history.replaceState(null,"",location.origin+location.pathname+location.hash); }catch(_){}
  return true;
}
function orDisconnect(){ try{ localStorage.removeItem(OR_KEY); }catch(_){}; toast("OpenRouter disconnected — reconnect any time."); render(); renderModal(); }

// Gate A: build the outbound account catalog from a strict whitelist — ref, name, group, kind,
// currency. No balance, amount or rate is ever read here. Returns the ref→realId map too.
function orBuildAccounts(){
  const list=[], map={}; let i=0;
  for(const t of S.types){ for(const a of accountsInType(t.id)){
    const ref=orLetters(i++); map[ref]=a.id;
    list.push({ref, name:scrubDigits(a.name), group:scrubDigits(t.name), kind:t.class, currency:scrubDigits(accCur(a))});
  }}
  return {list, map};
}

// Gate B: the single choke-point. Nothing reaches OpenRouter except through here.
// The digit gate applies to LEDGER-DERIVED content only — the system message (account catalog,
// instructions) and the response schema. That content is assembled from a name/type whitelist
// (Gate A) and must never carry a digit, which is what guarantees balances, account ids and rates
// can't leak. The USER's own message is exempt: numbers they type into the request are theirs to
// send (e.g. an amount for context) and are never derived from the ledger.
async function orChat(messages, schema){
  const key=orGetKey(); if(!key) throw new Error("Connect OpenRouter first.");
  const ledgerDerived=JSON.stringify({sys:messages.filter(m=>m.role!=="user").map(m=>m.content), schema});
  if(/[0-9]/.test(ledgerDerived)) throw new Error("Redaction gate: a digit reached ledger-derived content — request blocked, nothing was sent.");
  const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",
    headers:{"authorization":"Bearer "+key,"content-type":"application/json","HTTP-Referer":location.origin,"X-Title":"Ledgerbook"},
    body:JSON.stringify({model:orModel(), messages, response_format:schema, temperature:0})});
  if(r.status===401) throw new Error("OpenRouter rejected the key — reconnect.");
  if(!r.ok) throw new Error("OpenRouter error "+r.status+".");
  const j=await r.json();
  const txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(!txt) throw new Error("The model returned nothing.");
  return txt;
}

// Ask the model which account to debit and which to credit (legs), by letter ref — OR, when
// nothing existing fits a leg well, to propose a NEW account (name + group + class) for it.
async function orDraftTx(userText){
  const {list,map}=orBuildAccounts();
  // No minimum: with few or zero accounts the model simply proposes NEW ones for the legs it needs
  // (an empty book gets both legs proposed). refs may be empty, so both legs' enum is just ["NEW"].
  const refs=list.map(a=>a.ref);
  const clsEnum=CLASSES.map(c=>c[0]);   // asset / liability / equity (balance-sheet classes only)
  const newAcct={type:["object","null"],additionalProperties:false,
    properties:{name:{type:"string",description:"short account name — the item itself, words only"},group:{type:"string",description:"the Type/group to file it under"},class:{type:"string",enum:clsEnum}},
    required:["name","group","class"]};
  const leg={type:"object",additionalProperties:false,
    properties:{
      ref:{type:"string",enum:refs.concat(["NONE"]),description:"best existing account for this leg, or the closest fallback; NONE if nothing is relevant"},
      newAccount:newAcct   // null to just use ref; an object to CREATE a new account for this leg
    }, required:["ref","newAccount"]};
  const schema={type:"json_schema",json_schema:{name:"posting",strict:true,schema:{type:"object",additionalProperties:false,
    properties:{ debit:leg, credit:leg, description:{type:"string",description:"a short entry description, words only, no numbers"} },
    required:["debit","credit","description"]}}};
  const catalog=list.map(a=>a.ref+" — "+a.name+" ("+a.group+", "+a.kind+", "+a.currency+")").join("\n");
  const sys="You are a double-entry bookkeeping assistant. For EACH leg (debit and credit) return two things: ref = the single best-matching existing account, or the closest fallback, or NONE; and newAccount = a new account to CREATE for that leg, or null to just use ref.\n"+
    "Decide whether to create a new account. ACQUIRING A PHYSICAL ITEM is the key case: buying a car, house, device or furniture creates a new account for that one specific object — set newAccount. An existing account whose name is a specific item (a brand, model or proper name, e.g. «Car Subaru Outback ‹num›» or «MacBook Pro») is a DIFFERENT object — do NOT treat it as the same, though you may still put it in ref as the fallback. Use an existing account (newAccount = null) only when it clearly refers to the very same object, or is a general account (Cash, Bank, Owner's equity, a general payable).\n"+
    "newAccount.name is the ITEM ITSELF — a noun for the thing now owned, never the transaction (e.g. «House» or «Car», not «House Purchase»). group is the Type to file it under; class is asset, liability or equity.\n"+
    "For a purchase, the credit is the source of funds — the cash/bank account paid from, or the loan/payable used; a brand-new loan with no matching account is a newAccount of class liability.\n"+
    "This is a balance-sheet ledger — classes are asset, liability, equity only (income like salary increases equity; expenses decrease it). Never output any number or amount.\nAccounts (ref — name (group, class, currency)):\n"+catalog;
  const messages=[
    {role:"system",content:scrubDigits(sys)},   // ledger-derived: stays digit-free (Gate B enforces it)
    {role:"user",content:userText}               // the user's own words — numbers they typed are allowed through
  ];
  const raw=await orChat(messages, schema);
  let obj; try{ obj=JSON.parse(raw); }catch(_){ throw new Error("The model didn't return valid JSON."); }
  const clean=p=>(p&&p.name)?{name:String(p.name),group:String(p.group||"General"),class:clsEnum.includes(p.class)?p.class:"asset"}:null;
  const parseLeg=Lg=>{ const ref=(Lg&&Lg.ref)||"NONE"; return {fallbackId: ref!=="NONE"?(map[ref]||""):"", propose: clean(Lg&&Lg.newAccount)}; };
  return { debit:parseLeg(obj.debit), credit:parseLeg(obj.credit), description:obj.description||"", sent:messages };
}

async function aiDraft(){
  const input=document.getElementById("ai-desc"); const txt=input?input.value.trim():"";
  if(!txt){ toast("Describe the transaction first."); if(input) input.focus(); return; }
  const btn=document.getElementById("ai-draft"); const was=btn?btn.innerHTML:"";
  if(btn){ btn.disabled=true; btn.textContent="Thinking…"; }
  try{
    syncLines();                                    // keep any amounts the user already typed
    const res=await orDraftTx(txt);
    const d=UI.modal.draft;
    // Apply each leg: a proposal becomes an editable create-form (carrying the AI's best existing
    // fallback so Decline lands on it); otherwise wire the chosen existing account.
    const setLeg=(idx,leg)=>{
      if(!d.lines[idx]) d.lines[idx]={accountId:"",debit:0,credit:0};
      const l=d.lines[idx];
      if(leg.propose){ const pr={...leg.propose, fallbackId:leg.fallbackId||""};
        const t=S.types.find(x=>x.class===pr.class && (x.name||"").trim().toLowerCase()===(pr.group||"").trim().toLowerCase());
        if(t) pr.typeId=t.id;                       // reuse an existing Type of that name/class
        l._propose=pr; l.accountId="";
      } else { delete l._propose; l.accountId=leg.fallbackId||""; }
    };
    setLeg(0,res.debit); setLeg(1,res.credit);
    if(!(d.description||"").trim() && res.description) d.description=scrubDigits(res.description);
    UI.modal.aiText=txt;
    renderModal();
    toast((res.debit.propose||res.credit.propose)?"Drafted — review the suggested new account(s), or use an existing one." : "Legs drafted — enter the amount and review before saving.");
  }catch(e){ toast(String((e&&e.message)||e)); }
  finally{ if(btn){ btn.disabled=false; btn.innerHTML=was; } }
}

// Turn off spellcheck app-wide (stops Chrome's Enhanced spellcheck sending field text to Google)
// and mark the document non-translatable. Set on the roots so every input inherits it.
try{ document.documentElement.setAttribute("translate","no"); document.body.setAttribute("spellcheck","false"); }catch(_){}
(async function boot(){
  try{ await orHandleCallback(); }catch(_){}          // finish an OpenRouter sign-in redirect, if any
  STORE = await pickStore();                       // composition root: choose the adapter once
  let loaded=null; try{ loaded=await STORE.load(); }catch(e){}
  if(loaded && Number(loaded.schemaVersion)>SCHEMA){ renderSchemaBlock(Number(loaded.schemaVersion)); return; } // refuse: file newer than app
  S = loaded ? migrate(loaded) : seed();
  normalizeState();
  loadUIPrefs();
  applyTheme();
  applyFont();
  applyHeadFont();
  if(STORE===FILE_STORE){
    await loadLedgers();   // multi-book registry (null on an old server → single-ledger look, until they restart)
    try{ GITINFO=await (await fetch("/api/version",{cache:"no-store"})).json(); }catch(e){ GITINFO=null; }
    if(!GITINFO || GITINFO.appVersion!==VERSION){ UI.modal={kind:"restart", serverVer:(GITINFO&&GITINFO.appVersion)||null}; }  // frontend/backend mismatch → prompt restart
  }
  STORE.save(S,"silent");   // persist any migration, but never clobber a file that moved under us at boot
  applyHash();              // honor a shared/bookmarked URL (e.g. #/account/<id>) on first load
  render();
  renderModal();
})();
</script>
