<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22f%22%20cx%3D%2237%25%22%20cy%3D%2232%25%22%20r%3D%2282%25%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23fbfcfc%22%2F%3E%3Cstop%20offset%3D%22.52%22%20stop-color%3D%22%23d9dde1%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23a7adb4%22%2F%3E%3C%2FradialGradient%3E%3ClinearGradient%20id%3D%22r%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23c7ccd1%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237e848b%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%232f6f4f%22%2F%3E%3Cg%20transform%3D%22translate%284%204%29%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2210.4%22%20fill%3D%22url%28%23r%29%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%228.7%22%20fill%3D%22url%28%23f%29%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%226.7%22%20fill%3D%22none%22%20stroke%3D%22%23868c93%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%22.8%22%2F%3E%3Cg%20fill%3D%22%236b7178%22%3E%3Cellipse%20cx%3D%2211.1%22%20cy%3D%2214.2%22%20rx%3D%224%22%20ry%3D%222.6%22%2F%3E%3Ccircle%20cx%3D%2214.5%22%20cy%3D%2211.4%22%20r%3D%222.15%22%2F%3E%3Cpath%20d%3D%22M16.3%2010.8%20L18.5%2011.35%20L16.3%2012.5%20Z%22%2F%3E%3Cpath%20d%3D%22M7.4%2012.6%20L5.2%2011.7%20L7.7%2013.5%20Z%22%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2215.05%22%20cy%3D%2210.85%22%20r%3D%22.5%22%20fill%3D%22%23eceef0%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>Ledgerbook</title>
<meta name="description" content="A double-entry ledger with a chart of accounts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#f3f5f2; --surface:#ffffff; --surface-2:#f7f9f6;
  --ink:#182420; --muted:#5c6a63; --faint:#8b978f;
  --line:#e0e6df; --line-strong:#cdd6cc;
  --accent:#1f6a52; --accent-ink:#12523f; --accent-soft:#e5f0eb;
  --pos:#1f7a52; --neg:#b23a37;
  --shadow:0 1px 2px rgba(24,36,32,.06), 0 8px 24px -12px rgba(24,36,32,.18);
  --shadow-lift:0 12px 40px -12px rgba(24,36,32,.35);
  --r:10px; --r-sm:7px;
  --fs-display:"Fraunces",Georgia,serif;
  --fs-sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --fs-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --paper:#0f1513; --surface:#161e1b; --surface-2:#131a17;
  --ink:#e7efea; --muted:#94a49c; --faint:#6b7a72;
  --line:#26302c; --line-strong:#33403a;
  --accent:#4cc298; --accent-ink:#7ad4b3; --accent-soft:#17302690;
  --pos:#4cc298; --neg:#e08079;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 16px 48px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0f1513; --surface:#161e1b; --surface-2:#131a17;
  --ink:#e7efea; --muted:#94a49c; --faint:#6b7a72;
  --line:#26302c; --line-strong:#33403a;
  --accent:#4cc298; --accent-ink:#7ad4b3; --accent-soft:#17302690;
  --pos:#4cc298; --neg:#e08079;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 16px 48px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--fs-sans);line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--fs-display);font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;color:var(--ink)}
.num{font-family:var(--fs-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:224px 1fr;min-height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;padding:18px 12px;position:sticky;top:0;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--fs-display);font-weight:600;font-size:17px;flex:none}
.brand h1{font-size:20px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--muted);font-size:14px;font-weight:500;padding:9px 12px;border-radius:var(--r-sm)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 2px}
.curpick{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.curpick select{font-weight:400;color:var(--ink);width:100%}
.themeseg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.themeseg button{border:0;background:none;color:var(--muted);font-weight:500;font-size:12px;padding:6px 4px;border-radius:5px}
.themeseg button:hover{color:var(--ink)}
.themeseg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.main{min-width:0;display:flex;flex-direction:column}
.mainhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:clamp(16px,3vw,26px) clamp(16px,3vw,28px) 0}
.mainhead h2{font-size:19px}
.mainhead .grow{flex:1}
.ver{font-family:var(--fs-mono);font-size:11.5px;color:var(--faint);text-align:right;line-height:1.5}
.warn-badge{display:inline-block;font-family:var(--fs-sans);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:#f4d774;color:#5c4400;white-space:nowrap}
.warn-badge.crit{background:var(--neg);color:#fff}
.warnbanner{margin:14px clamp(16px,3vw,28px) 0;border:1px solid #e6c65a;border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow)}
.wbrow{background:#fbeec2;color:#5c4400;padding:9px 14px;font-size:12.5px;line-height:1.45}
.wbrow.crit{background:#f6dcda;color:#8a2b28;border-top:1px solid #e6b4b0}
:root[data-theme="dark"] .warnbanner{border-color:#6b5a1f}
:root[data-theme="dark"] .wbrow{background:#3a3113;color:#f4d774}
:root[data-theme="dark"] .wbrow.crit{background:#3a1f1e;color:#e08079;border-top-color:#5c2f2c}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .warnbanner{border-color:#6b5a1f}
  :root:not([data-theme="light"]) .wbrow{background:#3a3113;color:#f4d774}
  :root:not([data-theme="light"]) .wbrow.crit{background:#3a1f1e;color:#e08079;border-top-color:#5c2f2c}
}
.content{padding:clamp(16px,3vw,26px);max-width:860px;width:100%}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 13px;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.iconbtn{background:none;border:0;color:var(--faint);padding:6px;border-radius:6px;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
svg{stroke-width:1.7}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 10px;font-size:13.5px;width:100%}
/* required field that's empty/invalid on submit */
input.invalid,select.invalid,textarea.invalid{border-color:var(--neg)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 20%,transparent)}
textarea{font-family:inherit;resize:vertical;min-height:44px;line-height:1.4}
input[type=number]{text-align:right;font-family:var(--fs-mono);font-variant-numeric:tabular-nums}
label.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label.field input,label.field select{font-weight:400;color:var(--ink)}

.groupwrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.grouphead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.grouphead .ghright{display:flex;align-items:center;gap:8px}
.grouphead h3{font-size:15px}
.grouphead .total{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted)}
.arow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.typehead{display:flex;align-items:center;gap:8px;padding:8px 16px;background:color-mix(in srgb,var(--surface-2) 60%,transparent);border-bottom:1px solid var(--line)}
.typehead .tname{flex:1;font-weight:600;font-size:12.5px}
.typehead .ttotal{color:var(--muted);font-size:12.5px;margin-right:2px}
.typehead .chev{color:var(--faint);flex:none;transition:transform .15s}
.typehead.collapsed .chev{transform:rotate(-90deg)}
.typehead .tname{cursor:pointer}
.tcount{font-family:var(--fs-sans);font-size:10px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:0 6px;margin-left:6px;vertical-align:1px}
.cnote{display:block;color:var(--faint);font-size:11.5px;font-weight:400;font-style:italic;margin-top:3px;white-space:pre-wrap;line-height:1.35}
.arow.acct{padding-left:28px}
.arow .name{flex:1}
.arow .sub{color:var(--faint)}
.arow .bal .sub{margin-right:8px;font-size:12px}
.curtag{font-family:var(--fs-mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;margin-left:4px}
.muted{color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:22px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lift);z-index:200;max-width:90%;text-align:center}
.rates{display:flex;flex-direction:column;gap:8px}
.raterow{display:grid;grid-template-columns:70px 14px 1fr 44px;gap:8px;align-items:center}
.raterow .rc{font-family:var(--fs-mono);font-size:13px;color:var(--muted)}
.raterow .eq{color:var(--faint);text-align:center}
.arow .bal{font-family:var(--fs-mono);font-variant-numeric:tabular-nums}

.txcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.txhead{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line)}
.txhead .date{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.txhead .desc{flex:1;font-weight:600;font-size:13.5px}
.txhead .txsum{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.txhead .txsum .cur{color:var(--faint);font-size:10px;font-weight:400;margin-left:3px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 16px;border-bottom:1px solid var(--line)}
thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;text-align:right}
tfoot td{font-weight:600;border-top:1px solid var(--line-strong)}
/* compact ledger postings: no per-card header/footer rows, single Dr/Cr amount column */
.txcard table.txlines td{padding:4px 14px;font-size:13px;border-bottom:0}
.txcard table.txlines .acct{width:100%}
.txcard table.txlines .drcr{font-family:var(--fs-mono);font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--faint);text-align:right;padding-right:8px;white-space:nowrap}
.txcard table.txlines .num{white-space:nowrap;min-width:88px}
.txcard table.txlines tr:first-child td{padding-top:7px}
.txcard table.txlines tr:last-child td{padding-bottom:8px}
.txnote{padding:7px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:pre-wrap}

.empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r)}
.ledgertools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;font-weight:600;color:var(--muted)}
.ledgertools .lfilters,.ledgertools .lsort{display:flex;align-items:center;gap:8px}
.ledgertools select{width:auto;font-weight:400;color:var(--ink)}
.ledgertools .lsearch{width:200px;max-width:46vw;font-weight:400;color:var(--ink);padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font-size:13px}
.ledgertools .lcount{font-weight:400;color:var(--faint);font-variant-numeric:tabular-nums}
/* account register (running-balance statement) */
.infodot{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;font-size:11px;color:var(--faint);border:1px solid var(--line-strong);border-radius:50%;cursor:help;vertical-align:middle;font-style:normal;line-height:1}
.infodot:hover{color:var(--ink);border-color:var(--muted)}
.acctlink{cursor:pointer;border-bottom:1px dashed transparent}
.acctlink:hover{border-bottom-color:var(--line-strong);color:var(--accent,inherit)}
.reghead{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.reghead-main{flex:1;min-width:150px}
.reghead-main .regtitle{font-size:17px;font-weight:700}
.regmeta{color:var(--muted);font-size:12.5px}
.regbal{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.regbal-l{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.regbal b{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;font-size:18px}
.regbal-sub{color:var(--muted);font-size:12px;font-family:var(--fs-mono)}
table.register{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
table.register thead th{background:var(--surface-2)}
.register .rdate{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.register .rbal{font-weight:600}
.register .regrow{cursor:pointer}
.register .regrow:hover td{background:var(--surface-2)}
.txtime{font-family:var(--fs-mono);font-size:11px;color:var(--faint);margin-left:6px}
.register .rchev{display:inline-block;width:14px;color:var(--faint);font-size:9px}
.register .redit{width:36px;text-align:right}
.register .rowedit{opacity:0;transition:opacity .12s}
.register .regrow:hover .rowedit,.register .regrow.open .rowedit{opacity:1}
.register .regrow.open>td{background:var(--surface-2)}
.regdetail>td{padding:0;border-bottom:1px solid var(--line)}
.rdetail{padding:10px 16px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.rdetail-legs{display:flex;flex-direction:column;gap:4px}
.dleg{display:flex;align-items:center;gap:10px;font-size:13px}
.dleg-acct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dleg.self .dleg-acct{font-weight:600}
.dleg-drcr{font-family:var(--fs-mono);font-size:10px;color:var(--faint);width:20px;text-align:right}
.dleg-amt{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rdetail-meta{font-size:12px;color:var(--muted)}
.chkrow{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chkrow input{width:auto;margin:0}

.overlay{position:fixed;inset:0;background:rgba(16,22,20,.5);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow-lift);width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px}
.modal-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lines{display:flex;flex-direction:column;gap:8px}
.linehead,.line{display:grid;grid-template-columns:1fr 96px 96px 28px;gap:8px;align-items:center}
.linehead{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.linehead .r{text-align:right}
.aibar{display:flex;gap:8px;align-items:center}
.aibar input{flex:1;min-width:0}
.airow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.okdot{color:var(--pos)}
.aihint{margin-top:-4px}
.aihint details{font-size:12px;color:var(--muted)}
.aihint summary{cursor:pointer;color:var(--accent-ink);user-select:none}
.aihint pre{margin:6px 0 0;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);white-space:pre-wrap;word-break:break-word;font-family:var(--fs-mono);font-size:11px;color:var(--muted);max-height:220px;overflow:auto}
.balrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:var(--r-sm);font-size:13px;background:var(--surface-2)}
.balrow.ok{background:var(--accent-soft);color:var(--accent-ink)}
.balrow.bad{background:#f7e7e6;color:var(--neg)}
:root[data-theme="dark"] .balrow.bad{background:#33201f}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .balrow.bad{background:#33201f} }

@media (max-width:640px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
}
@media (max-width:560px){
  .linehead,.line{grid-template-columns:1fr 80px 80px 26px}
  .grid2{grid-template-columns:1fr}
}
/* ---- motion pass ---- */

<script>
"use strict";
const CLASSES=[["asset","Assets"],["liability","Liabilities"],["equity","Equity"]];  // fixed statement classes
const DEBIT_NORMAL=new Set(["asset","expense"]);
const uid=()=>Math.random().toString(36).slice(2,10);
const round2=n=>Math.round((n+Number.EPSILON)*100)/100;
const round4=n=>Math.round(n*1e4)/1e4;
const KEY="ledgerbook.min.v1";
const VERSION="v43", UPDATED="2026-09-18";
// Stamped at each publish to track drift between this artifact and the git repo:
const COMMIT="local", COMMITTED=true, MIGRATION_UNCOMMITTED=false;
const SCHEMA=2;   // data-shape version. A file with a higher number was written by a newer app → refuse to load.
                  // v2: each transaction carries an immutable createdAt (booking timestamp), distinct from its (editable) date.
const PROJECT="personal-wealth-tracker";
function backupName(ext){ const d=new Date(),p=n=>String(n).padStart(2,"0");
  const ts=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  return `${PROJECT}_${ts}_${COMMIT}.${ext}`; }   // sortable: project _ YYYYMMDD-HHMMSS _ commit
const CURRENCIES=["USD","EUR","GBP","JPY","CAD","AUD","CHF","CNY","INR","BRL","MXN","SGD","HKD","NZD","SEK","NOK","PLN","ZAR","AED","TRY"];
// IANA time-zone list for the organization-timezone picker (falls back to a short list on old engines)
const TZLIST=(()=>{ try{ return Intl.supportedValuesOf("timeZone"); }catch(_){ return ["UTC","America/Vancouver","America/Toronto","America/New_York","America/Chicago","America/Los_Angeles","Europe/London","Europe/Berlin","Europe/Moscow","Asia/Almaty","Asia/Dubai","Asia/Tokyo","Australia/Sydney"]; } })();
const deviceTz=()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"; }catch(_){ return "UTC"; } };

// Local calendar date/time (NOT UTC): a transaction posted Friday evening must be dated Friday,
// even after UTC has rolled over to Saturday. toISOString() is UTC and caused future-dated entries.
const todayLocal=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
const nowLocal=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;};
// render a stored createdAt (ISO instant) in the viewer's local time
const fmtCreated=iso=>{ try{ return new Date(iso).toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(_){ return String(iso||""); } };
// just the time-of-day of a recorded instant, shown in the org's zone (for the "show transaction time" option)
const fmtTxTime=iso=>{ try{ return new Intl.DateTimeFormat(undefined,{timeZone:orgTz(),hour:"2-digit",minute:"2-digit"}).format(new Date(iso)); }catch(_){ return ""; } };
// the organization's time zone drives the DEFAULT accounting date — a calendar date in the org's
// zone, so posting from another zone still lands on the right business day.
const orgTz=()=>(S&&S.settings&&S.settings.orgTimezone)||deviceTz();
const todayAccounting=()=>{ try{ return new Intl.DateTimeFormat("en-CA",{timeZone:orgTz()}).format(new Date()); }catch(_){ return todayLocal(); } };
function seed(){
  // Start empty — no sample accounts, types, or transactions. A fresh book.
  return {types:[],accounts:[],transactions:[],settings:{currency:"USD",rates:{USD:1},ratesUpdated:""}};
}
/* ---- persistence: PORTS & ADAPTERS — one interface { load, save },
   two backends, chosen ONCE at startup (not a flag inside every call):
     • browser storage  — in the Claude artifact
     • local JSON file  — when served by the offline desktop program
   The rest of the app only ever calls save(); it never knows which store. ---- */
const LS_STORE={ name:"browser",
  async load(){ try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;} },
  async save(d){ try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){} } };
// REV = the server revision (ETag) of the file this tab last read. We send it back on every
// write (If-Match) so a stale copy can't clobber a fresher file — optimistic concurrency.
let REV=null;
const FILE_STORE={ name:"file",
  async load(){ const r=await fetch("/api/book",{cache:"no-store"}); if(!r.ok) return null; REV=r.headers.get("ETag"); const j=await r.json(); return (j&&Array.isArray(j.accounts))?j:null; },
  // mode: "silent" — background flush (tab close/boot); drop quietly on a conflict.
  //       "force"  — user chose to overwrite; skip the check.
  //       else     — interactive save; surface the conflict modal so a live edit isn't lost silently.
  async save(d,mode){ try{
      const h={"content-type":"application/json"};
      if(REV && mode!=="force") h["If-Match"]=REV;
      const r=await fetch("/api/book",{method:"PUT",headers:h,body:JSON.stringify(d),keepalive:mode==="silent"});
      if(r.status===409){ if(mode!=="silent") onSaveConflict(); return; }
      if(r.ok){ const t=r.headers.get("ETag"); if(t) REV=t; }
    }catch(e){} } };
let STORE=LS_STORE, saveT=null;
// The file on disk changed under us (another tab, machine, or the API). Don't silently lose the
// live edit — ask the user (mirrors the version-mismatch modal).
function onSaveConflict(){ if(UI.modal && UI.modal.kind==="conflict") return; UI.modal={kind:"conflict"}; renderModal(); }
async function pickStore(){ try{ const r=await fetch("/api/ping",{cache:"no-store"}); if(r.ok) return FILE_STORE; }catch(e){} return LS_STORE; }
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ if(STORE&&S) STORE.save(S); },250); }

function migrate(st){
  if(st && Array.isArray(st.types)) return st; // already Class/Type/Account shape
  // convert old { accounts:{id,name,type,currency,parentId} } -> classes/types/accounts
  const old=(st&&st.accounts)||[];
  const hasKids=id=>old.some(a=>a.parentId===id);
  const types=[]; const generalOf={};
  const ensureGeneral=cls=>{ if(!generalOf[cls]){ const t={id:uid(),name:"General",class:cls}; types.push(t); generalOf[cls]=t.id; } return generalOf[cls]; };
  old.forEach(a=>{ if(hasKids(a.id)) types.push({id:a.id,name:a.name,class:a.type}); }); // a parent account becomes a Type (reuse id)
  const typeIds=new Set(types.map(t=>t.id));
  const accounts=[];
  old.forEach(a=>{
    if(hasKids(a.id)) return; // became a Type
    const typeId=(a.parentId&&typeIds.has(a.parentId))?a.parentId:ensureGeneral(a.type);
    accounts.push({id:a.id,name:a.name,typeId,currency:a.currency||(st.settings&&st.settings.currency)||"USD"});
  });
  const accIds=new Set(accounts.map(a=>a.id));
  const transactions=((st&&st.transactions)||[]).filter(t=>Array.isArray(t.lines)&&t.lines.length&&t.lines.every(l=>accIds.has(l.accountId)));
  return {types,accounts,transactions,settings:(st&&st.settings)||{currency:"USD"}};
}
let S=null;
let GITINFO=null;   // filled from the local server's /api/version when present; null in the artifact
/* Version line + commit state — dynamic from git when a local server is present,
   otherwise the value stamped into this file at publish (the artifact case). */
function verInfo(){
  if(GITINFO && GITINFO.isRepo){
    return { label: GITINFO.tag ? esc(GITINFO.tag) : ("git "+esc(GITINFO.commit||"?")), committed: !GITINFO.dirty, migration:false };
  }
  const label = (COMMIT && COMMIT!=="local") ? ("git "+esc(COMMIT)) : "local build";
  return { label, committed: COMMITTED, migration: MIGRATION_UNCOMMITTED };
}
const UI={view:"accounts",modal:null,ledgerSort:"date-desc",ledgerQuery:"",ledgerAccount:"",collapsed:{}};
const UIKEY="ledgerbook.ui";   // view prefs kept OUT of the ledger (so they don't trigger snapshots)
function loadUIPrefs(){ try{ const r=localStorage.getItem(UIKEY); if(r){ const p=JSON.parse(r); if(p&&p.collapsed&&typeof p.collapsed==="object") UI.collapsed=p.collapsed; } }catch(e){} }
function saveUIPrefs(){ try{ localStorage.setItem(UIKEY, JSON.stringify({collapsed:UI.collapsed})); }catch(e){} }
const LEDGER_SORTS=[["date-desc","Date (newest first)"],["date-asc","Date (oldest first)"],["added-desc","Recently added"],["amount-desc","Amount (high → low)"],["amount-asc","Amount (low → high)"],["alpha","Description (A → Z)"]];
function normalizeState(){
  if(!Array.isArray(S.types)) S.types=[];
  if(!S.settings) S.settings={currency:"USD"};
  if(!S.settings.rates) S.settings.rates={USD:1};
  S.accounts.forEach(a=>{ if(!a.currency) a.currency=S.settings.currency; });                 // pin a fixed currency per account
  S.accounts.forEach(a=>{ if(a.currency&&S.settings.rates[a.currency]==null) S.settings.rates[a.currency]=1; });
  if(S.settings.rates[S.settings.currency]==null) S.settings.rates[S.settings.currency]=1;
  if(!["auto","light","dark"].includes(S.settings.theme)) S.settings.theme="auto";
  if(!S.settings.orgTimezone) S.settings.orgTimezone=deviceTz();   // organization time zone (drives the accounting-date default)
  // v2 backfill: give any pre-existing transaction a createdAt. We don't know the real booking
  // instant, so proxy it from the transaction date (noon local, to stay on the same calendar day).
  S.transactions.forEach(t=>{ if(!t.createdAt) t.createdAt=new Date((t.date||"1970-01-01")+"T12:00:00").toISOString(); });
  S.schemaVersion=SCHEMA;   // stamp the data-shape version this app writes
}
const THEMES=[["auto","Auto"],["light","Light"],["dark","Dark"]];
function applyTheme(){
  const t=(S&&S.settings&&S.settings.theme)||"auto", r=document.documentElement;
  if(t==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",t);
}

const acctById=id=>S.accounts.find(a=>a.id===id);
const typeById=id=>S.types.find(t=>t.id===id);
const classOf=acc=>{ const t=acc&&typeById(acc.typeId); return t?t.class:undefined; };
const typesInClass=cls=>S.types.filter(t=>t.class===cls);
const accountsInType=tid=>S.accounts.filter(a=>a.typeId===tid);
function balance(accId){
  const acc=acctById(accId);if(!acc)return 0;
  let net=0;
  for(const t of S.transactions) for(const l of t.lines) if(l.accountId===accId) net+=(l.debit||0)-(l.credit||0);
  net=round2(net);
  return DEBIT_NORMAL.has(classOf(acc))?net:-net;
}
function typeBalanceBase(tid){ return round2(accountsInType(tid).reduce((s,a)=>s+toBase(balance(a.id),accCur(a)),0)); }
function classTotalBase(cls){ return round2(typesInClass(cls).reduce((s,t)=>s+typeBalanceBase(t.id),0)); }
/* ---- currency + conversion ---- */
const base=()=>S.settings.currency;
const accCur=a=>(a&&a.currency)?a.currency:base();
function rateUSD(cur){ const r=S.settings&&S.settings.rates; return r&&r[cur]!=null?r[cur]:1; } // USD value of 1 unit of cur
function convert(amount,from,to){ if(from===to) return amount; return amount*rateUSD(from)/rateUSD(to); }
function toBase(amount,cur){ return convert(amount,cur,base()); }
function money(n,cur){
  cur=cur||base();
  try{return new Intl.NumberFormat(undefined,{style:"currency",currency:cur}).format(n);}
  catch(e){return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+" "+cur;}
}
function fmt(n,cur){ return n?money(n,cur):""; }
function fmtBal(n,cur){ return money(n,cur); }
/* animated numbers: wrap a figure so its value tweens when it changes between renders */
function cnt(value,cur,key){ const c=cur||base(); return `<span class="cnt" data-count="${key}" data-value="${value}" data-cur="${c}">${money(value,c)}</span>`; }
const prevNums={};
function animateCounts(){
  const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  document.querySelectorAll(".cnt[data-count]").forEach(el=>{
    const key=el.dataset.count, target=parseFloat(el.dataset.value)||0, cur=el.dataset.cur||base();
    const had=(key in prevNums), prev=had?prevNums[key]:target;
    prevNums[key]=target;
    if(reduce || !had || prev===target){ el.textContent=money(target,cur); return; }
    el.classList.add("changed");
    const t0=performance.now(), dur=520, from=prev, delta=target-from;
    (function frame(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=money(from+delta*e,cur);
      if(p<1) requestAnimationFrame(frame); else el.textContent=money(target,cur);
    })(t0);
  });
}
const I={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M13 5l4 4"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9l6 6 6-6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  coin:'<svg viewBox="0 0 24 24" style="width:23px;height:23px"><defs><radialGradient id="coinF" cx="37%" cy="32%" r="82%"><stop offset="0%" stop-color="#fbfcfc"/><stop offset="52%" stop-color="#d9dde1"/><stop offset="100%" stop-color="#a7adb4"/></radialGradient><linearGradient id="coinR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c7ccd1"/><stop offset="100%" stop-color="#7e848b"/></linearGradient></defs><circle cx="12" cy="12" r="10.4" fill="url(#coinR)"/><circle cx="12" cy="12" r="8.7" fill="url(#coinF)"/><circle cx="12" cy="12" r="8.7" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".7"/><circle cx="12" cy="12" r="6.7" fill="none" stroke="#868c93" stroke-opacity=".5" stroke-width=".8"/><ellipse cx="9" cy="8.4" rx="3.4" ry="2.2" fill="#fff" opacity=".33" transform="rotate(-25 9 8.4)"/><g fill="#6b7178"><ellipse cx="11.1" cy="14.2" rx="4" ry="2.6"/><circle cx="14.5" cy="11.4" r="2.15"/><path d="M16.3 10.8 L18.5 11.35 L16.3 12.5 Z"/><path d="M7.4 12.6 L5.2 11.7 L7.7 13.5 Z"/></g><circle cx="15.05" cy="10.85" r=".5" fill="#eceef0"/></svg>',
};

function render(){
  document.getElementById("app").innerHTML=`
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="mark">${I.coin}</div><h1>Ledgerbook</h1></div>
      <nav class="nav">
        <button data-action="tab" data-view="accounts" class="${UI.view==="accounts"?"on":""}">Accounts</button>
        <button data-action="tab" data-view="ledger" class="${UI.view==="ledger"?"on":""}">Ledger</button>
      </nav>
      <div class="side-foot">
        <label class="curpick"><span>Currency</span>
          <select id="cur-pick">${CURRENCIES.map(c=>`<option value="${c}" ${S.settings.currency===c?"selected":""}>${c}</option>`).join("")}</select>
        </label>
        <label class="curpick" style="margin-top:10px"><span>Organization time zone <span class="infodot" title="Your organization's home time zone. Accounting standards date each transaction to the calendar day in THIS zone (its «accounting date»), so an entry made late at night — or posted from a device in another time zone — still lands on the right business day. The org's location isn't recorded anywhere else, so this is where the books are based.&#10;&#10;Every transaction keeps two times: when it was RECORDED (a booking instant, stored in UTC) and when it HAPPENED (its accounting date, a calendar day in this zone).">&#9432;</span></span>
          <select id="tz-pick">${TZLIST.map(z=>`<option value="${escAttr(z)}" ${orgTz()===z?"selected":""}>${esc(z)}</option>`).join("")}</select>
        </label>
        <div class="curpick" style="margin-top:10px"><span>Theme</span>
          <div class="themeseg" role="group" aria-label="Theme">${THEMES.map(([k,l])=>`<button class="${(S.settings.theme||"auto")===k?"on":""}" data-action="set-theme" data-theme="${k}">${l}</button>`).join("")}</div>
        </div>
        <div class="curpick" style="margin-top:10px"><span>AI drafting (OpenRouter)</span>
          ${orConnected()
            ? `<div class="airow"><span class="okdot">●</span> Connected<div style="flex:1"></div><button class="btn sm" data-action="or-disconnect">Disconnect</button></div>`
            : `<button class="btn sm" data-action="or-connect" style="width:100%">Connect OpenRouter</button>`}
        </div>
        <button class="btn sm" data-action="open-rates" style="width:100%;margin-top:10px">Exchange rates</button>
        <button class="btn sm" data-action="open-data" style="width:100%;margin-top:8px">Settings</button>
        ${STORE!==FILE_STORE?`<button class="btn sm" data-action="download-build" style="width:100%;margin-top:8px">⤓ Desktop app (.zip)</button>`:``}
      </div>
    </aside>
    <div class="main">
      <div class="mainhead">
        <h2>${UI.view==="account"?esc((acctById(UI.accountId)||{}).name||"Account"):UI.view==="accounts"?"Accounts":"Ledger"}</h2>
        <div class="grow"></div>
        <span class="ver">${VERSION} · ${verInfo().label} · ${UPDATED}${verInfo().committed?"":` <span class="warn-badge">⚠ uncommitted changes</span>`}${verInfo().migration?` <span class="warn-badge crit">⛔ uncommitted migration</span>`:""}</span>
        ${UI.view==="accounts"
          ? `<button class="btn" data-action="new-acct">${I.plus}Add account</button>`
          : `<button class="btn primary" data-action="new-tx">${I.plus}New transaction</button>`}
      </div>
      ${warnBanner()}
      <div class="content">${UI.view==="account"?viewAccount(UI.accountId):UI.view==="accounts"?viewAccounts():viewLedger()}</div>
    </div>
  </div>`;
  animateCounts();
}

/* ---- explicit commit/migration warning banner (top of the main pane) ----
   COMMITTED / MIGRATION_UNCOMMITTED are stamped by hand at each publish.
   If the code is ahead of git, show a DOUBLE warning: (1) uncommitted code,
   and (2) that any data-shape change made since the last commit is an
   unversioned "dead" migration that can rewrite the ledger. ---- */
function warnBanner(){
  const vi=verInfo();
  if(vi.committed && !vi.migration) return "";
  let rows="";
  if(!vi.committed){
    rows+=`<div class="wbrow"><b>⚠ Uncommitted changes.</b> The code running here is ahead of the last commit (${vi.label}). Treat this as a draft, not prod.</div>`;
    rows+=`<div class="wbrow crit"><b>⛔ Possible dead migration.</b> Any change to the data shape made after ${vi.label} is unversioned — it can rewrite <b>ledger.json</b> with no matching commit. Export a JSON backup before you keep editing.</div>`;
  }
  if(vi.migration){
    rows+=`<div class="wbrow crit"><b>⛔ Uncommitted data migration.</b> A migration ran after the last commit. Back up and commit before continuing.</div>`;
  }
  return `<div class="warnbanner" role="alert">${rows}</div>`;
}
function viewAccounts(){
  let out="";
  for(const [ck,cl] of CLASSES){
    // types ordered by amount, high → low (by balance magnitude in the base currency; name breaks ties)
    const types=typesInClass(ck).slice().sort((a,b)=>(Math.abs(typeBalanceBase(b.id))-Math.abs(typeBalanceBase(a.id)))||a.name.localeCompare(b.name));
    out+=`<div class="groupwrap"><div class="grouphead"><h3>${cl}</h3><span class="ghright"><span class="total">${cnt(classTotalBase(ck),base(),'class:'+ck)}</span><button class="iconbtn" data-action="new-type" data-class="${ck}" title="Add ${esc(cl)} type">${I.plus}</button></span></div>`;
    if(!types.length) out+=`<div class="arow acct"><span class="name muted" style="font-size:12.5px">No types yet — use + to add one</span><span></span></div>`;
    types.forEach(t=>{
      const accts=accountsInType(t.id).slice().sort((a,b)=>a.name.localeCompare(b.name));
      const collapsed=!!UI.collapsed[t.id];
      out+=`<div class="typehead${collapsed?' collapsed':''}">
        <button class="iconbtn chev" data-action="toggle-type" data-id="${t.id}" title="${collapsed?'Expand':'Collapse'}" aria-expanded="${!collapsed}">${I.chev}</button>
        <span class="tname" data-action="toggle-type" data-id="${t.id}">${esc(t.name)}${t.comment?`<span class="cnote">${esc(t.comment)}</span>`:''}</span>
        <span class="ttotal num">${cnt(typeBalanceBase(t.id),base(),'type:'+t.id)}${accts.length?` <span class="tcount">${accts.length}</span>`:''}</span>
        <button class="iconbtn" data-action="add-acct-in" data-id="${t.id}" title="Add account">${I.plus}</button>
        <button class="iconbtn" data-action="edit-type" data-id="${t.id}" title="Rename type">${I.edit}</button>
        <button class="iconbtn" data-action="del-type" data-id="${t.id}" title="Delete type">${I.trash}</button>
      </div>`;
      const rows=accts.map(a=>{
        const cur=accCur(a), baseBal=toBase(balance(a.id),cur);
        const native=(cur!==base())?`<span class="sub">${money(balance(a.id),cur)}</span> `:"";
        return `<div class="arow acct">
          <span class="name"><span class="acctlink" data-action="open-account" data-id="${a.id}" title="View this account's postings">${esc(a.name)}</span>${cur!==base()?` <span class="curtag">${cur}</span>`:''}${a.comment?`<span class="cnote">${esc(a.comment)}</span>`:''}</span>
          <span class="bal">${native}${cnt(baseBal,base(),'acct:'+a.id)}</span>
          <button class="iconbtn" data-action="edit-acct" data-id="${a.id}" title="Edit">${I.edit}</button>
          <button class="iconbtn" data-action="del-acct" data-id="${a.id}" title="Delete">${I.trash}</button>
        </div>`;
      }).join("")||`<div class="arow acct"><span class="name muted" style="font-size:12.5px">No accounts</span><span></span></div>`;
      out+=`<div class="acctwrap"><div class="acctwrap-in">${rows}</div></div>`;
    });
    out+=`</div>`;
  }
  return out;
}

function txAmount(t){ return round2(t.lines.reduce((s,l)=>s+toBase(l.debit||0,accCur(acctById(l.accountId))),0)); }
function sortTxs(arr){
  const s=UI.ledgerSort||"date-desc";
  const ord=new Map(S.transactions.map((t,i)=>[t.id,i])); // insertion order: later index = more recently added
  const byDate=(a,b)=>a.date<b.date?-1:(a.date>b.date?1:0);
  const byAddDesc=(a,b)=>(ord.get(b.id)??0)-(ord.get(a.id)??0); // most-recently-added first
  const byAddAsc =(a,b)=>(ord.get(a.id)??0)-(ord.get(b.id)??0);
  const cAt=t=>t.createdAt||""; const byCreatedDesc=(a,b)=>(cAt(a)<cAt(b)?1:cAt(a)>cAt(b)?-1:0); // newest booking instant first
  arr.sort((a,b)=>{
    switch(s){
      case "date-asc":    return byDate(a,b) || byAddAsc(a,b);
      case "added-desc":  return byCreatedDesc(a,b) || byAddDesc(a,b); // by createdAt (booking instant), then insertion order
      case "amount-desc": return (txAmount(b)-txAmount(a)) || byDate(b,a) || byAddDesc(a,b);
      case "amount-asc":  return (txAmount(a)-txAmount(b)) || byDate(a,b) || byAddDesc(a,b);
      case "alpha":       return (a.description||"").localeCompare(b.description||"") || byDate(b,a) || byAddDesc(a,b);
      default:            return byDate(b,a) || byAddDesc(a,b); // date-desc: newest date, then most-recently-added
    }
  });
  return arr;
}
function viewLedger(){
  const all=S.transactions;
  if(!all.length) return `<div class="empty">No transactions yet. Record your first entry.</div>`;
  // ---- filtering: free-text (description/comment) + a single account ----
  const q=(UI.ledgerQuery||"").trim().toLowerCase();
  const af=UI.ledgerAccount||"";
  let txs=sortTxs([...all]);
  if(q)  txs=txs.filter(t=>(t.description||"").toLowerCase().includes(q) || (t.comment||"").toLowerCase().includes(q));
  if(af) txs=txs.filter(t=>t.lines.some(l=>l.accountId===af));
  const acctOpts=`<option value="">All accounts</option>`+
    S.accounts.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`<option value="${a.id}" ${af===a.id?"selected":""}>${esc(a.name)}</option>`).join("");
  const active=!!(q||af);
  const toolbar=`<div class="ledgertools">
    <div class="lfilters">
      <input id="ledger-q" class="lsearch" type="search" placeholder="Search description…" value="${escAttr(UI.ledgerQuery||"")}" autocomplete="off">
      <select id="ledger-acct" title="Filter by account">${acctOpts}</select>
      ${active?`<button class="btn sm" data-action="ledger-clear">Clear</button><span class="lcount">${txs.length} of ${all.length}</span>`:""}
    </div>
    <div class="lsort"><span>Sort</span><select id="ledger-sort">${LEDGER_SORTS.map(([k,l])=>`<option value="${k}" ${(UI.ledgerSort||"date-desc")===k?"selected":""}>${l}</option>`).join("")}</select></div>
  </div>`;
  if(!txs.length) return toolbar+`<div class="empty">No transactions match this filter.</div>`;
  return toolbar + txs.map(t=>{
    const drBase=round2(t.lines.reduce((s,l)=>s+toBase(l.debit||0,accCur(acctById(l.accountId))),0));
    return `<div class="txcard">
      <div class="txhead">
        <span class="date">${t.date}${S.settings.showTxTime&&t.createdAt?` <span class="txtime">${esc(fmtTxTime(t.createdAt))}</span>`:""}</span>
        <span class="desc">${esc(t.description)}</span>
        <span class="txsum">${fmtBal(drBase)}<span class="cur">${base()}</span></span>
        <button class="iconbtn" data-action="edit-tx" data-id="${t.id}" title="Edit">${I.edit}</button>
        <button class="iconbtn" data-action="del-tx" data-id="${t.id}" title="Delete">${I.trash}</button>
      </div>
      <table class="txlines">
        <tbody>${t.lines.map(l=>{const a=acctById(l.accountId);const c=accCur(a);const isDr=(l.debit||0)>0;const amt=isDr?(l.debit||0):(l.credit||0);
          return `<tr><td class="acct">${a?esc(a.name):"—"}${c!==base()?` <span class="curtag">${c}</span>`:''}</td><td class="drcr">${isDr?"Dr":"Cr"}</td><td class="num">${fmt(amt,c)}</td></tr>`;}).join("")}</tbody>
      </table>
      ${t.comment?`<div class="txnote">${esc(t.comment)}</div>`:""}
    </div>`;
  }).join("");
}

// Account register: one account's postings with a running balance (a bank-statement view).
function viewAccount(id){
  const acc=acctById(id);
  if(!acc){ return `<div class="empty">Account not found. <a href="#" data-action="tab" data-view="accounts">Back to Accounts</a></div>`; }
  const cur=accCur(acc), t=typeById(acc.typeId), cls=classOf(acc);
  const normal=DEBIT_NORMAL.has(cls);
  const clsLabel=(CLASSES.find(([k])=>k===cls)||[,cls])[1];
  const ord=new Map(S.transactions.map((tx,i)=>[tx.id,i]));
  const posts=[];
  for(const tx of S.transactions) for(const l of tx.lines) if(l.accountId===id) posts.push({tx,debit:l.debit||0,credit:l.credit||0});
  // oldest → newest so the running balance accumulates in chronological order
  posts.sort((a,b)=>(a.tx.date<b.tx.date?-1:a.tx.date>b.tx.date?1:0)||((ord.get(a.tx.id)??0)-(ord.get(b.tx.id)??0)));
  let run=0;
  posts.forEach(p=>{ p.run=round2(run+(normal?(p.debit-p.credit):(p.credit-p.debit))); run=p.run; });
  const curBal=run;
  const head=`<div class="reghead">
    <button class="btn sm" data-action="tab" data-view="accounts">← Accounts</button>
    <div class="reghead-main">
      <div class="regtitle">${esc(acc.name)}${cur!==base()?` <span class="curtag">${cur}</span>`:""}</div>
      <span class="regmeta">${esc(clsLabel)} · ${esc(t?t.name:"—")} · ${posts.length} posting${posts.length===1?"":"s"}</span>
    </div>
    <div class="regbal"><span class="regbal-l">Current balance</span><b>${money(curBal,cur)}</b>${cur!==base()?`<span class="regbal-sub">${money(toBase(curBal,cur),base())} ${base()}</span>`:""}</div>
  </div>`;
  if(!posts.length) return head+`<div class="empty">No postings in this account yet.</div>`;
  // display newest first; each row's Balance is the account balance right after that entry.
  // Row click expands an inline detail (both legs, recorded time, comment); the hover pencil edits.
  const expanded=UI.regExpanded||(UI.regExpanded=new Set());
  const body=posts.slice().reverse().map(p=>{
    const tx=p.tx, open=expanded.has(tx.id);
    const time=S.settings.showTxTime&&tx.createdAt?` <span class="txtime">${esc(fmtTxTime(tx.createdAt))}</span>`:"";
    const main=`<tr class="regrow${open?" open":""}" data-action="reg-expand" data-id="${tx.id}" title="Click for details">
      <td class="rdate">${tx.date}${time}</td>
      <td class="rdesc"><span class="rchev">${open?"▾":"▸"}</span>${esc(tx.description)}</td>
      <td class="num">${p.debit?money(p.debit,cur):""}</td>
      <td class="num">${p.credit?money(p.credit,cur):""}</td>
      <td class="num rbal">${money(p.run,cur)}</td>
      <td class="redit"><button class="iconbtn rowedit" data-action="edit-tx" data-id="${tx.id}" title="Edit entry">${I.edit}</button></td>
    </tr>`;
    if(!open) return main;
    const legs=tx.lines.map(l=>{const a=acctById(l.accountId);const c2=accCur(a);const isDr=(l.debit||0)>0;const amt=isDr?(l.debit||0):(l.credit||0);
      return `<div class="dleg${a&&a.id===UI.accountId?" self":""}"><span class="dleg-acct">${a?esc(a.name):"—"}</span><span class="dleg-drcr">${isDr?"Dr":"Cr"}</span><span class="dleg-amt">${money(amt,c2)}${c2!==base()?` <span class="curtag">${c2}</span>`:""}</span></div>`;}).join("");
    const detail=`<tr class="regdetail"><td colspan="6"><div class="rdetail">
      <div class="rdetail-legs">${legs}</div>
      <div class="rdetail-meta">Accounting date <b>${tx.date}</b>${tx.createdAt?` · Recorded <b>${esc(fmtCreated(tx.createdAt))}</b>`:""}${tx.comment?` · ${esc(tx.comment)}`:""}</div>
    </div></td></tr>`;
    return main+detail;
  }).join("");
  return head+`<table class="register">
    <thead><tr><th>Date</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th><th></th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

let toastT=null;
function toast(msg){ const r=document.getElementById("toast-root"); if(!r) return; r.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>{r.innerHTML="";},2800); }
/* animate the modal out, then clear it and run an optional callback */
function dismissModal(cb){
  const ov=document.querySelector(".overlay");
  const finish=()=>{ pendingConfirm=null; UI.modal=null; renderModal(); if(cb){ try{ cb(); }catch(e){} } };
  if(!ov || window.matchMedia("(prefers-reduced-motion:reduce)").matches){ finish(); return; }
  ov.classList.add("closing");
  setTimeout(finish,160);
}

/* ---- offline desktop build: zip the running app + a tiny local server
   that persists to ledger.json AND proxies exchange-rate lookups. ---- */
function buildLocalHTML(){
  const styleText=[...document.querySelectorAll('style')].map(s=>s.textContent).join("\n");
  const scriptText=([...document.querySelectorAll('script')].map(s=>s.textContent).filter(t=>t&&t.indexOf("function saveTx")>-1)[0])||"";
  return "<!doctype html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Ledgerbook</title>\n<style>\n"+styleText+"\n</style>\n</head><body>\n<div id=\"app\"></div>\n<div id=\"modal-root\"></div>\n<div id=\"toast-root\"></div>\n<script>\n"+scriptText+"\n<\/script>\n</body></html>\n";
}
const SERVER_GO="// Ledgerbook local server (Go, standard library only).\n// Serves index.html and owns the data file. Storage resolves as:\n//   ledger  : $LEDGER_PATH  -> config.json ledgerPath  -> ./ledger.json (if present) -> iCloud Drive\n//   snapshot: $SNAPSHOT_DIR -> config.json snapshotDir -> <ledger dir>/snapshots\n// A snapshot is written on every save (deduped; newest snapKeep retained).\npackage main\n\nimport (\n\t\"crypto/sha256\"\n\t\"encoding/hex\"\n\t\"encoding/json\"\n\t\"io\"\n\t\"net/http\"\n\t\"net/url\"\n\t\"os\"\n\t\"os/exec\"\n\t\"path/filepath\"\n\t\"sort\"\n\t\"strings\"\n\t\"time\"\n)\n\nfunc git(args ...string) string {\n\tout, err := exec.Command(\"git\", args...).Output()\n\tif err != nil {\n\t\treturn \"\"\n\t}\n\treturn strings.TrimSpace(string(out))\n}\n\nconst project = \"personal-wealth-tracker\"\nconst appVersion = \"v43\" // bump together with index.html's VERSION; the app warns if they differ (restart needed)\nconst snapKeep = 300\n\n// etagOf is an optimistic-concurrency token derived from the file's bytes: it changes on every\n// save, so a PUT with a stale If-Match is refused (409) and a stale in-memory copy can never\n// clobber a fresher file on disk.\nfunc etagOf(b []byte) string { s := sha256.Sum256(b); return `\"` + hex.EncodeToString(s[:])[:16] + `\"` }\n\nfunc home() string { h, _ := os.UserHomeDir(); return h }\n\nfunc defaultConfigDir() string {\n\tif v := os.Getenv(\"PWT_CONFIG_DIR\"); v != \"\" {\n\t\treturn v\n\t}\n\treturn filepath.Join(home(), \"Library\", \"Application Support\", \"PersonalWealthTracker\")\n}\n\nvar (\n\tconfigDir  = defaultConfigDir()\n\tconfigFile = filepath.Join(configDir, \"config.json\")\n\tiCloudDir  = filepath.Join(home(), \"Library\", \"Mobile Documents\", \"com~apple~CloudDocs\", \"PersonalWealthTracker\")\n\thomeDir    = filepath.Join(home(), \"PersonalWealthTracker\")\n)\n\ntype config struct {\n\tLedgerPath  string `json:\"ledgerPath,omitempty\"`\n\tSnapshotDir string `json:\"snapshotDir,omitempty\"`\n}\n\nvar cfg config\nvar ledger string\nvar snapDir string\n\nfunc loadConfig() config {\n\tvar c config\n\tif b, err := os.ReadFile(configFile); err == nil {\n\t\t_ = json.Unmarshal(b, &c)\n\t}\n\treturn c\n}\nfunc saveConfig(c config) error {\n\tif err := os.MkdirAll(configDir, 0o755); err != nil {\n\t\treturn err\n\t}\n\tb, _ := json.MarshalIndent(c, \"\", \"  \")\n\treturn os.WriteFile(configFile, b, 0o644)\n}\nfunc exists(p string) bool { _, err := os.Stat(p); return err == nil }\n\nfunc resolveLedger(c config) string {\n\tif v := os.Getenv(\"LEDGER_PATH\"); v != \"\" {\n\t\treturn v\n\t}\n\tif c.LedgerPath != \"\" {\n\t\treturn c.LedgerPath\n\t}\n\tif wd, err := os.Getwd(); err == nil && exists(filepath.Join(wd, \"ledger.json\")) {\n\t\treturn filepath.Join(wd, \"ledger.json\")\n\t}\n\treturn filepath.Join(iCloudDir, \"ledger.json\")\n}\nfunc resolveSnapDir(c config, led string) string {\n\tif v := os.Getenv(\"SNAPSHOT_DIR\"); v != \"\" {\n\t\treturn v\n\t}\n\tif c.SnapshotDir != \"\" {\n\t\treturn c.SnapshotDir\n\t}\n\treturn filepath.Join(filepath.Dir(led), \"snapshots\")\n}\n\nfunc stamp() string { return time.Now().Format(\"20060102-150405\") }\n\nfunc snapList() []string {\n\tentries, err := os.ReadDir(snapDir)\n\tif err != nil {\n\t\treturn nil\n\t}\n\tvar out []string\n\tfor _, e := range entries {\n\t\tn := e.Name()\n\t\tif strings.HasPrefix(n, project+\"_\") && strings.HasSuffix(n, \".json\") {\n\t\t\tout = append(out, n)\n\t\t}\n\t}\n\tsort.Strings(out)\n\treturn out\n}\n\nfunc writeSnapshot(body []byte) {\n\tif err := os.MkdirAll(snapDir, 0o755); err != nil {\n\t\treturn\n\t}\n\tbefore := snapList()\n\tif len(before) > 0 {\n\t\tif last, err := os.ReadFile(filepath.Join(snapDir, before[len(before)-1])); err == nil && string(last) == string(body) {\n\t\t\treturn // dedupe\n\t\t}\n\t}\n\t_ = os.WriteFile(filepath.Join(snapDir, project+\"_\"+stamp()+\".json\"), body, 0o644)\n\tafter := snapList()\n\tfor i := 0; i < len(after)-snapKeep; i++ {\n\t\t_ = os.Remove(filepath.Join(snapDir, after[i]))\n\t}\n}\n\nfunc writeJSON(w http.ResponseWriter, code int, v any) {\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tw.WriteHeader(code)\n\t_ = json.NewEncoder(w).Encode(v)\n}\n\nfunc main() {\n\tcfg = loadConfig()\n\tledger = resolveLedger(cfg)\n\tsnapDir = resolveSnapDir(cfg, ledger)\n\n\tport := os.Getenv(\"PORT\")\n\tif port == \"\" {\n\t\tport = \"8123\"\n\t}\n\tmux := http.NewServeMux()\n\n\tmux.HandleFunc(\"/api/ping\", func(w http.ResponseWriter, r *http.Request) { w.Write([]byte(\"ok\")) })\n\n\tmux.HandleFunc(\"/api/version\", func(w http.ResponseWriter, r *http.Request) {\n\t\tif git(\"rev-parse\", \"--is-inside-work-tree\") != \"true\" {\n\t\t\twriteJSON(w, 200, map[string]any{\"appVersion\": appVersion, \"isRepo\": false})\n\t\t\treturn\n\t\t}\n\t\twriteJSON(w, 200, map[string]any{\"appVersion\": appVersion, \"isRepo\": true, \"commit\": git(\"rev-parse\", \"--short\", \"HEAD\"),\n\t\t\t\"tag\": git(\"describe\", \"--tags\", \"--exact-match\", \"HEAD\"), \"dirty\": git(\"status\", \"--porcelain\") != \"\"})\n\t})\n\n\tmux.HandleFunc(\"/api/pick\", func(w http.ResponseWriter, r *http.Request) {\n\t\tkind := r.URL.Query().Get(\"kind\")\n\t\tscript := `POSIX path of (choose folder with prompt \"Choose a folder\")`\n\t\tif kind == \"file\" {\n\t\t\tscript = `POSIX path of (choose file with prompt \"Locate your ledger file\")`\n\t\t}\n\t\tout, err := exec.Command(\"osascript\", \"-e\", script).Output()\n\t\tif err != nil {\n\t\t\twriteJSON(w, 200, map[string]any{\"cancelled\": true})\n\t\t\treturn\n\t\t}\n\t\twriteJSON(w, 200, map[string]any{\"path\": strings.TrimSpace(string(out))})\n\t})\n\n\tmux.HandleFunc(\"/api/location\", func(w http.ResponseWriter, r *http.Request) {\n\t\tswitch r.Method {\n\t\tcase http.MethodGet:\n\t\t\twd, _ := os.Getwd()\n\t\t\twriteJSON(w, 200, map[string]any{\"ledgerPath\": ledger, \"snapshotDir\": snapDir, \"ledgerExists\": exists(ledger),\n\t\t\t\t\"defaults\": map[string]string{\"icloud\": filepath.Join(iCloudDir, \"ledger.json\"), \"home\": filepath.Join(homeDir, \"ledger.json\"), \"cwd\": filepath.Join(wd, \"ledger.json\")}})\n\t\tcase http.MethodPut:\n\t\t\tvar o config\n\t\t\tb, _ := io.ReadAll(r.Body)\n\t\t\t_ = json.Unmarshal(b, &o)\n\t\t\tif o.LedgerPath != \"\" {\n\t\t\t\tif !strings.HasPrefix(o.LedgerPath, \"/\") {\n\t\t\t\t\twriteJSON(w, 400, map[string]string{\"error\": \"ledgerPath must be an absolute path\"})\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tledger = o.LedgerPath\n\t\t\t\tif o.SnapshotDir == \"\" && os.Getenv(\"SNAPSHOT_DIR\") == \"\" && cfg.SnapshotDir == \"\" {\n\t\t\t\t\tsnapDir = filepath.Join(filepath.Dir(ledger), \"snapshots\")\n\t\t\t\t}\n\t\t\t}\n\t\t\tif o.SnapshotDir != \"\" {\n\t\t\t\tif !strings.HasPrefix(o.SnapshotDir, \"/\") {\n\t\t\t\t\twriteJSON(w, 400, map[string]string{\"error\": \"snapshotDir must be an absolute path\"})\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tsnapDir = o.SnapshotDir\n\t\t\t}\n\t\t\tcfg.LedgerPath, cfg.SnapshotDir = ledger, snapDir\n\t\t\tif err := saveConfig(cfg); err != nil {\n\t\t\t\twriteJSON(w, 500, map[string]string{\"error\": err.Error()})\n\t\t\t\treturn\n\t\t\t}\n\t\t\t_ = os.MkdirAll(filepath.Dir(ledger), 0o755)\n\t\t\twriteJSON(w, 200, map[string]any{\"ledgerPath\": ledger, \"snapshotDir\": snapDir, \"ledgerExists\": exists(ledger)})\n\t\tdefault:\n\t\t\thttp.Error(w, \"method not allowed\", 405)\n\t\t}\n\t})\n\n\tmux.HandleFunc(\"/api/rates\", func(w http.ResponseWriter, r *http.Request) {\n\t\tw.Header().Set(\"Content-Type\", \"application/json\")\n\t\tsymbol := r.URL.Query().Get(\"symbol\")\n\t\tif key := os.Getenv(\"TWELVEDATA_API_KEY\"); key != \"\" {\n\t\t\tresp, err := http.Get(\"https://api.twelvedata.com/exchange_rate?symbol=\" + url.QueryEscape(symbol) + \"&apikey=\" + url.QueryEscape(key))\n\t\t\tif err != nil {\n\t\t\t\thttp.Error(w, \"upstream error\", 502)\n\t\t\t\treturn\n\t\t\t}\n\t\t\tdefer resp.Body.Close()\n\t\t\tbody, _ := io.ReadAll(resp.Body)\n\t\t\tw.Write(body)\n\t\t\treturn\n\t\t}\n\t\tcur := strings.SplitN(symbol, \"/\", 2)[0]\n\t\tresp, err := http.Get(\"https://open.er-api.com/v6/latest/USD\")\n\t\tif err != nil {\n\t\t\thttp.Error(w, \"upstream error\", 502)\n\t\t\treturn\n\t\t}\n\t\tdefer resp.Body.Close()\n\t\tvar data map[string]any\n\t\tjson.NewDecoder(resp.Body).Decode(&data)\n\t\trates, _ := data[\"rates\"].(map[string]any)\n\t\tif v, ok := rates[cur].(float64); ok && v != 0 {\n\t\t\twriteJSON(w, 200, map[string]any{\"symbol\": symbol, \"rate\": 1.0 / v})\n\t\t} else {\n\t\t\tw.Write([]byte(`{\"rate\":0}`))\n\t\t}\n\t})\n\n\tmux.HandleFunc(\"/api/book\", func(w http.ResponseWriter, r *http.Request) {\n\t\tswitch r.Method {\n\t\tcase http.MethodGet:\n\t\t\tdata, err := os.ReadFile(ledger)\n\t\t\tif err != nil {\n\t\t\t\tdata = []byte(\"null\")\n\t\t\t}\n\t\t\tw.Header().Set(\"Content-Type\", \"application/json\")\n\t\t\tw.Header().Set(\"ETag\", etagOf(data))\n\t\t\tw.Write(data)\n\t\tcase http.MethodPut:\n\t\t\tbody, err := io.ReadAll(r.Body)\n\t\t\tif err != nil {\n\t\t\t\thttp.Error(w, \"read error\", 400)\n\t\t\t\treturn\n\t\t\t}\n\t\t\t// Optimistic concurrency: if the client sent the revision it edited (If-Match), the\n\t\t\t// file on disk must still be at that revision, else refuse (409) and leave it untouched.\n\t\t\tif ifMatch := r.Header.Get(\"If-Match\"); ifMatch != \"\" {\n\t\t\t\tcur, e := os.ReadFile(ledger)\n\t\t\t\tif e != nil {\n\t\t\t\t\tcur = []byte(\"null\")\n\t\t\t\t}\n\t\t\t\tif ifMatch != etagOf(cur) {\n\t\t\t\t\tw.Header().Set(\"ETag\", etagOf(cur))\n\t\t\t\t\twriteJSON(w, 409, map[string]string{\"error\": \"conflict\", \"message\": \"The ledger on disk is newer than the version you edited.\"})\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t}\n\t\t\tif err := os.MkdirAll(filepath.Dir(ledger), 0o755); err != nil {\n\t\t\t\thttp.Error(w, \"mkdir error\", 500)\n\t\t\t\treturn\n\t\t\t}\n\t\t\tif err := os.WriteFile(ledger, body, 0o644); err != nil {\n\t\t\t\thttp.Error( const SERVER_MJS="// Ledgerbook local server (Node, zero dependencies).\n// Serves index.html and owns the data file. The internet is touched only to\n// proxy exchange-rate lookups when you ask for them.\n//\n// Storage resolves in this order (documented as \"fallback paths\"):\n//   ledger  : $LEDGER_PATH  ->  config.json ledgerPath  ->  ./ledger.json (if present)  ->  iCloud Drive\n//   snapshot: $SNAPSHOT_DIR ->  config.json snapshotDir ->  <ledger dir>/snapshots\n// A snapshot is written on every save (deduped; newest SNAP_KEEP retained).\nimport { createServer } from \"http\";\nimport { readFile, writeFile, mkdir, readdir, unlink } from \"fs/promises\";\nimport { existsSync } from \"fs\";\nimport { homedir } from \"os\";\nimport { dirname, join } from \"path\";\nimport { execSync, execFileSync } from \"child_process\";\nimport { createHash } from \"crypto\";\n\nconst PROJECT = \"personal-wealth-tracker\";\nconst APP_VERSION = \"v43\"; // bump together with index.html's VERSION; the app warns if they differ (restart needed)\nconst PORT = process.env.PORT ? Number(process.env.PORT) : 8123;\nconst SNAP_KEEP = 300;\nconst CONFIG_DIR = process.env.PWT_CONFIG_DIR || join(homedir(), \"Library\", \"Application Support\", \"PersonalWealthTracker\");\nconst CONFIG_FILE = join(CONFIG_DIR, \"config.json\");\nconst ICLOUD_DIR = join(homedir(), \"Library\", \"Mobile Documents\", \"com~apple~CloudDocs\", \"PersonalWealthTracker\");\nconst HOME_DIR = join(homedir(), \"PersonalWealthTracker\");\n\nasync function loadConfig() { try { return JSON.parse(await readFile(CONFIG_FILE, \"utf8\")); } catch { return {}; } }\nasync function saveConfig(c) { await mkdir(CONFIG_DIR, { recursive: true }); await writeFile(CONFIG_FILE, JSON.stringify(c, null, 2)); }\n\nfunction resolveLedger(c) {\n  if (process.env.LEDGER_PATH) return process.env.LEDGER_PATH;\n  if (c.ledgerPath) return c.ledgerPath;\n  if (existsSync(join(process.cwd(), \"ledger.json\"))) return join(process.cwd(), \"ledger.json\");\n  return join(ICLOUD_DIR, \"ledger.json\");\n}\nfunction resolveSnapDir(c, ledger) {\n  if (process.env.SNAPSHOT_DIR) return process.env.SNAPSHOT_DIR;\n  if (c.snapshotDir) return c.snapshotDir;\n  return join(dirname(ledger), \"snapshots\");\n}\n\nlet cfg = await loadConfig();\nlet LEDGER = resolveLedger(cfg);\nlet SNAPDIR = resolveSnapDir(cfg, LEDGER);\n\nconst stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, \"0\");\n  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };\n\nasync function writeSnapshot(body) {\n  try {\n    await mkdir(SNAPDIR, { recursive: true });\n    const list = () => readdir(SNAPDIR).then((fs) => fs.filter((f) => f.startsWith(PROJECT + \"_\") && f.endsWith(\".json\")).sort());\n    const before = await list();\n    if (before.length) { const last = await readFile(join(SNAPDIR, before[before.length - 1]), \"utf8\").catch(() => null); if (last === body) return; }\n    await writeFile(join(SNAPDIR, `${PROJECT}_${stamp()}.json`), body);\n    const after = await list();\n    for (const f of after.slice(0, Math.max(0, after.length - SNAP_KEEP))) await unlink(join(SNAPDIR, f)).catch(() => {});\n  } catch { /* a snapshot failure must never block a save */ }\n}\n\nconst body = (req) => new Promise((r) => { let b = \"\"; req.on(\"data\", (c) => (b += c)); req.on(\"end\", () => r(b)); });\nconst json = (res, code, obj) => { res.writeHead(code, { \"content-type\": \"application/json\" }); res.end(JSON.stringify(obj)); };\n// Optimistic-concurrency token: a version tag derived from the file's bytes. Changes on every\n// save, so a client that PUTs with a stale If-Match is refused (409) — a stale in-memory copy\n// (e.g. a background tab's beforeunload flush) can never clobber a fresher file on disk.\nconst etagOf = (buf) => '\"' + createHash(\"sha256\").update(buf).digest(\"hex\").slice(0, 16) + '\"';\nconst NULL = Buffer.from(\"null\");\n\ncreateServer(async (req, res) => {\n  const u = new URL(req.url, \"http://x\");\n\n  if (u.pathname === \"/api/ping\") { res.writeHead(200); return res.end(\"ok\"); }\n\n  if (u.pathname === \"/api/version\") {\n    const git = (c) => { try { return execSync(\"git \" + c, { cwd: process.cwd(), stdio: [\"ignore\", \"pipe\", \"ignore\"] }).toString().trim(); } catch { return \"\"; } };\n    if (git(\"rev-parse --is-inside-work-tree\") !== \"true\") return json(res, 200, { appVersion: APP_VERSION, isRepo: false });\n    return json(res, 200, { appVersion: APP_VERSION, isRepo: true, commit: git(\"rev-parse --short HEAD\"), tag: git(\"describe --tags --exact-match HEAD\"), dirty: git(\"status --porcelain\") !== \"\" });\n  }\n\n  if (u.pathname === \"/api/pick\") {\n    // Native macOS chooser via osascript (works because the server runs on the user's Mac).\n    const kind = u.searchParams.get(\"kind\") || \"folder\";\n    const script = kind === \"file\"\n      ? 'POSIX path of (choose file with prompt \"Locate your ledger file\")'\n      : 'POSIX path of (choose folder with prompt \"Choose a folder\")';\n    try {\n      const p = execFileSync(\"osascript\", [\"-e\", script], { stdio: [\"ignore\", \"pipe\", \"ignore\"] }).toString().trim();\n      return json(res, 200, { path: p });\n    } catch { return json(res, 200, { cancelled: true }); }\n  }\n\n  if (u.pathname === \"/api/location\") {\n    if (req.method === \"GET\")\n      return json(res, 200, { ledgerPath: LEDGER, snapshotDir: SNAPDIR, ledgerExists: existsSync(LEDGER),\n        defaults: { icloud: join(ICLOUD_DIR, \"ledger.json\"), home: join(HOME_DIR, \"ledger.json\"), cwd: join(process.cwd(), \"ledger.json\") } });\n    if (req.method === \"PUT\") {\n      let o = {}; try { o = JSON.parse(await body(req)); } catch {}\n      if (o.ledgerPath !== undefined) { if (!String(o.ledgerPath).startsWith(\"/\")) return json(res, 400, { error: \"ledgerPath must be an absolute path\" }); LEDGER = o.ledgerPath;\n        if (o.snapshotDir === undefined && !process.env.SNAPSHOT_DIR && !cfg.snapshotDir) SNAPDIR = join(dirname(LEDGER), \"snapshots\"); }\n      if (o.snapshotDir !== undefined) { if (!String(o.snapshotDir).startsWith(\"/\")) return json(res, 400, { error: \"snapshotDir must be an absolute path\" }); SNAPDIR = o.snapshotDir; }\n      cfg = { ...cfg, ledgerPath: LEDGER, snapshotDir: SNAPDIR };\n      try { await saveConfig(cfg); await mkdir(dirname(LEDGER), { recursive: true }); } catch (e) { return json(res, 500, { error: String(e) }); }\n      return json(res, 200, { ledgerPath: LEDGER, snapshotDir: SNAPDIR, ledgerExists: existsSync(LEDGER) });\n    }\n  }\n\n  if (u.pathname === \"/api/rates\") {\n    const symbol = u.searchParams.get(\"symbol\") || \"\";\n    const key = process.env.TWELVEDATA_API_KEY;\n    res.setHeader(\"content-type\", \"application/json\");\n    try {\n      if (key) { const up = await fetch(\"https://api.twelvedata.com/exchange_rate?symbol=\" + encodeURIComponent(symbol) + \"&apikey=\" + encodeURIComponent(key)); res.writeHead(200); return res.end(await up.text()); }\n      const cur = symbol.split(\"/\")[0];\n      const up = await fetch(\"https://open.er-api.com/v6/latest/USD\");\n      const j = await up.json();\n      const v = j && j.rates && j.rates[cur];\n      res.writeHead(200); return res.end(JSON.stringify({ symbol, rate: v ? 1 / v : 0 }));\n    } catch { res.writeHead(502); return res.end(JSON.stringify({ rate: 0 })); }\n  }\n\n  if (u.pathname === \"/api/book\") {\n    if (req.method === \"GET\") {\n      let d; try { d = await readFile(LEDGER); } catch { d = NULL; }\n      res.writeHead(200, { \"content-type\": \"application/json\", \"etag\": etagOf(d) });\n      return res.end(d);\n    }\n    if (req.method === \"PUT\") {\n      // Optimistic concurrency: if the client sent the revision it edited (If-Match), the file\n      // on disk must still be at that revision. If it moved on (a newer write landed first),\n      // refuse with 409 and leave the file untouched — the fresher version wins.\n      const ifMatch = req.headers[\"if-match\"];\n      if (ifMatch) {\n        let cur; try { cur = await readFile(LEDGER); } catch { cur = NULL; }\n        const curTag = etagOf(cur);\n        if (ifMatch !== curTag) {\n          res.writeHead(409, { \"content-type\": \"application/json\", \"etag\": curTag });\n          return res.end(JSON.stringify({ error: \"conflict\", message: \"The ledger on disk is newer than the version you edited.\" }));\n        }\n      }\n      const b = await body(req);\n      try { await mkdir(dirname(LEDGER), { recursive: true }); await writeFile(LEDGER, b); } catch (e) { res.writeHead(500); return res.end(String(e)); }\n      writeSnapshot(b);\n      res.writeHead(204, { \"etag\": etagOf(Buffer.from(b)) }); return res.end();\n    }\n  }\n\n  const p = u.pathname === \"/\" ? \"/index.html\" : u.pathname;\n  try {\n    const d = await readFile(\".\" + p);\n    const ct = p.endsWith(\".html\") ? \"text/html; charset=utf-8\" : (p.endsWith(\".mjs\") || p.endsWith(\".js\")) ? \"text/javascript\" : \"application/octet-stream\";\n    res.writeHead(200, { \"content-type\": ct, \"cache-control\": \"no-store\" });\n    res.end(d);\n  } catch { res.writeHead(404); res.end(\"not found\"); }\n}).listen(PORT, \"127.0.0.1\", () => console.log(`Ledgerbook → http://127.0.0.1:${PORT}\\n  ledger:    ${LEDGER}\\n  snapshots: ${SNAPDIR}`));\n";

async function downloadLocalBuild(){
  if(typeof JSZip==="undefined"){ toast("Packaging tool not loaded yet — try again in a moment."); return; }
  toast("Packaging desktop build…");
  try{
    const zip=new JSZip();
    const html=buildLocalHTML();
    zip.file("index.html", html);
    zip.file("server.go", SERVER_GO);
    zip.file("server.mjs", SERVER_MJS);
    zip.file("README.md", READMEMD);
    const blob=await zip.generateAsync({type:"blob"});
    const c=window.claude; const dl=(c&&c.use)?await c.use("downloads"):null;
    if(dl){ await dl.save({filename:backupName("desktop.zip"), data:blob}); return; }
    toast("Download isn't available in this view.");
  }catch(err){ if(err&&err.code==="declined") return; toast("Couldn't build the archive."); }
}

async function saveFile(filename,data){
  try{
    const c=window.claude; const dl=(c&&c.use)?await c.use("downloads"):null;
    if(dl){ await dl.save({filename,data}); return; }
  }catch(err){ if(err&&err.code==="declined") return; }
  // fallback (no downloads capability, e.g. run locally): show text to copy
  const box=document.getElementById("io-out");
  if(box){ box.style.display="block"; box.value=data; box.focus(); box.select(); }
  else { toast("Couldn't save the file here."); }
}

async function saveLocation(){
  const ledgerPath=(document.getElementById("stg-ledger").value||"").trim();
  const snapshotDir=(document.getElementById("stg-snap").value||"").trim();
  if(!ledgerPath.startsWith("/")){ toast("Ledger path must be absolute (start with /)."); return; }
  const base=ledgerPath.split("/").pop();
  if(ledgerPath.endsWith("/") || !base || !base.includes(".")){ toast("The ledger must be a file, not a folder — end the path with a filename like ledger.json."); return; }
  if(!/\.json$/i.test(base)){ toast(`The ledger must be a .json file — “${esc(base)}” isn't.`); return; }
  if(snapshotDir && !snapshotDir.startsWith("/")){ toast("Snapshots path must be absolute."); return; }
  const prev = LOC && LOC.ledgerPath;   // to roll back if the chosen file isn't a valid ledger
  const putLoc = (o)=>fetch("/api/location",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(o)}).then(r=>r.json());
  let res; try{ res=await putLoc({ledgerPath,snapshotDir}); }
  catch(e){ toast("Couldn't reach the local server."); return; }
  if(res.error){ toast(res.error); return; }
  if(res.ledgerExists){
    // adopting an existing file — it MUST be a real ledger (valid JSON with an accounts list), or we roll back
    let raw=null; try{ raw=await (await fetch("/api/book",{cache:"no-store"})).text(); }catch(e){}
    let parsed=null; try{ parsed=JSON.parse(raw); }catch(e){}
    if(!parsed || !Array.isArray(parsed.accounts)){
      if(prev){ try{ await putLoc({ledgerPath:prev}); }catch(e){} }
      toast(`“${esc(base)}” isn't a Ledgerbook file (needs JSON with an "accounts" list). Location unchanged.`);
      return;
    }
    if(Number(parsed.schemaVersion)>SCHEMA){
      if(prev){ try{ await putLoc({ledgerPath:prev}); }catch(e){} }
      toast(`“${esc(base)}” was saved by a newer version — not opened.`);
      return;
    }
    S=migrate(parsed); normalizeState(); loadUIPrefs();
    toast(`Opened ${esc(base)} — ${S.accounts.length} account${S.accounts.length===1?"":"s"} loaded.`);
  } else {
    await STORE.save(S);
    toast(`New file ${esc(base)} created here from your current book (${S.accounts.length} account${S.accounts.length===1?"":"s"}).`);
  }
  UI.modal=null; renderModal(); render();
}

  await saveFile(backupName("json"), JSON.stringify(S,null,2));
}

async function doExportCSV(){
  const rows=[["date","description","account","currency","debit","credit","comment"]];
  [...S.transactions].sort((a,b)=>a.date<b.date?-1:1).forEach(t=>t.lines.forEach(l=>{
    const a=acctById(l.accountId);
    rows.push([t.date,t.description,a?a.name:"?",a?accCur(a):base(),l.debit||0,l.credit||0,t.comment||""]);
  }));
  await saveFile(backupName("ledger.csv"), rows.map(r=>r.map(csvCell).join(",")).join("\n"));
}
function doImport(text){
  let obj; try{ obj=JSON.parse(text); }catch(e){ toast("That doesn't look like valid JSON."); return; }
  if(!obj||!Array.isArray(obj.accounts)||!Array.isArray(obj.transactions)){ toast("Not a Ledgerbook backup (needs accounts and transactions)."); return; }
  askConfirm("Replace ALL current data with the imported file? This can't be undone.", ()=>{
    S = Array.isArray(obj.types)
      ? {types:obj.types,accounts:obj.accounts,transactions:obj.transactions,settings:obj.settings}
      : migrate(obj);   // accept older single-level backups too
    if(!S.settings||!S.settings.currency) S.settings={currency:"USD",rates:{USD:1}};
    if(!S.settings.rates) S.settings.rates={USD:1};
    if(!Array.isArray(S.types)) S.types=[];
    S.accounts.forEach(a=>{ if(!a.currency) a.currency=S.settings.currency; if(a.currency&&S.settings.rates[a.currency]==null) S.settings.rates[a.currency]=1; });
    if(S.settings.rates[S.settings.currency]==null) S.settings.rates[S.settings.currency]=1;
    save(); render(); toast("Book imported.");
  });
}

function acctModal(existing,presetTypeId){

  if(existing){ const t=typeById(existing.typeId); draft={name:existing.name,typeId:existing.typeId,currency:accCur(existing),cls:(t&&t.class)||"asset",comment:existing.comment||""}; }
  else { const pt=presetTypeId?typeById(presetTypeId):null; draft={name:"",typeId:presetTypeId||"",currency:base(),cls:(pt&&pt.class)||"asset",comment:""}; }
  UI.modal={kind:"acct",id:existing?existing.id:null,draft};
  renderModal();
}

function txModal(existing){

  UI.modal={kind:"tx",id:existing?existing.id:null,draft:JSON.parse(JSON.stringify(t))};

function acctOptions(sel,exclude){
  // only detail accounts are selectable — a class or type can never be posted to.
  // `exclude` (a Set of account ids used on OTHER lines) is omitted so the same
  // account can't be picked twice in one entry (keeps this line's own selection).
  let out=`<option value="">— account —</option>`;
  for(const [ck,cl] of CLASSES){
    typesInClass(ck).slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(t=>{
      const accts=accountsInType(t.id).slice().sort((a,b)=>a.name.localeCompare(b.name))
        .filter(a=>!(exclude&&exclude.has(a.id)&&a.id!==sel));
      if(!accts.length) return;
      out+=`<optgroup label="${esc(cl)} · ${esc(t.name)}">`;
      accts.forEach(a=>{ out+=`<option value="${a.id}" ${sel===a.id?"selected":""}>${esc(a.name)}</option>`; });
      out+=`</optgroup>`;
    });
  }
  return out;
}
