<title>Ledgerbook</title>
<meta name="description" content="A double-entry ledger with a chart of accounts.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#f3f5f2; --surface:#ffffff; --surface-2:#f7f9f6;
  --ink:#182420; --muted:#5c6a63; --faint:#8b978f;
  --line:#e0e6df; --line-strong:#cdd6cc;
  --accent:#1f6a52; --accent-ink:#12523f; --accent-soft:#e5f0eb;
  --pos:#1f7a52; --neg:#b23a37;
  /* class colour coding (one source of truth): asset = blue, liability = red, equity = green */
  --cls-asset:#2f6db3; --cls-liability:var(--neg); --cls-equity:var(--accent);
  --shadow:0 1px 2px rgba(24,36,32,.06), 0 8px 24px -12px rgba(24,36,32,.18);
  --shadow-lift:0 12px 40px -12px rgba(24,36,32,.35);
  --r:10px; --r-sm:7px;
  --fs-display:"Fraunces",Georgia,serif;
  --fs-sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --fs-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --paper:#0f1513; --surface:#161e1b; --surface-2:#131a17;
  --ink:#e7efea; --muted:#94a49c; --faint:#6b7a72;
  --line:#26302c; --line-strong:#33403a;
  --accent:#4cc298; --accent-ink:#7ad4b3; --accent-soft:#17302690;
  --pos:#4cc298; --neg:#e08079;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 16px 48px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0f1513; --surface:#161e1b; --surface-2:#131a17;
  --ink:#e7efea; --muted:#94a49c; --faint:#6b7a72;
  --line:#26302c; --line-strong:#33403a;
  --accent:#4cc298; --accent-ink:#7ad4b3; --accent-soft:#17302690;
  --pos:#4cc298; --neg:#e08079;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 16px 48px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none}   /* no rubber-band, so no bare seam past the content */
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--fs-sans);line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--fs-display);font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;color:var(--ink)}
.num{font-family:var(--fs-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* form controls get a clean CONTAINED focus ring (accent border + soft glow) — the offset outline
   above looks like a detached double-border on bordered inputs, and forcing a radius fought the field's own corners */
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,select:focus,textarea:focus,input[type=text]:focus-visible,input[type=date]:focus-visible,input[type=number]:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}

.app{display:grid;grid-template-columns:224px 1fr;min-height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;padding:18px 12px;position:sticky;top:0;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;margin:-4px 0;border-radius:var(--r-sm);cursor:pointer;transition:background .14s}
.brand:hover{background:var(--surface-2)}
.brand:active{transform:scale(.99)}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--fs-display);font-weight:600;font-size:17px;flex:none}
.brand h1{font-size:20px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--muted);font-size:14px;font-weight:500;padding:9px 12px;border-radius:var(--r-sm)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav .navitem{position:relative;display:flex}
.nav .navitem .navlink{flex:1}
.homebtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);opacity:0;background:none!important;border:0;color:var(--faint);cursor:pointer;padding:3px;width:auto!important;display:inline-flex;transition:opacity .14s,color .14s}
.homebtn svg{width:15px;height:15px}
.nav .navitem:hover .homebtn{opacity:.7}
.homebtn:hover{color:var(--ink)}
.homebtn.set{opacity:1;color:var(--accent)}
/* secondary nav items (Dashboard, About) stay hidden until the nav is hovered, or when one is active */
.nav-more{display:flex;flex-direction:column;gap:3px;overflow:hidden;max-height:0;opacity:0;transition:max-height .22s ease,opacity .16s ease}
.nav:hover .nav-more,.nav.more-open .nav-more{max-height:220px;opacity:1}
.nav-hint{display:flex;justify-content:center;align-items:center;color:var(--faint);max-height:22px;opacity:.55;overflow:hidden;transition:max-height .18s ease,opacity .16s ease}
.nav-hint svg{width:15px;height:15px}
.nav:hover .nav-hint,.nav.more-open .nav-hint{max-height:0;opacity:0}
/* dashboard */
.dash{display:flex;flex-direction:column;gap:14px}
.dash-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px}
.dash-hero .dl,.dtile .dl,.dch{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.netnum{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;font-size:clamp(30px,6vw,44px);font-weight:700;line-height:1.1;margin:2px 0}
.dsub{font-size:12.5px;color:var(--muted)}
.dash-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.dash-tiles{grid-template-columns:1fr}}
.dtile{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:13px 16px;display:flex;flex-direction:column;gap:4px}
.dtile b{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;font-size:19px}
.dtile.cls-asset{border-left-color:var(--cls-asset)} .dtile.cls-liability{border-left-color:var(--cls-liability)} .dtile.cls-equity{border-left-color:var(--cls-equity)}
.dash-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.dch{margin-bottom:12px}
/* ---- right rail: quiet, low-contrast "food for thought" widgets that fill the gutter to the
   right of the 860px content column on wide screens. Hidden entirely below the breakpoint, and
   never rendered at all unless a widget is switched on in Settings (so the layout is unchanged
   for anyone who leaves them off). ---- */
.rail{display:none}
.railtoggle{display:none}
@media (min-width:1280px){
  .app.has-rail{grid-template-columns:224px minmax(0,1fr) 300px;transition:grid-template-columns .3s cubic-bezier(.4,0,.2,1)}
  .app.has-rail.rail-collapsed{grid-template-columns:224px minmax(0,1fr) 0}
  .app.has-rail .rail{display:flex;flex-direction:column;gap:14px;padding:20px 16px 30px;border-left:1px solid var(--line);position:sticky;top:0;height:100dvh;overflow:auto}
  .app.has-rail.rail-collapsed .rail{padding-left:0;padding-right:0;border-left-color:transparent}
  /* the collapse tab rides the panel's left edge and slides to the screen edge when closed */
  .app.has-rail .railtoggle{display:flex;align-items:center;justify-content:center;position:fixed;top:50%;transform:translateY(-50%);right:300px;width:22px;height:54px;margin-right:-1px;background:var(--surface);border:1px solid var(--line);border-right:0;border-radius:9px 0 0 9px;color:var(--muted);cursor:pointer;z-index:40;box-shadow:var(--shadow);transition:right .3s cubic-bezier(.4,0,.2,1),background .15s,color .15s}
  .app.has-rail .railtoggle:hover{color:var(--accent);background:var(--surface-2)}
  .app.has-rail.rail-collapsed .railtoggle{right:0}
  .app.has-rail .railtoggle svg{width:16px;height:16px;transform:rotate(-90deg);transition:transform .3s cubic-bezier(.4,0,.2,1)}
  .app.has-rail.rail-collapsed .railtoggle svg{transform:rotate(90deg)}
}
.railcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px}
.railcard .rt{font-size:10.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:6px}
.railcard .rsub{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.4}
.railcard .rnote{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.fxlist{margin-top:10px}
.fxrow{padding:9px 0;border-top:1px solid var(--line)}
.fxrow:first-child{border-top:0;padding-top:2px}
.fxhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fxhead .fxc{font-family:var(--fs-mono);font-size:12px;color:var(--muted)}
.fxhead .fxd{font-family:var(--fs-mono);font-size:11px;color:var(--faint)}
.fxhead .fxd.up{color:color-mix(in srgb,var(--pos) 55%,var(--muted))}
.fxhead .fxd.dn{color:color-mix(in srgb,var(--neg) 55%,var(--muted))}
.fxchart{position:relative;height:34px;margin-top:4px}
.fxchart .spark{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.fxchart .spark path{fill:none;stroke:var(--faint);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.fxchart .spark .area{fill:var(--faint);opacity:.06;stroke:none}
/* the y-range as faint labels: 6-month high pinned to the top, low to the bottom */
.fxbound{position:absolute;left:0;font-family:var(--fs-mono);font-size:9.5px;line-height:1;color:var(--faint);opacity:.85;background:var(--surface);padding:1px 3px;border-radius:3px;pointer-events:none}
.fxbound.hi{top:-3px}
.fxbound.lo{bottom:0;transform:translateY(50%)}   /* centered on the chart's bottom line */
.fxnow{font-family:var(--fs-mono);font-size:10.5px;color:var(--faint);margin-top:9px}
.fxnow b{color:var(--muted);font-weight:600}
.debtclock{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;font-size:21px;color:var(--muted);letter-spacing:-.02em;margin-top:9px;line-height:1.1;word-break:break-word}
.debtclock .dec{font-size:13px;color:var(--faint)}
.debtclock .dec2{font-size:11px;opacity:.6}
.debt-pc{font-family:var(--fs-mono);font-size:12.5px;color:var(--faint);margin-top:6px}
.debt-pc b{color:var(--muted);font-weight:600}
.barrow{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:13px}
.barrow .bl{flex:0 0 32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .btrack{flex:1;height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.barrow .bfill{display:block;height:100%;border-radius:5px;background:var(--muted)}
.barrow .bfill.cls-asset{background:var(--cls-asset)} .barrow .bfill.cls-liability{background:var(--cls-liability)} .barrow .bfill.cls-equity{background:var(--cls-equity)}
.barrow .bv{flex:0 0 auto;font-family:var(--fs-mono);font-variant-numeric:tabular-nums;color:var(--muted);min-width:66px;text-align:right}
/* About / landing page — long editorial scroll with diagrams */
.lp{max-width:680px;margin:0 auto;padding-bottom:40px}
.lp-hero{text-align:center;padding:16px 0 8px}
.lp-mark{width:56px;height:56px;margin:0 auto 16px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.lp-mark svg{width:32px!important;height:32px!important}
.lp-eyebrow{font-family:var(--fs-mono,monospace);font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.lp-title{font-family:var(--fs-serif,Georgia,serif);font-weight:700;font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-.02em;margin:0}
.lp-lede{color:var(--muted);font-size:clamp(16px,2.4vw,18px);line-height:1.55;max-width:56ch;margin:16px auto 0}
.lp-hero-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.lp-hero-tags span{font-family:var(--fs-mono,monospace);font-size:11.5px;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px}
.lp-sec{margin-top:56px}
.lp-kicker{font-family:var(--fs-mono,monospace);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.lp-sec h2{font-family:var(--fs-serif,Georgia,serif);font-weight:700;font-size:clamp(21px,3.6vw,28px);line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lp-p{color:var(--ink);font-size:15px;line-height:1.62;max-width:64ch;margin:12px 0 0}
.lp-p em{color:var(--muted);font-style:italic}
.lp-fig{margin:20px 0 0}
.lp-fig svg{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 14px}
.lp-fig figcaption{font-size:13px;color:var(--muted);line-height:1.5;margin-top:11px;padding:0 2px}
.lp-fig figcaption b{color:var(--ink)}
.lp-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:18px}
.lp-minicard{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:14px 16px}
.lp-minicard h3{margin:0 0 5px;font-size:14.5px;font-weight:600}
.lp-minicard p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.lp-cta{margin-top:60px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:32px 24px}
.lp-cta h2{font-family:var(--fs-serif,Georgia,serif);font-weight:700;font-size:clamp(20px,3.4vw,26px);margin:0;text-wrap:balance}
.lp-cta .lp-p{margin:12px auto 0}
.lp-btn{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:var(--accent);color:#fff;border-radius:var(--r-sm);padding:10px 18px;font-weight:600;font-size:14px;text-decoration:none}
.lp-btn svg{width:18px;height:18px}
.lp-fine{font-family:var(--fs-mono,monospace);font-size:12px;color:var(--faint);margin:18px 0 0}
.lp-details{margin:16px 0 0;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow)}
.lp-details>summary{cursor:pointer;padding:14px 16px;font-weight:600;color:var(--ink);user-select:none;list-style:none}
.lp-details>summary::-webkit-details-marker{display:none}
.lp-details>summary::before{content:"›";display:inline-block;margin-right:8px;color:var(--accent);transition:transform .15s}
.lp-details[open]>summary::before{transform:rotate(90deg)}
.lp-details .lp-seclist{margin:0;padding:0 20px 6px 40px}
.lp-details .lp-seclist li{margin:0 0 10px;font-size:14px;line-height:1.55;color:var(--ink)}
.lp-details .lp-fine{padding:0 16px 14px 40px;margin:4px 0 0}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 2px}
/* footer: Settings always shown; Currency + Exchange rates reveal on hover (mirrors the nav's Dashboard/About) */
.foot-more{display:flex;flex-direction:column;gap:8px;overflow:hidden;max-height:0;opacity:0;transition:max-height .22s ease,opacity .16s ease,margin-top .22s ease}
.side-foot:hover .foot-more,.side-foot:focus-within .foot-more{max-height:130px;opacity:1;margin-top:8px}
.foot-hint{display:flex;justify-content:center;align-items:center;color:var(--faint);max-height:20px;opacity:.5;overflow:hidden;transition:max-height .18s ease,opacity .16s ease,margin-top .18s ease;margin-top:6px}
.foot-hint svg{width:15px;height:15px;transform:rotate(180deg)}
.side-foot:hover .foot-hint,.side-foot:focus-within .foot-hint{max-height:0;opacity:0;margin-top:0}
/* custom currency picker (native <select> can't be themed and shows no country) */
.curp{position:relative;width:100%}
.curp-btn{width:100%;display:flex;align-items:center;gap:8px;padding:5px 9px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font:inherit;color:var(--ink);cursor:pointer;text-align:left;transition:border-color .15s ease,box-shadow .15s ease}
.curp-btn:hover{border-color:var(--muted)}
.curp.open .curp-btn{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.curp-btn .curp-code{font-weight:700;font-size:12.5px;flex:none}
.curp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.curp-chev{flex:none;display:flex;color:var(--faint);margin-left:auto}
.curp-chev svg{width:14px;height:14px;transition:transform .18s}
.curp.open .curp-chev svg{transform:rotate(180deg)}
.curpanel{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-lift);max-height:340px;overflow:hidden;display:flex;flex-direction:column}
.curpanel.grouped{width:300px}
.curpanel-search{padding:8px;border-bottom:1px solid var(--line);flex:none}
.curpanel-search input{width:100%}
.curpanel-list{overflow:auto;padding:4px}
.curp-group{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);padding:8px 12px 3px;position:sticky;top:0;background:var(--surface)}
.curp-empty{padding:14px 12px;color:var(--muted);font-size:13px;text-align:center}
.curp-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 10px;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;border-radius:7px}
.curp-opt:hover{background:var(--surface-2)}
.curp-opt.sel{background:var(--accent-soft)}
.curp-opt .curp-code{flex:none;width:40px;font-weight:700;font-size:12.5px}
.curp-opt.sel .curp-code{color:var(--accent-ink)}
.curp-cty{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.themeseg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.themeseg button{border:0;background:none;color:var(--muted);font-weight:500;font-size:12px;padding:6px 4px;border-radius:5px}
.themeseg button:hover{color:var(--ink)}
.themeseg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.main{min-width:0;display:flex;flex-direction:column}
.mainhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:clamp(16px,3vw,26px) clamp(16px,3vw,28px) 12px;position:sticky;top:0;z-index:30;background:var(--paper)}
.mainhead h2{font-size:19px}
.mainhead .grow{flex:1}
.ver{font-family:var(--fs-mono);font-size:11.5px;color:var(--faint);text-align:right;line-height:1.5}
.warn-badge{display:inline-block;font-family:var(--fs-sans);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:#f4d774;color:#5c4400;white-space:nowrap}
.warn-badge.crit{background:var(--neg);color:#fff}
.warnbanner{margin:14px clamp(16px,3vw,28px) 0;border:1px solid #e6c65a;border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow)}
.wbrow{background:#fbeec2;color:#5c4400;padding:9px 14px;font-size:12.5px;line-height:1.45}
.wbrow.crit{background:#f6dcda;color:#8a2b28;border-top:1px solid #e6b4b0}
:root[data-theme="dark"] .warnbanner{border-color:#6b5a1f}
:root[data-theme="dark"] .wbrow{background:#3a3113;color:#f4d774}
:root[data-theme="dark"] .wbrow.crit{background:#3a1f1e;color:#e08079;border-top-color:#5c2f2c}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .warnbanner{border-color:#6b5a1f}
  :root:not([data-theme="light"]) .wbrow{background:#3a3113;color:#f4d774}
  :root:not([data-theme="light"]) .wbrow.crit{background:#3a1f1e;color:#e08079;border-top-color:#5c2f2c}
}
.content{padding:clamp(16px,3vw,26px);max-width:860px;width:100%}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 13px;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.xs{padding:4px 8px;font-size:11.5px;white-space:nowrap}
.datewrap{display:flex;gap:6px;align-items:stretch}
/* custom date picker (native calendar popup can't be themed) */
.datepick{position:relative;flex:1 1 auto;min-width:0}
.datepick-btn{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.datepick-btn:hover{border-color:var(--muted)}
.datepick.open .datepick-btn{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.datepick-ic{flex:none;display:flex;color:var(--muted)}
.datepick-ic svg{width:16px;height:16px}
.datepick-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.datepanel{position:fixed;z-index:120;width:272px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow-lift);padding:10px}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dp-title{font-weight:700;font-size:14px}
.dp-title-btn{border:0;background:none;font:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;padding:4px 10px;border-radius:7px}
.dp-title-btn:hover{background:var(--surface-2)}
.dp-mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 0}
.dp-mgrid .dmcell{height:42px;border:0;background:none;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.dp-mgrid .dmcell:hover{background:var(--surface-2)}
.dp-mgrid .dmcell.today{color:var(--accent);font-weight:800}
.dp-mgrid .dmcell.sel{background:var(--accent);color:#fff}
.dp-nav{display:grid;place-items:center;width:28px;height:28px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:7px}
.dp-nav:hover{background:var(--surface-2);color:var(--accent)}
.dp-nav svg{width:16px;height:16px}
.dp-nav:first-child svg{transform:rotate(90deg)}
.dp-nav:last-child svg{transform:rotate(-90deg)}
.dp-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.dp-week span{text-align:center;font-size:11px;font-weight:600;color:var(--faint);padding:2px 0}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.dcell{height:32px;border:0;background:none;border-radius:7px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.dcell:hover{background:var(--surface-2)}
.dcell.out{color:var(--faint)}
.dcell.today{font-weight:800;color:var(--accent)}
.dcell.sel{background:var(--accent);color:#fff;font-weight:700}
.dcell.sel.today{color:#fff}
.dp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.dp-link{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;font-size:13px;cursor:pointer;padding:2px 4px}
.dp-link:hover{text-decoration:underline}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.iconbtn{background:none;border:0;color:var(--faint);padding:6px;border-radius:6px;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
svg{stroke-width:1.7}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 10px;font-size:13.5px;width:100%}
/* required field that's empty/invalid on submit */
input.invalid,select.invalid,textarea.invalid{border-color:var(--neg)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 20%,transparent)}
textarea{font-family:inherit;resize:vertical;min-height:44px;line-height:1.4}
input[type=number]{text-align:right;font-family:var(--fs-mono);font-variant-numeric:tabular-nums}
.amtin{text-align:right;font-family:var(--fs-mono);font-variant-numeric:tabular-nums}
.amtin:disabled{background:var(--surface-2);color:var(--faint);cursor:not-allowed;opacity:.7}
.lockrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.curlock{font-size:14px}
.convprev{margin-top:2px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.convtbl{width:100%;border-collapse:collapse;font-size:13px}
.convtbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);padding:4px 6px;border-bottom:1px solid var(--line);font-weight:600}
.convtbl td{padding:6px;border-bottom:1px solid var(--line)}
.convtbl tr:last-child td{border-bottom:none}
.convtbl .num{text-align:right;font-family:var(--fs-mono);font-variant-numeric:tabular-nums}
.convnote{margin-top:10px;font-size:12.5px;color:var(--muted)}
.convnote.warn{color:#b0741a}
.stdlist{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto}
.stdrow{display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;font:inherit;width:100%}
.stdrow:hover{border-color:var(--accent);background:var(--accent-soft)}
.stdrow-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stdrow-top b{font-size:13.5px;color:var(--ink)}
.stdrow-badge{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.stdrow-badge.mon{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}
.stdrow-badge.non{background:var(--surface-2);color:var(--muted)}
.stdrow-desc{font-size:11.5px;color:var(--faint)}
.brandtext{display:flex;flex-direction:column;gap:1px;min-width:0}
.ledgername{display:inline-flex;align-items:center;gap:5px;background:none;border:none;padding:2px 0 0;margin:0;cursor:pointer;font:inherit;color:var(--muted);max-width:100%}
.ledgername:hover{color:var(--ink)}
.ledgername .ldot{width:9px;height:9px;border-radius:50%;background:var(--lc);flex:none}
.ledgername .lname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledgername .lchev{opacity:.6;display:inline-flex}.ledgername .lchev svg{width:12px;height:12px}
.ldglist{display:flex;flex-direction:column;gap:6px}
.ldgrow{display:flex;flex-direction:column;gap:7px;padding:8px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.ldgrow.cur{border-color:var(--accent);background:var(--accent-soft)}
.ldgtop{display:flex;align-items:center;gap:9px}
.lpath{display:flex;align-items:center;gap:6px;width:100%;text-align:left;font-family:var(--fs-mono);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.lpath:hover{border-color:var(--accent);color:var(--ink)}
.lpath .lpicon{flex:none;opacity:.6;display:inline-flex}.lpath .lpicon svg{width:12px;height:12px}
/* Anchor to the END so the filename shows when it doesn't fit (direction:rtl clips/scrolls from the
   left); the path is ASCII LTR so it still reads left-to-right. Horizontally scrollable to see the rest. */
.lpath .lptext{overflow-x:auto;overflow-y:hidden;white-space:nowrap;min-width:0;direction:rtl;scrollbar-width:thin}
.lpath .lptext::-webkit-scrollbar{height:5px}
.lpath .lptext::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.lcustom{display:inline-flex;align-items:center;gap:6px;margin-left:2px}
.lcolorin{width:26px;height:26px;padding:0;border:1px solid var(--line-strong);border-radius:50%;background:none;cursor:pointer}
.lcolorin::-webkit-color-swatch-wrapper{padding:2px}.lcolorin::-webkit-color-swatch{border:none;border-radius:50%}
.lhex{font-family:var(--fs-mono);font-size:11px;color:var(--muted)}
.lswatch{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer;flex:none;padding:0}
.lrename{flex:1;min-width:0;border:1px solid transparent;background:none;font:inherit;font-weight:600;font-size:14px;color:var(--ink);padding:4px 6px;border-radius:6px}
.lrename:hover{border-color:var(--line)}
.lrename:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.lcurbadge{font-size:10.5px;font-weight:600;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 16%,transparent);padding:2px 8px;border-radius:999px;white-space:nowrap}
.lpalette{display:flex;flex-wrap:wrap;gap:7px;padding:8px 9px 2px}
.lsw{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer;padding:0}
.lsw.on{box-shadow:0 0 0 2px var(--accent)}
.lsw:disabled{opacity:.28;cursor:not-allowed}
.lnewrow{display:flex;gap:8px;margin-top:4px}
.lnewrow input{flex:1}
.iconbtn.danger:hover{color:var(--neg)}
.acct-intro{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r-sm);padding:11px 14px;font-size:13px;color:var(--ink);line-height:1.5;margin-bottom:14px}
label.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label.field input,label.field select{font-weight:400;color:var(--ink)}

.groupwrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.grouphead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.grouphead .ghright{display:flex;align-items:center;gap:8px}
.grouphead h3{font-size:15px}
/* class colour: one CONTINUOUS left strip keyed to the class (asset / liability / equity).
   It runs unbroken down the whole block, but tapers thinner where it passes a type header
   and swells back to full weight along the account rows — a subtle thick/thin rhythm.
   Inset box-shadow (not border) so it never shifts the row text. */
.groupwrap{--ctick:var(--line-strong)}
.groupwrap.cls-asset{--ctick:var(--cls-asset)} .groupwrap.cls-liability{--ctick:var(--cls-liability)} .groupwrap.cls-equity{--ctick:var(--cls-equity)}
.groupwrap .typehead{box-shadow:inset 1.5px 0 0 var(--ctick)}
.groupwrap .acctwrap{box-shadow:inset 3px 0 0 var(--ctick)}
.grouphead .total{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted)}
.arow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
/* Compact density: tighten row/card padding for people who want more on screen (Settings › Appearance) */
.app.dense .arow{padding:6px 16px}
.app.dense .grouphead{padding:7px 16px}
.app.dense .typehead{padding-top:5px;padding-bottom:5px}
.app.dense .txcard{margin-bottom:6px}
.app.dense .txhead{padding-top:4px;padding-bottom:4px}
.app.dense .txcard table.txlines td{padding-top:2px;padding-bottom:2px}
.arow:last-child{border-bottom:0}
.typehead{display:flex;align-items:center;gap:8px;padding:8px 16px;background:color-mix(in srgb,var(--surface-2) 60%,transparent);border-bottom:1px solid var(--line)}
.typehead .tname{flex:1;font-weight:600;font-size:12.5px}
.typehead .ttotal{color:var(--muted);font-size:12.5px;margin-right:2px}
.typehead .chev{color:var(--faint);flex:none;transition:transform .15s}
.typehead.collapsed .chev{transform:rotate(-90deg)}
.typehead .tname{cursor:pointer}
.tcount{font-family:var(--fs-sans);font-size:10px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:0 6px;margin-left:6px;vertical-align:1px}
.cnote{display:block;color:var(--faint);font-size:11.5px;font-weight:400;font-style:italic;margin-top:3px;white-space:pre-wrap;line-height:1.35}
.arow.acct{padding-left:28px}
.arow .name{flex:1}
.arow .sub{color:var(--faint)}
.arow .bal .sub{margin-right:8px;font-size:12px}
.curtag{font-family:var(--fs-mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;margin-left:4px}
.muted{color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:22px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lift);z-index:200;max-width:90%;text-align:center;display:flex;align-items:center;gap:12px;justify-content:center}
.toast-act{background:transparent;border:0;color:var(--paper);font:inherit;font-weight:700;cursor:pointer;padding:2px 4px;border-bottom:1.5px solid currentColor;line-height:1.1}
.toast-act:hover{opacity:.82}
.rates{display:flex;flex-direction:column;gap:8px}
.raterow{display:grid;grid-template-columns:70px 14px 1fr 44px;gap:8px;align-items:center}
.raterow .rc{font-family:var(--fs-mono);font-size:13px;color:var(--muted)}
.raterow .eq{color:var(--faint);text-align:center}
.arow .bal{font-family:var(--fs-mono);font-variant-numeric:tabular-nums}

.txcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.txhead{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line)}
.txhead .date{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.txhead .desc{flex:1;font-weight:600;font-size:13.5px}
.txhead .txsum{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.txhead .txsum .cur{color:var(--faint);font-size:10px;font-weight:400;margin-left:3px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 16px;border-bottom:1px solid var(--line)}
thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{font-family:var(--fs-mono);font-variant-numeric:tabular-nums;text-align:right}
tfoot td{font-weight:600;border-top:1px solid var(--line-strong)}
/* compact ledger postings: no per-card header/footer rows, single Dr/Cr amount column */
.txcard table.txlines td{padding:4px 14px;font-size:13px;border-bottom:0}
.txcard table.txlines .acct{width:100%}
.txcard table.txlines .drcr{font-family:var(--fs-mono);font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--faint);text-align:right;padding-right:8px;white-space:nowrap}
.txcard table.txlines .num{white-space:nowrap;min-width:88px}
.txcard table.txlines tr:first-child td{padding-top:7px}
.txcard table.txlines tr:last-child td{padding-bottom:8px}
.txnote{padding:7px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:pre-wrap}

.empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r)}
/* rich first-run empty state: icon + what this is + one clear next step */
.empty2{text-align:center;padding:52px 24px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:7px}
.empty2-ic{width:42px;height:42px;color:var(--accent);opacity:.85;margin-bottom:2px}
.empty2-ic svg{width:100%;height:100%}
.empty2 h3{font-size:16.5px;margin:0;color:var(--ink)}
.empty2 p{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 8px;max-width:360px}
/* the whole ledger header — toolbar AND the expanded filter row — sticks together under the main header */
.ledgerhead{position:sticky;top:var(--head-h,60px);z-index:6;background:var(--paper);padding:8px 0 10px}
.ledgertools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;font-weight:600;color:var(--muted)}
.ledgertools .lfilters,.ledgertools .lsort{display:flex;align-items:center;gap:8px}
.ledgertools .lfilters{flex:0 1 auto;min-width:0;flex-wrap:wrap}
.ledgertools .lsort{flex:none;margin-left:auto}
.ledgertools select{width:auto;font-weight:400;color:var(--ink)}
.ledgertools .lsearch{flex:1 1 150px;min-width:110px;max-width:300px;font-weight:400;color:var(--ink);padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font-size:13px}
.filterbtn{display:inline-flex;align-items:center;gap:6px}
.filterbtn svg{width:14px;height:14px}
.filterbtn.on{border-color:var(--accent);color:var(--accent)}
.fbadge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.filterpanel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0;max-height:0;opacity:0;overflow:hidden;transition:max-height .26s cubic-bezier(.2,.7,.3,1),opacity .2s ease,margin-top .26s ease}
.filterpanel.open{max-height:200px;opacity:1;margin-top:2px}
.ffield{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.ffield select,.ffield input{font-weight:400;color:var(--ink);padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font-size:13px}
.amtrow{display:flex;gap:6px}
.amtrow input{width:140px}

const STD_TYPES=[
  {name:"Cash & bank",cls:"asset",monetary:true,desc:"Currency, checking and savings — money at face value."},
  {name:"Accounts receivable",cls:"asset",monetary:true,desc:"Money others owe you, fixed in amount."},
  {name:"Investments & securities",cls:"asset",monetary:true,desc:"Marketable holdings — stocks, bonds, funds."},
  {name:"Inventory",cls:"asset",monetary:false,desc:"Goods held for use or sale, carried at cost."},
  {name:"Prepaid expenses",cls:"asset",monetary:false,desc:"Costs paid in advance, consumed over time."},
  {name:"Tangible / fixed assets",cls:"asset",monetary:false,desc:"Physical property — vehicles, equipment, real estate."},
  {name:"Intangible assets",cls:"asset",monetary:false,desc:"Non-physical — goodwill, IP, licenses."},
  {name:"Accounts payable",cls:"liability",monetary:true,desc:"Money you owe others, fixed in amount."},

function migrate(st){
  if(st && Array.isArray(st.types)) return st; // already Class/Type/Account shape
  // convert old { accounts:{id,name,type,currency,parentId} } -> classes/types/accounts
  const old=(st&&st.accounts)||[];
  const hasKids=id=>old.some(a=>a.parentId===id);
  const types=[]; const generalOf={};
  const ensureGeneral=cls=>{ if(!generalOf[cls]){ const t={id:uid(),name:"General",class:cls}; types.push(t); generalOf[cls]=t.id; } return generalOf[cls]; };
  old.forEach(a=>{ if(hasKids(a.id)) types.push({id:a.id,name:a.name,class:a.type}); }); // a parent account becomes a Type (reuse id)
  const typeIds=new Set(types.map(t=>t.id));
  const accounts=[];
  old.forEach(a=>{
    if(hasKids(a.id)) return; // became a Type
    const typeId=(a.parentId&&typeIds.has(a.parentId))?a.parentId:ensureGeneral(a.type);
    accounts.push({id:a.id,name:a.name,typeId,currency:a.currency||(st.settings&&st.settings.currency)||"USD"});
  });
  const accIds=new Set(accounts.map(a=>a.id));
  const transactions=((st&&st.transactions)||[]).filter(t=>Array.isArray(t.lines)&&t.lines.length&&t.lines.every(l=>accIds.has(l.accountId)));
  return {types,accounts,transactions,settings:(st&&st.settings)||{currency:"USD"}};
}

function normalizeState(){
  if(!Array.isArray(S.types)) S.types=[];
  if(!S.settings) S.settings={currency:"USD"};
  if(!S.settings.rates) S.settings.rates={USD:1};
  S.accounts.forEach(a=>{ if(!a.currency) a.currency=S.settings.currency; });                 // pin a fixed currency per account
  S.accounts.forEach(a=>{ if(a.currency&&S.settings.rates[a.currency]==null) S.settings.rates[a.currency]=1; });
  if(S.settings.rates[S.settings.currency]==null) S.settings.rates[S.settings.currency]=1;
  if(!["auto","light","dark"].includes(S.settings.theme)) S.settings.theme="auto";
  // time zone: left empty means "same as my system" — orgTz() falls back to deviceTz() dynamically
  // v2 backfill: give any pre-existing transaction a createdAt. We don't know the real booking
  // instant, so proxy it from the transaction date (noon local, to stay on the same calendar day).
  S.transactions.forEach(t=>{ if(!t.createdAt) t.createdAt=new Date((t.date||"1970-01-01")+"T12:00:00").toISOString(); });
  // v3 backfill: append-only change log. Seed a "create" event (from createdAt) for any transaction
  // not yet represented in the log, so history isn't empty for pre-v3 books.
  if(!Array.isArray(S.auditLog)) S.auditLog=[];
  const logged=new Set(S.auditLog.map(e=>e.txId));
  S.transactions.forEach(t=>{ if(!logged.has(t.id)) S.auditLog.push({ts:t.createdAt,action:"create",txId:t.id,desc:t.description}); });
  // v4 backfill: freeze each leg's USD rate (historical FX). We have no historical rate for old entries,
  // so we stamp the current rate ONCE — from then on it's frozen and the entry can't drift. Also record
  // the pivot/vehicle each entry's rates are in (pre-v4 books were always USD-anchored).
  if(S.settings.rates[vehicle()]==null) S.settings.rates[vehicle()]=1;   // the pivot must read as 1.0
  S.transactions.forEach(t=>{ if(t.vehicle==null) t.vehicle="USD"; (t.lines||[]).forEach(l=>{ if(l.rate==null) l.rate=round4(rateUSD(accCur(acctById(l.accountId)))); }); });
  // v5 backfill: mark each account monetary or not. Monetary = cash-like (revalued by FX; converting realizes
  // a gain/loss); non-monetary = carried at historical cost (equity, physical assets — no FX gain/loss).
  // Default by class: equity is non-monetary, assets and liabilities are monetary. Users override the exceptions.
  S.accounts.forEach(a=>{ if(a.monetary==null) a.monetary=(classOf(a)!=="equity"); });

    const t0=performance.now(), dur=520, from=prev, delta=target-from;
    (function frame(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=money(from+delta*e,cur);
      if(p<1) requestAnimationFrame(frame); else el.textContent=money(target,cur);
    })(t0);
  });
}

/* ---- explicit commit/migration warning banner (top of the main pane) ----
   COMMITTED / MIGRATION_UNCOMMITTED are stamped by hand at each publish.
   If the code is ahead of git, show a DOUBLE warning: (1) uncommitted code,
   and (2) that any data-shape change made since the last commit is an
   unversioned "dead" migration that can rewrite the ledger. ---- */
function warnBanner(){
  const vi=verInfo();
  if(vi.committed && !vi.migration) return "";
  let rows="";
  if(!vi.committed){
    rows+=`<div class="wbrow"><b>⚠ Uncommitted changes.</b> The code running here is ahead of the last commit (${vi.label}). Treat this as a draft, not prod.</div>`;
    rows+=`<div class="wbrow crit"><b>⛔ Possible dead migration.</b> Any change to the data shape made after ${vi.label} is unversioned — it can rewrite <b>ledger.json</b> with no matching commit. Export a JSON backup before you keep editing.</div>`;
  }
  if(vi.migration){
    rows+=`<div class="wbrow crit"><b>⛔ Uncommitted data migration.</b> A migration ran after the last commit. Back up and commit before continuing.</div>`;
  }
  return `<div class="warnbanner" role="alert">${rows}</div>`;
}

function txAmount(t){ return round2(convert(txUSD(t),t.vehicle||"USD",base())); }   // frozen magnitude (in the entry's own vehicle) shown in the current display base
function sortTxs(arr){
  const s=UI.ledgerSort||"date-desc";
  const ord=new Map(S.transactions.map((t,i)=>[t.id,i])); // insertion order: later index = more recently added
  const byDate=(a,b)=>a.date<b.date?-1:(a.date>b.date?1:0);
  const byAddDesc=(a,b)=>(ord.get(b.id)??0)-(ord.get(a.id)??0); // most-recently-added first
  const byAddAsc =(a,b)=>(ord.get(a.id)??0)-(ord.get(b.id)??0);
  const cAt=t=>t.createdAt||""; const byCreatedDesc=(a,b)=>(cAt(a)<cAt(b)?1:cAt(a)>cAt(b)?-1:0); // newest booking instant first
  arr.sort((a,b)=>{
    switch(s){
      case "date-asc":    return byDate(a,b) || byAddAsc(a,b);
      case "added-desc":  return byCreatedDesc(a,b) || byAddDesc(a,b); // by createdAt (booking instant), then insertion order
      case "amount-desc": return (txAmount(b)-txAmount(a)) || byDate(b,a) || byAddDesc(a,b);
      case "amount-asc":  return (txAmount(a)-txAmount(b)) || byDate(a,b) || byAddDesc(a,b);
      case "alpha":       return (a.description||"").localeCompare(b.description||"") || byDate(b,a) || byAddDesc(a,b);
      default:            return byDate(b,a) || byAddDesc(a,b); // date-desc: newest date, then most-recently-added
    }
  });
  return arr;
}

    <section class="lp-sec">
      <p class="lp-kicker">05 — Three kinds of currency</p>
      <h2>Account, vehicle, display — and why they’re different.</h2>
      <p class="lp-p">Multi-currency money quietly involves <b>three</b> distinct currencies, and keeping them straight is what makes the numbers trustworthy:</p>
      <ul class="lp-seclist">
        <li><b>Account currency</b> — set <i>per account</i>. What that account is actually denominated in: a Monobank account in UAH, an Israeli account in ILS, a wallet in BTC. It never changes on its own; a hryvnia stays a hryvnia.</li>
        <li><b>Base currency</b> (also called <i>display</i> or <i>default</i>) — set once, app-wide. The single currency every total is <i>shown</i> in, so a net worth spread across five currencies reads as one number. Changing it re-translates what you see; it never touches what’s stored.</li>
        <li><b>Vehicle currency</b> (also called the <i>intermediary</i> or pivot; defaults to USD) — the currency cross-conversions <i>route through</i>, and the currency each entry is <b>frozen against</b> when you save. To value a UAH↔ILS entry we don’t hunt for a direct hryvnia-shekel quote — we hop UAH→USD→ILS. And the rate is locked onto the entry at save time, so a settled transaction’s value never drifts when live rates move later.</li>
      </ul>
      <p class="lp-p">Because of that, a single line has <b>three ways to read its amount</b> — worth knowing so nothing looks like it silently changed:</p>
      <ul class="lp-seclist">
        <li><b>Native amount</b> — what you type, in the account’s own currency: <code>1,000 UAH</code>. This is the number the account actually holds and it never moves.</li>
        <li><b>Frozen value</b> (accountants call it the <i>carrying value</i>) — that native amount converted to the vehicle at the rate <b>locked when you saved</b>: <code>1,000 UAH × 0.024 = 24 USD</code>. This is what the books balance in and what never drifts, even when live rates move.</li>
        <li><b>Displayed amount</b> — the frozen value re-expressed in your <i>base</i> currency, live, only for reading: <code>24 USD → €22</code>. Change your display currency and only this number restates; native and frozen value stay put.</li>
      </ul>
      <figure class="lp-fig">

      <h2>Everything that keeps your numbers in.</h2>
      <p class="lp-p">The short version is above; here is the full list, for anyone who wants to check the work.</p>
      <details class="lp-details">
        <summary>Privacy &amp; safety measures, in full</summary>
        <ul class="lp-seclist">
          <li><b>Local-first, loopback-only.</b> Your books are one JSON file on your machine. The local server listens on <code>127.0.0.1</code> only, so nothing off your computer can reach it.</li>
          <li><b>No account, no cloud, no telemetry.</b> The only traffic that ever leaves is what you trigger: an exchange-rate lookup, or an AI draft.</li>
          <li><b>AI drafting never sends your ledger's numbers.</b> Your balances, amounts, rates and account ids never leave — accounts are referred to by letters (A, B, C…), their names are digit-scrubbed, and a hard check blocks the request if a digit reaches that ledger-derived content. Only your own words are sent as you wrote them, so numbers you type into the request (like a price for context) go through. Your OpenRouter key is minted by a browser-only OAuth flow and stays in your browser.</li>
          <li><b>Your data can’t be silently corrupted.</b> Every file carries a schema version — a file written by a newer version is refused, not overwritten — and an ETag guard means a stale tab can never clobber a fresher save. A timestamped snapshot is written on every change, so you can always roll back.</li>
          <li><b>Nothing hidden on disk.</b> Config and snapshots live in a project-local folder you can see, never in system directories.</li>
          <li><b>Browser hardened.</b> The page turns off spellcheck (so Chrome can’t send field text to Google for “enhanced” checking), marks itself non-translatable, and sends no referrer on outbound requests.</li>
          <li><b>Privacy Mode.</b> Blur every amount for a screenshot, then reveal one at a time.</li>
        </ul>

function viewDashboard(){
  const A=classTotalBase("asset"), L=classTotalBase("liability"), E=classTotalBase("equity");
  const net=round2(A-L);
  const rows=S.types.map(t=>({name:t.name,cls:t.class,v:typeBalanceBase(t.id)})).filter(r=>Math.abs(r.v)>0.005).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  const max=rows.reduce((m,r)=>Math.max(m,Math.abs(r.v)),0)||1;
  const tiles=[["asset","Assets",A],["liability","Liabilities",L],["equity","Equity",E]];
  const nEntries=S.transactions.filter(t=>!t.deleted).length;
  return `<div class="dash">
    <div class="dash-hero">
      <span class="dl">Net worth · ${base()}</span>
      <div class="netnum">${money(net)}</div>
      <span class="dsub">Assets − Liabilities · ${nEntries} ${nEntries===1?"entry":"entries"} · ${S.accounts.length} accounts</span>
    </div>
    <div class="dash-tiles">${tiles.map(([c,l,v])=>`<div class="dtile cls-${c}"><span class="dl">${l}</span><b>${money(v)}</b></div>`).join("")}</div>
    ${rows.length?`<div class="dash-card"><div class="dch">Balances by type</div>${rows.map(r=>{const pct=Math.max(2,Math.round(Math.abs(r.v)/max*100));
       return `<div class="barrow"><span class="bl">${esc(r.name)}</span><span class="btrack"><span class="bfill cls-${r.cls}" style="width:${pct}%"></span></span><span class="bv">${money(r.v)}</span></div>`;}).join("")}</div>`
     :emptyState("Nothing to chart yet","Add a few accounts and post some transactions — your net worth, class totals, and balances by type will appear here.",`<button class="btn primary" data-action="new-tx">${I.plus}New transaction</button>`,I.coin)}
  </div>`;
}
function viewLedger(){
  const mode=UI.ledgerMode||"entries";
  const all=S.transactions;
  const anyLog=(S.auditLog||[]).length;
  if(!all.length && !anyLog) return emptyState("No entries yet","Record your first transaction — every entry has a debit and an equal credit, so your books always balance.",`<button class="btn primary" data-action="new-tx">${I.plus}New transaction</button>`,I.coin);
  const q=(UI.ledgerQuery||"").trim().toLowerCase();
  const af=UI.ledgerAccount||"";
  const amtOp=UI.amtOp||"", amtVal=parseFloat(UI.amtVal);
  const amtOn=!!amtOp && !isNaN(amtVal);
  const cmp=v=>{ switch(amtOp){case"gt":return v>amtVal;case"gte":return v>=amtVal;case"lt":return v<amtVal;case"lte":return v<=amtVal;case"eq":return round2(v)===round2(amtVal);default:return true;} };
  const acctOpts=`<option value="">All accounts</option>`+
    S.accounts.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`<option value="${a.id}" ${af===a.id?"selected":""}>${esc(a.name)}</option>`).join("");
  const nFilters=(af?1:0)+(amtOn?1:0);
  const active=!!(q||af||amtOn);
  let listHtml, count, total;
  if(mode==="activity"){
    // Activity = the append-only change log. Fixed order (newest first) — no sort options. Filters kept.
    const txById=id=>S.transactions.find(x=>x.id===id);
    let ev=(S.auditLog||[]).slice().sort((a,b)=>a.ts<b.ts?1:a.ts>b.ts?-1:0);
    total=(S.auditLog||[]).length;
    if(q) ev=ev.filter(e=>{ const t=txById(e.txId); const hay=(e.desc||(t&&t.description)||"")+" "+(e.changes||[]).map(c=>c.field+" "+c.from+" "+c.to).join(" "); return hay.toLowerCase().includes(q); });
    if(af) ev=ev.filter(e=>{ const t=txById(e.txId); return t&&t.lines.some(l=>l.accountId===af); });
    if(amtOn) ev=ev.filter(e=>{ const t=txById(e.txId); return t&&cmp(txAmount(t)); });
    count=ev.length;
    listHtml = ev.length ? ev.map(renderEvent).join("") : `<div class="empty">No activity matches these filters.</div>`;
  } else {
    // Entries = the ledger, including soft-deleted rows (shown muted with a Restore action).
    let txs=sortTxs([...all]);
    total=all.length;
    if(q) txs=txs.filter(t=>(t.description||"").toLowerCase().includes(q) || (t.comment||"").toLowerCase().includes(q));
    if(af) txs=txs.filter(t=>t.lines.some(l=>l.accountId===af));
    if(amtOn) txs=txs.filter(t=>cmp(txAmount(t)));
    count=txs.length;
    listHtml = txs.length ? txs.map(renderTxCard).join("") : `<div class="empty">No transactions match these filters.</div>`;
  }
  const modeSeg=`<div class="modeseg" role="group" aria-label="View">
      <button class="${mode==="entries"?"on":""}" data-action="ledger-mode" data-mode="entries">Entries</button>
      <button class="${mode==="activity"?"on":""}" data-action="ledger-mode" data-mode="activity">Activity</button>
    </div>`;
  const AMT_OPS=[["","operator…"],["gt","greater than >"],["gte","at least ≥"],["lt","less than <"],["lte","at most ≤"],["eq","equals ="]];
  const panel = `<div class="filterpanel${UI.filtersOpen?" open":""}">
      <label class="ffield"><select id="ledger-acct">${acctOpts}</select></label>
      <label class="ffield"><span class="amtrow"><select id="amt-op">${AMT_OPS.map(([k,l])=>`<option value="${k}" ${amtOp===k?"selected":""}>${l}</option>`).join("")}</select><input id="amt-val" type="text" inputmode="decimal" autocomplete="off" placeholder="Amount (${base()})" value="${escAttr(UI.amtVal||"")}"></span></label>
      <div class="ffield" style="justify-content:flex-end"><button class="btn sm" data-action="ledger-clear">Clear all</button></div>
    </div>`;
  const toolbar=`<div class="ledgerhead"><div class="ledgertools">
    <div class="lfilters">${modeSeg}
      <input id="ledger-q" class="lsearch" type="search" placeholder="Search…" value="${escAttr(UI.ledgerQuery||"")}" autocomplete="off">
      <button class="btn sm filterbtn${(UI.filtersOpen||nFilters)?" on":""}" data-action="toggle-filters" title="Filters" aria-expanded="${!!UI.filtersOpen}">${I.filter}<span>Filters</span>${nFilters?`<span class="fbadge">${nFilters}</span>`:""}</button>
      ${active?`<span class="lcount">${count} of ${total}</span>`:""}
    </div>
    ${mode==="entries"
      ? `<div class="lsort"><span>Sort</span><select id="ledger-sort">${LEDGER_SORTS.map(([k,l])=>`<option value="${k}" ${(UI.ledgerSort||"date-desc")===k?"selected":""}>${l}</option>`).join("")}</select></div>`
      : `<div class="lsort"><span class="muted" style="font-weight:400">Newest first</span></div>`}
  </div>${panel}</div>`;
  return toolbar+listHtml;
}
function renderTxCard(t){

      <span class="date">${t.date}${S.settings.showTxTime&&t.createdAt?` <span class="txtime">${esc(fmtTxTime(t.createdAt))}</span>`:""}</span>
      <span class="desc">${esc(t.description)}${del?` <span class="delbadge">Deleted</span>`:""}</span>
      <span class="txsum">${fmtBal(drBase)}<span class="cur">${base()}</span></span>
      ${del?`<button class="btn sm" data-action="restore-tx" data-id="${t.id}">Restore</button>`
           :`<button class="iconbtn" data-action="edit-tx" data-id="${t.id}" title="Edit">${I.edit}</button><button class="iconbtn" data-action="del-tx" data-id="${t.id}" title="Delete">${I.trash}</button>`}
    </div>
    <table class="txlines">
      <tbody>${t.lines.map(l=>{const a=acctById(l.accountId);const c=accCur(a);const isDr=(l.debit||0)>0;const amt=isDr?(l.debit||0):(l.credit||0);
        return `<tr><td class="acct">${a?esc(a.name):"—"}${c!==base()?` <span class="curtag">${c}</span>`:''}</td><td class="drcr">${isDr?"Dr":"Cr"}</td><td class="num">${fmt(amt,c)}</td></tr>`;}).join("")}</tbody>
    </table>
    ${t.comment?`<div class="txnote">${esc(t.comment)}</div>`:""}

}
function renderEvent(e){
  const t=S.transactions.find(x=>x.id===e.txId);
  const label={create:"Created",edit:"Edited",delete:"Deleted",restore:"Restored"}[e.action]||e.action;
  const desc=e.desc||(t?t.description:"(removed)");
  const changes=(e.action==="edit"&&e.changes&&e.changes.length)
    ? `<div class="ev-changes">${e.changes.map(c=>`<div><b>${esc(c.field)}</b> <span class="ev-from">${esc(String(c.from))||"∅"}</span> → <span class="ev-to">${esc(String(c.to))||"∅"}</span></div>`).join("")}</div>` : "";
  return `<div class="evrow ev-${esc(e.action)}">
    <div class="evhead"><span class="evtime">${esc(fmtCreated(e.ts))}</span><span class="evtag">${label}</span><span class="evdesc">${esc(desc)}</span>${t?`<button class="iconbtn" data-action="edit-tx" data-id="${e.txId}" title="Open">${I.edit}</button>`:""}</div>
    ${changes}
  </div>`;
}

// Account register: one account's postings with a running balance (a bank-statement view).
function viewAccount(id){
  const acc=acctById(id);
  if(!acc){ return `<div class="empty">Account not found. <a href="#" data-action="tab" data-view="accounts">Back to Accounts</a></div>`; }
  const cur=accCur(acc), t=typeById(acc.typeId), cls=classOf(acc);
  const normal=DEBIT_NORMAL.has(cls);
  const clsLabel=(CLASSES.find(([k])=>k===cls)||[,cls])[1];
  const ord=new Map(S.transactions.map((tx,i)=>[tx.id,i]));
  const posts=[];
  for(const tx of S.transactions){ if(tx.deleted) continue; for(const l of tx.lines) if(l.accountId===id) posts.push({tx,debit:l.debit||0,credit:l.credit||0}); }
  // oldest → newest so the running balance accumulates in chronological order
  posts.sort((a,b)=>(a.tx.date<b.tx.date?-1:a.tx.date>b.tx.date?1:0)||((ord.get(a.tx.id)??0)-(ord.get(b.tx.id)??0)));
  let run=0;
  posts.forEach(p=>{ p.run=round2(run+(normal?(p.debit-p.credit):(p.credit-p.debit))); run=p.run; });
  const curBal=run;
  const head=`<div class="reghead">
    <button class="btn sm" data-action="tab" data-view="accounts">← Accounts</button>
    <div class="reghead-main">
      <div class="regtitle">${esc(acc.name)}${cur!==base()?` <span class="curtag">${cur}</span>`:""}</div>
      <span class="regmeta">${esc(clsLabel)} · ${esc(t?t.name:"—")} · ${posts.length} posting${posts.length===1?"":"s"}</span>
    </div>
    <div class="regbal"><span class="regbal-l">Current balance</span><b>${money(curBal,cur)}</b>${cur!==base()?`<span class="regbal-sub">${money(toBase(curBal,cur),base())} ${base()}</span>`:""}</div>
  </div>`;
  if(!posts.length) return head+`<div class="empty">No postings in this account yet.</div>`;
  // display newest first; each row's Balance is the account balance right after that entry.
  // Row click expands an inline detail (both legs, recorded time, comment); the hover pencil edits.
  const expanded=UI.regExpanded||(UI.regExpanded=new Set());
  const body=posts.slice().reverse().map(p=>{
    const tx=p.tx, open=expanded.has(tx.id);
    const time=S.settings.showTxTime&&tx.createdAt?` <span class="txtime">${esc(fmtTxTime(tx.createdAt))}</span>`:"";
    const main=`<tr class="regrow${open?" open":""}" data-action="reg-expand" data-id="${tx.id}" title="Click for details">
      <td class="rdate">${tx.date}${time}</td>
      <td class="rdesc"><span class="rchev">${open?"▾":"▸"}</span>${esc(tx.description)}</td>
      <td class="num">${p.debit?money(p.debit,cur):""}</td>
      <td class="num">${p.credit?money(p.credit,cur):""}</td>
      <td class="num rbal">${money(p.run,cur)}</td>
      <td class="redit"><button class="iconbtn rowedit" data-action="edit-tx" data-id="${tx.id}" title="Edit entry">${I.edit}</button></td>
    </tr>`;
    if(!open) return main;
    const legs=tx.lines.map(l=>{const a=acctById(l.accountId);const c2=accCur(a);const isDr=(l.debit||0)>0;const amt=isDr?(l.debit||0):(l.credit||0);
      return `<div class="dleg${a&&a.id===UI.accountId?" self":""}"><span class="dleg-acct">${a?esc(a.name):"—"}</span><span class="dleg-drcr">${isDr?"Dr":"Cr"}</span><span class="dleg-amt">${money(amt,c2)}${c2!==base()?` <span class="curtag">${c2}</span>`:""}</span></div>`;}).join("");
    const detail=`<tr class="regdetail"><td colspan="6"><div class="rdetail">
      <div class="rdetail-legs">${legs}</div>
      <div class="rdetail-meta">Accounting date <b>${tx.date}</b>${tx.createdAt?` · Recorded <b>${esc(fmtCreated(tx.createdAt))}</b>`:""}${tx.comment?` · ${esc(tx.comment)}`:""}</div>
    </div></td></tr>`;
    return main+detail;
  }).join("");
  return head+`<table class="register">
    <thead><tr><th>Date</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th><th></th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

/* ---- in-page dialogs (native alert/confirm are blocked in the sandbox) ---- */
let toastT=null;
function toast(msg){ const r=document.getElementById("toast-root"); if(!r) return; r.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>{r.innerHTML="";},2800); }
// Undo toast: the change has ALREADY been applied (append-only), and Undo appends the *compensating*
// event that reverses it — never erasing history. `fn` performs that compensating append.
let toastUndoFn=null;
function undoToast(msg,fn){ const r=document.getElementById("toast-root"); if(!r){ return; } toastUndoFn=fn; r.innerHTML=`<div class="toast"><span>${esc(msg)}</span><button class="toast-act" data-action="toast-undo">Undo</button></div>`; clearTimeout(toastT); toastT=setTimeout(()=>{ r.innerHTML=""; toastUndoFn=null; },6000); }
// A meaningful empty state: an icon, what the screen is for, and one clear next step (a CTA).
function emptyState(title,text,btnHtml,icon){
  return `<div class="empty2"><div class="empty2-ic">${icon||I.coin}</div><h3>${esc(title)}</h3><p>${esc(text)}</p>${btnHtml||""}</div>`;
}
// Soft-delete a transaction and offer an append-only Undo (which re-appends a "restore" event).
function softDeleteTx(did){
  const t=S.transactions.find(x=>x.id===did); if(!t) return;
  t.deleted=true; t.deletedAt=new Date().toISOString(); logAudit("delete",did,{desc:t.description});
  save(); render();
  undoToast("Transaction deleted", ()=>{
    const tt=S.transactions.find(x=>x.id===did);
    if(tt){ delete tt.deleted; delete tt.deletedAt; logAudit("restore",did,{desc:tt.description}); save(); render(); toast("Restored"); }
  });
}
/* animate the modal out, then clear it and run an optional callback */
function dismissModal(cb){
  const ov=document.querySelector(".overlay");
  const finish=()=>{ pendingConfirm=null; UI.modal=null; UI.acctPickOpen=null; UI.acctPickFilter=""; UI.datePickOpen=false; UI.curOpen=null; renderModal(); if(cb){ try{ cb(); }catch(e){} } };
  if(!ov || window.matchMedia("(prefers-reduced-motion:reduce)").matches){ finish(); return; }
  ov.classList.add("closing");
  setTimeout(finish,160);
}
let pendingConfirm=null;
function askConfirm(message,onYes){ pendingConfirm=onYes; UI.modal={kind:"confirm",message}; renderModal(); }

/* ---- offline desktop build: zip the running app + a tiny local server
   that persists to ledger.json AND proxies exchange-rate lookups. ---- */
function buildLocalHTML(){
  const styleText=[...document.querySelectorAll('style')].map(s=>s.textContent).join("\n");
  const scriptText=([...document.querySelectorAll('script')].map(s=>s.textContent).filter(t=>t&&t.indexOf("function saveTx")>-1)[0])||"";
  return "<!doctype html>\n<html lang=\"en\" translate=\"no\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"referrer\" content=\"no-referrer\">\n<meta name=\"google\" content=\"notranslate\">\n<title>Ledgerbook</title>\n<style>\n"+styleText+"\n</style>\n</head><body spellcheck=\"false\">\n<div id=\"app\"></div>\n<div id=\"modal-root\"></div>\n<div id=\"toast-root\"></div>\n<svg width=\"0\" height=\"0\" style=\"position:absolute;pointer-events:none\" aria-hidden=\"true\"><defs><filter id=\"pixelate\" x=\"0\" y=\"0\" width=\"100%\" height=\"100%\"><feFlood x=\"1\" y=\"1\" width=\"1\" height=\"1\"/><feComposite width=\"5\" height=\"5\"/><feTile result=\"a\"/><feComposite in=\"SourceGraphic\" in2=\"a\" operator=\"in\"/><feMorphology operator=\"dilate\" radius=\"2\"/></filter></defs></svg>\n<script>\n"+scriptText+"\n<\/script>\n</body></html>\n";
}
const SERVER_GO="// Ledgerbook local server (Go, standard library only).\n// Serves index.html and owns the data files. Many ledgers: config.json holds a registry\n// { ledgersRoot, current, ledgers:[{id,name,path,snapshotDir,color}] } and the server always\n// reads/writes the CURRENT ledger. /api/ledgers lists, creates, switches, renames, recolours and\n// removes them. A v1 single-ledger config (or a fresh start) is migrated into the registry WITHOUT\n// moving any file. New ledgers are created under ledgersRoot (iCloud Drive when present, else\n// ~/PersonalWealthTracker).\n//   ledger override : $LEDGER_PATH   (applies to the current ledger)\n//   snapshot override: $SNAPSHOT_DIR  (applies to the current ledger)\n// A snapshot is written on every save (deduped; newest snapKeep retained).\npackage main\n\nimport (\n\t\"crypto/sha256\"\n\t\"encoding/hex\"\n\t\"encoding/json\"\n\t\"io\"\n\t\"math/rand\"\n\t\"net/http\"\n\t\"net/url\"\n\t\"os\"\n\t\"os/exec\"\n\t\"path/filepath\"\n\t\"regexp\"\n\t\"sort\"\n\t\"strconv\"\n\t\"strings\"\n\t\"time\"\n)\n\nfunc git(args ...string) string {\n\tout, err := exec.Command(\"git\", args...).Output()\n\tif err != nil {\n\t\treturn \"\"\n\t}\n\treturn strings.TrimSpace(string(out))\n}\n\nconst project = \"personal-wealth-tracker\"\nconst snapKeep = 300\nconst configSchema = 2\n\n// Single source of truth: the version lives ONLY in index.html's VERSION, read once at startup\n// (frozen for this process) so the frontend can detect a stale, not-yet-restarted server.\nvar appVersion = readAppVersion()\n\nfunc readAppVersion() string {\n\tb, err := os.ReadFile(\"index.html\")\n\tif err != nil {\n\t\treturn \"unknown\"\n\t}\n\tif m := regexp.MustCompile(`const VERSION=\"(v\\d+)\"`).FindSubmatch(b); m != nil {\n\t\treturn string(m[1])\n\t}\n\treturn \"unknown\"\n}\n\n// etagOf is an optimistic-concurrency token derived from the file's bytes: it changes on every\n// save, so a PUT with a stale If-Match is refused (409) and a stale in-memory copy can never\n// clobber a fresher file on disk.\nfunc etagOf(b []byte) string { s := sha256.Sum256(b); return `\"` + hex.EncodeToString(s[:])[:16] + `\"` }\n\nfunc home() string { h, _ := os.UserHomeDir(); return h }\n\nfunc defaultConfigDir() string {\n\tif v := os.Getenv(\"PWT_CONFIG_DIR\"); v != \"\" {\n\t\treturn v\n\t}\n\twd, _ := os.Getwd()\n\treturn filepath.Join(wd, \".pwt\") // project-local (git-ignored), not a hidden system folder\n}\n\nvar (\n\tconfigDir  = defaultConfigDir()\n\tconfigFile = filepath.Join(configDir, \"config.json\")\n\tiCloudBase = filepath.Join(home(), \"Library\", \"Mobile Documents\", \"com~apple~CloudDocs\")\n\tiCloudDir  = filepath.Join(iCloudBase, \"PersonalWealthTracker\")\n\thomeDir    = filepath.Join(home(), \"PersonalWealthTracker\")\n\t// New ledgers land here: iCloud Drive when it exists (syncs across the user's Macs), else a plain home folder.\n\tdefaultRoot = func() string { if exists(iCloudBase) { return iCloudDir }; return homeDir }()\n\t// A fixed set of distinct identity colours; each ledger gets a different one.\n\tpalette = []string{\"#2f7d5b\", \"#3563b8\", \"#b0741a\", \"#8a4fbe\", \"#b23a48\", \"#2a8f8f\", \"#6b8f2a\", \"#c25d8a\", \"#4a6fa5\", \"#a0562a\", \"#5a5f8f\", \"#3f8f5a\"}\n)\n\ntype ledgerEntry struct {\n\tID          string `json:\"id\"`\n\tName        string `json:\"name\"`\n\tPath        string `json:\"path\"`\n\tSnapshotDir string `json:\"snapshotDir\"`\n\tColor       string `json:\"color\"`\n}\n\ntype config struct {\n\tSchema      int           `json:\"schema,omitempty\"`\n\tLedgersRoot string        `json:\"ledgersRoot,omitempty\"`\n\tCurrent     string        `json:\"current,omitempty\"`\n\tLedgers     []ledgerEntry `json:\"ledgers,omitempty\"`\n\t// legacy v1 fields, read only to migrate\n\tLedgerPath  string `json:\"ledgerPath,omitempty\"`\n\tSnapshotDir string `json:\"snapshotDir,omitempty\"`\n}\n\nvar cfg config\nvar ledger string\nvar snapDir string\n\nfunc exists(p string) bool { _, err := os.Stat(p); return err == nil }\n\nfunc uid() string {\n\tconst cs = \"abcdefghijklmnopqrstuvwxyz0123456789\"\n\tb := make([]byte, 8)\n\tfor i := range b {\n\t\tb[i] = cs[rand.Intn(len(cs))]\n\t}\n\treturn string(b)\n}\n\nfunc slug(s string) string {\n\ts = strings.ToLower(s)\n\tvar b strings.Builder\n\tprevDash := false\n\tfor _, r := range s {\n\t\tif (r >= 'a' && r <= 'z') || (r >= '0' && r <= '9') {\n\t\t\tb.WriteRune(r)\n\t\t\tprevDash = false\n\t\t} else if !prevDash {\n\t\t\tb.WriteByte('-')\n\t\t\tprevDash = true\n\t\t}\n\t}\n\tout := strings.Trim(b.String(), \"-\")\n\tif len(out) > 40 {\n\t\tout = out[:40]\n\t}\n\tif out == \"\" {\n\t\tout = \"ledger\"\n\t}\n\treturn out\n}\n\nfunc nextColor(ledgers []ledgerEntry) string {\n\tused := map[string]bool{}\n\tfor _, l := range ledgers {\n\t\tused[l.Color] = true\n\t}\n\tfor _, c := range palette {\n\t\tif !used[c] {\n\t\t\treturn c\n\t\t}\n\t}\n\treturn palette[len(ledgers)%len(palette)]\n}\n\nfunc loadConfig() config {\n\tvar c config\n\tif b, err := os.ReadFile(configFile); err == nil {\n\t\t_ = json.Unmarshal(b, &c)\n\t}\n\treturn c\n}\nfunc saveConfig(c config) error {\n\tif err := os.MkdirAll(configDir, 0o755); err != nil {\n\t\treturn err\n\t}\n\t// don't persist the legacy fields back out\n\tc.LedgerPath, c.SnapshotDir = \"\", \"\"\n\tb, _ := json.MarshalIndent(c, \"\", \"  \")\n\treturn os.WriteFile(configFile, b, 0o644)\n}\n\n// migrate brings any older config shape up to the registry, without moving a single file on disk.\nfunc migrate(c config) config {\n\tif len(c.Ledgers) > 0 {\n\t\tc.Schema = configSchema\n\t\tif c.LedgersRoot == \"\" {\n\t\t\tc.LedgersRoot = defaultRoot\n\t\t}\n\t\tfor i := range c.Ledgers {\n\t\t\tif c.Ledgers[i].ID == \"\" {\n\t\t\t\tc.Ledgers[i].ID = uid()\n\t\t\t}\n\t\t\tif c.Ledgers[i].Color == \"\" {\n\t\t\t\tc.Ledgers[i].Color = palette[i%len(palette)]\n\t\t\t}\n\t\t\tif c.Ledgers[i].SnapshotDir == \"\" {\n\t\t\t\tc.Ledgers[i].SnapshotDir = filepath.Join(filepath.Dir(c.Ledgers[i].Path), \"snapshots\")\n\t\t\t}\n\t\t}\n\t\tif c.Current == \"\" {\n\t\t\tc.Current = c.Ledgers[0].ID\n\t\t}\n\t\treturn c\n\t}\n\toldPath := os.Getenv(\"LEDGER_PATH\")\n\tif oldPath == \"\" {\n\t\toldPath = c.LedgerPath\n\t}\n\tif oldPath == \"\" {\n\t\tif wd, err := os.Getwd(); err == nil && exists(filepath.Join(wd, \"ledger.json\")) {\n\t\t\toldPath = filepath.Join(wd, \"ledger.json\")\n\t\t} else {\n\t\t\toldPath = filepath.Join(defaultRoot, \"ledger.json\")\n\t\t}\n\t}\n\toldSnap := os.Getenv(\"SNAPSHOT_DIR\")\n\tif oldSnap == \"\" {\n\t\toldSnap = c.SnapshotDir\n\t}\n\tif oldSnap == \"\" {\n\t\toldSnap = filepath.Join(filepath.Dir(oldPath), \"snapshots\")\n\t}\n\troot := c.LedgersRoot\n\tif root == \"\" {\n\t\troot = defaultRoot\n\t}\n\tid := uid()\n\treturn config{Schema: configSchema, LedgersRoot: root, Current: id, Ledgers: []ledgerEntry{{ID: id, Name: \"My ledger\", Path: oldPath, SnapshotDir: oldSnap, Color: palette[0]}}}\n}\n\nfunc curEntry() *ledgerEntry {\n\tfor i := range cfg.Ledgers {\n\t\tif cfg.Ledgers[i].ID == cfg.Current {\n\t\t\treturn &cfg.Ledgers[i]\n\t\t}\n\t}\n\tif len(cfg.Ledgers) > 0 {\n\t\treturn &cfg.Ledgers[0]\n\t}\n\treturn nil\n}\nfunc pathOf(e *ledgerEntry) string {\n\tif v := os.Getenv(\"LEDGER_PATH\"); v != \"\" {\n\t\treturn v\n\t}\n\treturn e.Path\n}\nfunc snapOf(e *ledgerEntry) string {\n\tif v := os.Getenv(\"SNAPSHOT_DIR\"); v != \"\" {\n\t\treturn v\n\t}\n\tif e.SnapshotDir != \"\" {\n\t\treturn e.SnapshotDir\n\t}\n\treturn filepath.Join(filepath.Dir(pathOf(e)), \"snapshots\")\n}\nfunc useCurrent() {\n\tif e := curEntry(); e != nil {\n\t\tledger = pathOf(e)\n\t\tsnapDir = snapOf(e)\n\t}\n}\n\nfunc stamp() string { return time.Now().Format(\"20060102-150405\") }\n\nfunc snapList() []string {\n\tentries, err := os.ReadDir(snapDir)\n\tif err != nil {\n\t\treturn nil\n\t}\n\tvar out []string\n\tfor _, e := range entries {\n\t\tn := e.Name()\n\t\tif strings.HasPrefix(n, project+\"_\") && strings.HasSuffix(n, \".json\") {\n\t\t\tout = append(out, n)\n\t\t}\n\t}\n\tsort.Strings(out)\n\treturn out\n}\n\nfunc writeSnapshot(body []byte) {\n\tif err := os.MkdirAll(snapDir, 0o755); err != nil {\n\t\treturn\n\t}\n\tbefore := snapList()\n\tif len(before) > 0 {\n\t\tif last, err := os.ReadFile(filepath.Join(snapDir, before[len(before)-1])); err == nil && string(last) == string(body) {\n\t\t\treturn // dedupe\n\t\t}\n\t}\n\t_ = os.WriteFile(filepath.Join(snapDir, project+\"_\"+stamp()+\".json\"), body, 0o644)\n\tafter := snapList()\n\tfor i := 0; i < len(after)-snapKeep; i++ {\n\t\t_ = os.Remove(filepath.Join(snapDir, after[i]))\n\t}\n}\n\nfunc writeJSON(w http.ResponseWriter, code int, v any) {\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tw.WriteHeader(code)\n\t_ = json.NewEncoder(w).Encode(v)\n}\n\nfunc main() {\n\tcfg = migrate(loadConfig())\n\t_ = saveConfig(cfg) // persist the migrated registry once at startup\n\tuseCurrent()\n\n\tport := os.Getenv(\"PORT\")\n\tif port == \"\" {\n\t\tport = \"8123\"\n\t}\n\tmux := http.NewServeMux()\n\n\tmux.HandleFunc(\"/api/ping\", func(w http.ResponseWriter, r *http.Request) { w.Write([]byte(\"ok\")) })\n\n\tmux.HandleFunc(\"/api/version\", func(w http.ResponseWriter, r *http.Request) {\n\t\tif git(\"rev-parse\", \"--is-inside-work-tree\") != \"true\" {\n\t\t\twriteJSON(w, 200, map[string]any{\"appVersion\": appVersion, \"isRepo\": false})\n\t\t\treturn\n\t\t}\n\t\twriteJSON(w, 200, map[string]any{\"appVersion\": appVersion, \"isRepo\": true, \"commit\": git(\"rev-parse\", \"--short\", \"HEAD\"),\n\t\t\t\"tag\": git(\"describe\", \"--tags\", \"--exact-match\", \"HEAD\"), \"date\": git(\"show\", \"-s\", \"--format=%cs\", \"HEAD\"), \"dirty\": git(\"status\", \"--porcelain\") != \"\"})\n\t})\n\n\tmux.HandleFunc(\"/api/pick\", func(w http.ResponseWriter, r *http.Request) {\n\t\tkind := r.URL.Query().Get(\"kind\")\n\t\tscript := `POSIX path of (choose folder with prompt \"Choose a folder\")`\n\t\tif kind == \"file\" {\n\t\t\tscript = `POSIX path of (choose file with prompt \"Locate your ledger file\")`\n\t\t}\n\t\tout, err := exec.Command(\"osascript\", \"-e\", script).Output()\n\t\tif err != nil {\n\t\t\twriteJSON(w, 200, map[string]any{\"cancelled\": true})\n\t\t\treturn\n\t\t}\n\t\twriteJSON(w, 200, map[string]any{\"path\": strings.TrimSpace(string(out))})\n\t})\n\n\t// ---- ledger registry: list / create / switch / rename / recolour / remove ----\n\tmux.HandleFunc(\"/api/ledgers\", func(w http.ResponseWriter, r *http.Request) {\n\t\tswitch r.Method {\n\t\tcase http.MethodGet:\n\t\t\tled := make([]map[string]any, 0, len(cfg.Ledgers))\n\t\t\tused := make([]string, 0, len(cfg.Ledgers))\n\t\t\tfor i := range cfg.Ledgers {\n\t\t\t\tl := &cfg.Ledgers[i]\n\t\t\t\tled = append(led, map[string]any{\"id\": l.ID, \"name\": l.Name, \"path\": l.Path, \"color\": l.Color, \"exists\": exists(pathOf(l)), \"current\": l.ID == cfg.Current})\n\t\t\t\tused = append(used, l.Color)\n\t\t\t}\n\t\t\twriteJSON(w, 200, map[string]any{\"ledgersRoot\": cfg.LedgersRoot, \"current\": cfg.Current, \"palette\": palette, \"usedColors\": used, \"ledgers\": led})\n\t\tcase http.MethodPost:\n\t\t\tvar o struct{ Name, Color string }\n\t\t\tb, _ := io.ReadAll(r.Body)\n\t\t\t_ = json.Unmarshal(b, &o)\n\t\t\tname := strings.TrimSpace(o.Name)\n\t\t\tif name == \"\" {\n\t\t\t\tname = \"New ledger\"\n\t\t\t}\n\t\t\tcolor := o.Color\n\t\t\tif color != \"\" {\n\t\t\t\tfor _, l := range cfg.Ledgers {\n\t\t\t\t\tif l.Color == color {\n\t\t\t\t\t\twriteJSON(w, 409, map[string]string{\"error\": \"That colour is already used by another ledger.\"})\n\t\t\t\t\t\treturn\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\tcolor = nextColor(cfg.Ledgers)\n\t\t\t}\n\t\t\troot := cfg.LedgersRoot\n\t\t\tbn := slug(name)\n\t\t\tp := filepath.Join(root, bn+\".json\")\n\t\t\tfor n := 1; ; n++ {\n\t\t\t\ttaken := exists(p)\n\t\t\t\tfor _, l := range cfg.Ledgers {\n\t\t\t\t\tif l.Path == p {\n\t\t\t\t\t\ttaken = true\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tif !taken {\n\t\t\t\t\tbreak\n\t\t\t\t}\n\t\t\t\tp = filepath.Join(root, bn+\"-\"+strconv.Itoa(n+1)+\".json\")\n\t\t\t}\n\t\t\tif err := os.MkdirAll(filepath.Dir(p), 0o755); err != nil {\n\t\t\t\twriteJSON(w, 500, map[string]string{\"error\": err.Error()})\n\t\t\t\treturn\n\t\t\t}\n\t\t\tif !exists(p) {\n\t\t\t\t_ = os.WriteFile(p, []byte(\"null\"), 0o644)\n\t\t\t}\n\t\t\te := ledgerEntry{ID: uid(), Name: name, Path: p, SnapshotDir: filepath.Join(root, \"snapshots\", strings.TrimSuffix(filepath.Base(p), \".json\")), Color: color}\n\t\t\tcfg.Ledgers = append(cfg.Ledgers, e)\n\t\t\tcfg.Current = e.ID\n\t\t\t_ = saveConfig(cfg)\n\t\t\tuseCurrent()\n\t\t\twriteJSON(w, 200, map[string]any{\"ok\": true, \"id\": e.ID, \"current\": cfg.Current})\n\t\tcase http.MethodPut:\n\t\t\tvar o struct{ Op, ID, Name, Color string }\n\t\t\tb, _ := io.ReadAll(r.Body)\n\t\t\t_ = json.Unmarshal(b, &o)\n\t\t\tfind := func(id string) *ledgerEntry {\n\t\t\t\tfor i := range cfg.Ledgers {\n\t\t\t\t\tif cfg.Ledgers[i].ID == id {\n\t\t\t\t\t\treturn &cfg.Ledgers[i]\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\treturn nil\n\t\t\t}\n\t\t\te := find(o.ID)\n\t\t\tswitch o.Op {\n\t\t\tcase \"switch\":\n\t\t\t\tif e == nil {\n\t\t\t\t\twriteJSON(w, 404, map[string]string{\"error\": \"no such ledger\"})\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tcfg.Current = e.ID\n\t\t\t\t_ = saveConfig(cfg)\n\t\t\t\tuseCurrent()\n\t\t\t\twriteJSON(w, 200, map[string]any{\"ok\": true, \"current\": cfg.Current})\n\t\t\tcase \"rename\":\n\t\t\t\tif e == nil {\n\t\t\t\t\twriteJSON(w, 404, map[string]string{\"error\": \"no such ledger\"})\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tif n := strings.TrimSpace(o.Name); n != \"\" {\n\t\t\t\t\te.Name = n\n\t\t\t\t}\n\t\t\t\t_ = saveConfig(cfg)\n\t\t\t\twriteJSON(w, 200, map[string]any{\"ok\": true})\n\t\t\tcase \"color\":\n\t\t\t\tif e == nil {\n\t\t\t\t\twriteJSON(w, 404, map[string]string{\"error\": \"no such ledger\"})\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tfor _, l := range cfg.Ledgers {\n\t\t\t\t\tif l.ID
