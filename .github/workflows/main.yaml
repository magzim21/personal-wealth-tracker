name: main
run-name: ${{ github.event_name == 'schedule' && 'scheduled 🗓️' || format('{0} — {1} 🏗️', github.actor, github.event.head_commit.message) }}

on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write # semantic-release: create tags/releases
  pages: write # deploy GitHub Pages
  id-token: write # Pages OIDC

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, test & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks + commitlint

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # 1. commit message formatting (Conventional Commits)
      - name: Commit message lint
        if: github.event_name == 'push'
        run: |
          npm install --no-save @commitlint/cli @commitlint/config-conventional
          npx commitlint --config ".githooks/.commitlintrc.yml" --last --verbose

      # 2. tests / linting of the app
      - name: Smoke test
        run: node scripts/smoke-test.mjs

      # 3a. accidental ledger / sensitive data
      - name: No personal-finance data committed
        run: bash scripts/check-no-financial-data.sh

      # 3b. git leaks (secrets)
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. release tagging (semantic version) — prod pushes only
  release:
    name: Semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release

  # 5. GitHub Pages — prod pushes only
  pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (app only, keep custom domain)
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          echo "personal-wealth-tracker.maxim.run" > _site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
